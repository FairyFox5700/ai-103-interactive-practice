 to visual input.","whyNot":"A text-only language model cannot directly inspect image pixels. An embedding model converts content into vectors for comparison, and an image-generation model creates images rather than primarily answering questions about supplied visuals.","takeaway":"When a solution must understand images and answer in text, choose a vision-capable multimodal model.","reviewNote":null,"docs":[{"title":"How to use vision-enabled chat models","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/gpt-with-vision"}]},{"id":"QA-136","n":136,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":81,"question":"How can you submit a prompt that asks a model to analyze an image?","options":[{"key":"A","text":"Submit one prompt with an image-based message followed by another prompt with a text-based"},{"key":"B","text":"Submit a prompt that contains a multi-part user message, containing both text"},{"key":"C","text":"Submit the image as the system message and the instruction or question as the user message."}],"correct":["B"],"type":"mcq","answer":"B. Send one prompt with a multipart user message containing text and image content.","why":"The model needs both the instruction and the image in the same conversational turn. A multipart user message provides a typed text item for the question and a typed image item for the visual evidence. The model can then reason over the image in the context of that exact prompt. This is the standard request shape for vision-enabled chat analysis.","whyNot":"Sending only the image omits the requested analysis task, while sending only a URL as plain text does not identify it as image content. Separate unrelated requests also fail to bind the question and visual context as clearly as one multipart message.","takeaway":"Ask about an image by placing the text prompt and image content in one multipart user message.","reviewNote":null,"docs":[{"title":"How to use vision-enabled chat models","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/gpt-with-vision"}]},{"id":"QA-137","n":137,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":82,"question":"How can you include an image in a message?","options":[{"key":"A","text":"As a URL or as binary data"},{"key":"B","text":"Only as a URL"},{"key":"C","text":"Only as binary data"}],"correct":["A"],"type":"mcq","answer":"A. As a URL or as base64-encoded image data.","why":"Vision chat requests can reference an image through a reachable URL. They can also carry encoded image bytes in a base64 data URL when hosting the image separately is undesirable. Both forms populate an image content part that the model recognizes as visual input. This makes the choice broad enough for remote and inline image scenarios.","whyNot":"Raw binary bytes cannot simply be inserted into a JSON text field without encoding. A local file path is meaningful only to the client machine and is not automatically accessible to the remote model service.","takeaway":"Supply vision input as an accessible image URL or a base64 data URL, not as a local path or raw bytes.","reviewNote":null,"docs":[{"title":"How to use vision-enabled chat models","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/gpt-with-vision"}]},{"id":"QA-138","n":138,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":82,"question":"What is the purpose of grounding in Content Understanding?","options":[{"key":"A","text":"To connect Content Understanding to Azure storage"},{"key":"B","text":"To identify the specific regions in content where each value was extracted"},{"key":"C","text":"To filter out harmful content from images"}],"correct":["B"],"type":"mcq","answer":"B. Identify the specific source regions from which values were extracted or generated.","why":"Grounding records where an extracted or generated value came from in the source content. For a document, this can identify a page region or text span associated with a field. Reviewers can use that link to verify the value against the original evidence. The feature therefore provides traceability rather than merely another confidence estimate.","whyNot":"Confidence indicates how strongly the analyzer supports a result, but it does not by itself show the exact source location. Grounding also does not translate content or define the extraction schema; those are separate processing and configuration concerns.","takeaway":"Use grounding to trace an analyzer output back to the exact source region or span that supports it.","reviewNote":null,"docs":[{"title":"Content Understanding glossary","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/glossary"},{"title":"Validate document analyzer quality with confidence and grounding","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/document/analyzer-improvement"}]},{"id":"QA-139","n":139,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":82,"question":"What does a confidence score of 0.95 indicate for an extracted field?","options":[{"key":"A","text":"The extraction failed and needs manual review"},{"key":"B","text":"The value can be trusted for automated processing"},{"key":"C","text":"The field was classified rather than extracted"}],"correct":["B"],"type":"mcq","answer":"B. It is a high-confidence value suitable for automated processing under the application's threshold policy.","why":"Content Understanding confidence values express the analyzer's estimated certainty on a scale from low to high. A value of 0.95 is near the high end, so it is a strong candidate for automated processing. The application should compare it with a threshold validated for the document type and business risk. It remains an estimate, not proof that the extracted field is always correct.","whyNot":"A 0.95 score does not mean the field is guaranteed correct or that review can never be required. Treating every score identically would discard the purpose of confidence-based routing, while automatically rejecting such a high score would normally contradict a threshold policy designed for straight-through processing.","takeaway":"Interpret a high confidence score through the application's validated threshold policy, not as an absolute guarantee.","reviewNote":null,"docs":[{"title":"Validate document analyzer quality with confidence and grounding","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/document/analyzer-improvement"}]},{"id":"QA-140","n":140,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":82,"question":"What kinds of AI solution is Azure Content Understanding designed to help you build?","options":[{"key":"A","text":"Chatbots that automatically translate between multiple spoken and written languages."},{"key":"B","text":"Analyzers that extract information from documents, images, videos, and audio files."},{"key":"C","text":"Image generators that create visualizations based on descriptions."}],"correct":["B"],"type":"mcq","answer":"B. Analyzers that extract information from documents, images, videos, and audio files.","why":"Azure Content Understanding is built to turn unstructured multimodal content into structured results. Its analyzers can process documents and images as well as audio and video. A schema defines the fields or insights that the analyzer should return across those inputs. That makes multimodal information extraction the service's central solution pattern.","whyNot":"Translator focuses on converting languages, and a chatbot focuses on conversational generation rather than structured multimodal extraction. Image generation creates new visuals, while Content Understanding analyzes existing content to recover information from it.","takeaway":"Choose Content Understanding when the goal is structured extraction across documents, images, audio, or video.","reviewNote":null,"docs":[{"title":"What is Azure Content Understanding in Foundry Tools?","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/overview"}]},{"id":"QA-141","n":141,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":83,"question":"Which graphical tool should you use to create an Azure Content Understanding project?","options":[{"key":"A","text":"Microsoft Visual Studio."},{"key":"B","text":"Azure Machine Learning studio."},{"key":"C","text":"Content Understanding Studio."}],"correct":["C"],"type":"mcq","answer":"C. Content Understanding Studio.","why":"Content Understanding Studio is the graphical environment for working with Content Understanding assets. It lets a user create a project, define the output schema, build an analyzer, and test it against sample content. Those visual authoring and validation steps match the request for a graphical tool. Programmatic APIs remain available, but they are not the GUI asked for here.","whyNot":"The Azure portal manages resources and access but is not the dedicated visual analyzer-authoring experience. An SDK or REST client can create analyzers through code, which increases development effort and does not satisfy the explicit graphical-tool cue.","takeaway":"When the question asks for visual creation and testing of a Content Understanding analyzer, choose Content Understanding Studio.","reviewNote":null,"docs":[{"title":"Create a Content Understanding analyzer","url":"https://learn.microsoft.com/en-us/training/modules/analyze-content-ai/03-create-analyzer"},{"title":"Content Understanding Studio and Microsoft Foundry","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/foundry-vs-content-understanding-studio"}]},{"id":"QA-142","n":142,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":83,"question":"… Video segmentation is enabled. You need to configure an analyzer to output a generated JSON field that describes the color scheme of each video segment. How should you configure the analyzer? To answer, drag the appropriate values to the correct targets. Each value may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Keep video segmentation enabled and add a custom field such as colorScheme with type string, method generate, and a description instructing the analyzer to describe each segment's color scheme.","why":"With video segmentation enabled, the analyzer produces results for each identified segment rather than treating the entire video as one undivided item. A custom string field gives the output a place to hold a natural-language color-scheme description. Setting the field method to generate tells the analyzer to infer descriptive text instead of copying a directly extracted token. A precise field description guides the generated value toward the color palette of each segment.","whyNot":"An extract method is better for literal values present in source text, not a synthesized visual description. Disabling segmentation would prevent segment-level outputs, and a numeric or boolean field could not naturally represent a descriptive color scheme.","takeaway":"For a descriptive value per video segment, keep segmentation on and define a generated string field with a precise description.","reviewNote":null,"docs":[{"title":"Azure Content Understanding video overview","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/video/overview"},{"title":"Content Understanding analyzer configuration reference","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"}]},{"id":"QA-143","n":143,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":84,"question":"… Include a pipeline named Pipeline1 that supports cost-effective, high-volume processing of standalone PDF invoices. Include a pipeline named Pipeline2 that supports cross-document validation by using multi-step reasoning and reference data. How should you configure each pipeline? To answer, drag the appropriate configurations to the correct pipelines. Each configuration may be used once, more than once, of not at all. You may need to drag the split bar between panes or scroll to view content. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Pipeline1: a single-file task in standard mode. Pipeline2: a multi-file task in pro mode with reference data.","why":"Pipeline1 processes independent PDF invoices at high volume, so standard mode fits its cost and latency priorities. A single-file task matches the fact that each invoice can be analyzed on its own. Pipeline2 must compare multiple documents, reason through validation steps, and consult reference data. Those clues point to a multi-file task in pro mode with reference data attached.","whyNot":"Using pro mode for the standalone invoice pipeline would add capabilities that the scenario does not require and would not be the cost-focused choice. Standard single-file processing cannot satisfy Pipeline2's cross-document reasoning and reference-data requirements.","takeaway":"Use standard single-file processing for high-volume independent files, and pro multi-file processing for cross-document reasoning with reference data.","reviewNote":null,"docs":[{"title":"What's new in Azure Content Understanding","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/whats-new"}]},{"id":"QA-144","n":144,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":84,"question":"You have an invoice-processing application named App1 that uses Azure Constant Understanding in Foundry Tools. You are building a new Content Understanding pipeline named Pipeline1 that must meet the following requirements: • Compare an invoice to its related purchase order • Validate the voice against static vendor contact documents • Return a single structured output that includes discrepancy findings You need to configure Pipeline1 and expose the pipeline as a single analyzer endpoint. What should you configure?","options":[{"key":"A","text":"a single-file task in standard mode that uses the vendor contract provided as an additional"},{"key":"B","text":"a single-file task in standard mode that uses confidence scores enabled for the extracted fields."},{"key":"C","text":"a multiple-file task in pro mode that uses the vendor contract files as reference data"},{"key":"D","text":"a multi-file task in standard mode that uses the invoice and purchase order as input to the"}],"correct":["C"],"type":"mcq","answer":"C. A multi-file task in pro mode that uses the vendor contract files as reference data.","why":"The pipeline must reason over an invoice and its related purchase order, so the inputs form a multi-file task. It must also validate those inputs against static vendor contracts, which serve as reference data rather than as another independent transaction. Pro mode supplies the multi-step, cross-document reasoning needed to produce combined discrepancy findings. Exposing that configuration as one analyzer returns a single structured result for the complete validation task.","whyNot":"A standard single-file analyzer cannot compare the invoice with the purchase order and contracts as one reasoning unit. Treating each file with separate unrelated analyzers would force the application to perform the cross-document validation and aggregation itself.","takeaway":"Choose a pro multi-file task with reference data when one structured result depends on comparing transaction documents against static evidence.","reviewNote":null,"docs":[{"title":"What's new in Azure Content Understanding","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/whats-new"}]},{"id":"QA-145","n":145,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":85,"question":"HOTSPOT HOTSPOT - You develop a test method to verify the results retrieved from a call to the Azure Vision in Foundry Tools API. The call is used to analyze the existence of company logos in images. The call returns a collection of brands named brands. You have the following code segment:","options":[],"correct":[],"type":"review","answer":"None","why":"The question asks for truth values derived from a code segment and a set of statements. Neither the code nor the statements is present in the text-only source, so there is no evidence from which to map Yes or No selections. Brand results can generally expose properties such as the detected name, confidence, and bounding region, but those facts do not reveal what the missing statements ask. Preserving the answer as None avoids inventing hotspot selections.","whyNot":"Any proposed Yes/No sequence would be speculation because even correct knowledge of the brand API cannot reconstruct omitted expressions or assertions. General answers about confidence or bounding boxes are categories of possible facts, not substitutes for the missing exhibit.","takeaway":"For an exhibit-dependent hotspot, do not infer selections when the code and statements are missing.","reviewNote":"The source PDF omits part or all of the exhibit/answer area. Use the original visual source to confirm the exact hotspot selection.","docs":[{"title":"Brand detection","url":"https://learn.microsoft.com/en-us/azure/ai-services/computer-vision/concept-brand-detection"},{"title":"Analyze Image REST API","url":"https://learn.microsoft.com/en-us/rest/api/computervision/analyze-image/analyze-image?view=rest-computervision-v3.2"}]},{"id":"QA-146","n":146,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":85,"question":"DRAG DROP - You are developing an application that will detect faulty components produced on a factory production line. The components are specific to your business. You need to use the Azure Custom Vision API to help detect common faults. Which three actions should you perform in sequence? To answer, move the appropriate actions from the list of actions to the answer area and arrange them in the correct order.","options":[],"correct":[],"type":"review","answer":"1. Create a Custom Vision object-detection project. 2. Upload representative component images and tag each fault with bounding boxes. 3. Train the object detector.","why":"The business-specific faults must be localized within images, which makes this an object-detection problem rather than simple image classification. The project therefore needs to be created with the object-detection project type first. Representative images must then be uploaded and each fault instance labeled with a bounding box so the model learns both category and location. Training uses those labeled regions to create the detector.","whyNot":"An image-classification project would label the entire image and would not learn where a faulty component appears. Training before uploading and labeling data is impossible, while evaluation and publishing occur only after a trained iteration exists.","takeaway":"For custom fault localization: create an object-detection project, label fault regions with bounding boxes, then train.","reviewNote":null,"docs":[{"title":"Build an object detector with the Custom Vision website","url":"https://learn.microsoft.com/en-us/azure/ai-services/custom-vision-service/get-started-build-detector"},{"title":"Custom Vision object detection quickstart","url":"https://learn.microsoft.com/en-us/azure/ai-services/custom-vision-service/quickstarts/object-detection"}]},{"id":"QA-147","n":147,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":86,"question":"HOTSPOT HOTSPOT - You are building a model to detect objects in images. The performance of the model based on training data is shown in the following exhibit.","options":[],"correct":[],"type":"review","answer":"None","why":"The requested answer depends on values shown in a model-performance exhibit and on the exact statements to evaluate. Both are absent from the source text, so precision, recall, or threshold behavior cannot be tied to the hotspot choices. General definitions of Custom Vision metrics are insufficient because the question asks about a specific chart. Returning None correctly marks the item as unrecoverable without the visual source.","whyNot":"Guessing from common metric patterns could reverse an answer if the omitted chart uses different thresholds or class values. Precision, recall, and mean average precision are plausible categories, but none can be selected or interpreted for this item without the exhibit and statements.","takeaway":"When a metric question depends on a missing chart, require the original exhibit instead of inferring the hotspot answers.","reviewNote":"The source PDF omits part or all of the exhibit/answer area. Use the original visual source to confirm the exact hotspot selection.","docs":[{"title":"Evaluate and improve your Custom Vision model","url":"https://learn.microsoft.com/en-us/azure/ai-services/custom-vision-service/test-your-model"}]},{"id":"QA-148","n":148,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":86,"question":"… The agent uploads user-provided screenshots to Azure Storage through a ticketing tool and receives a blob URL for additional reasoning. You need to use image moderation during agent runs and prevent harmful content from being returned during runs. Azure AI Content Safety must access the images by using the blob URL. The solution must follow the principle of least privilege. What should you configure for Content Safety? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Enable a system-assigned managed identity on the Azure AI Content Safety resource and grant it Storage Blob Data Contributor at the narrowest applicable storage scope; pass the image as blobUrl and apply the configured image-moderation severity thresholds.","why":"Content Safety must fetch the screenshot from Azure Storage by using the supplied blob URL. Enabling a system-assigned managed identity gives the Content Safety resource its own keyless identity for that access. The documented Storage Blob Data Contributor role grants the data operations needed for blob access, and applying it at the narrowest relevant scope limits exposure. The image moderation result can then be checked against configured severity thresholds before content is returned during the agent run.","whyNot":"A storage account key or broad owner-style management role would grant more access than required and weaken the least-privilege design. Prompt Shields address malicious instructions, not harmful-image severity classification, and an identity without a blob data role cannot read the image from its URL.","takeaway":"For blob-URL image moderation, give Content Safety a managed identity and the narrowest documented blob data role, then enforce severity thresholds.","reviewNote":null,"docs":[{"title":"Analyze image content with Azure AI Content Safety","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-safety/quickstart-image"}]},{"id":"QA-149","n":149,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":87,"question":"You are deploying a support agent that enables users to upload photos. You need to automatically classify uploaded images for harmful content. The solution must block content based on severity levels. What should you do?","options":[{"key":"A","text":"Apply keyword scanning to optical character recognition (OCR) output by using Azure Vision in"},{"key":"B","text":"Enable prompt shields."},{"key":"C","text":"Use blocklists."},{"key":"D","text":"Implement image moderation."}],"correct":["D"],"type":"mcq","answer":"D. Implement image moderation.","why":"Image moderation analyzes uploaded visual content across supported harm categories. It returns category and severity information that application logic can compare with blocking thresholds. This allows the support agent to reject or quarantine unsafe photos before further processing. The mechanism directly matches both the image input and severity-based policy cues.","whyNot":"Prompt Shields detect prompt-injection attempts rather than classifying general visual harms. Text moderation does not inspect image pixels, and a custom blocklist alone cannot provide broad image harm categories with severity levels.","takeaway":"Use image moderation when uploaded images must be classified and blocked according to harm severity.","reviewNote":null,"docs":[{"title":"Analyze image content with Azure AI Content Safety","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-safety/quickstart-image"}]},{"id":"QA-150","n":150,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":88,"question":"… Agent1 must be protected from malicious instructions potentially hidden within the images. Business Requirements - Contoso identifies the following business requirements: Users that interact with Agent1 must have a personalized experience in future interactions, including the ability for Agent1 to retain conversation context and recall relevant information from previous interactions. Agent1 must answer questions only about the products sold by Contoso. You need to configure Agent1 to meet the security and compliance requirements. What should you use?","options":[{"key":"A","text":"self-harm content filtering"},{"key":"B","text":"prompt shields"},{"key":"C","text":"Personally identifiable information (PII) Detection"},{"key":"D","text":"violence content filtering"}],"correct":["B"],"type":"mcq","answer":"B. Prompt Shields.","why":"The stated threat is a malicious instruction embedded in content that the agent consumes. That is an indirect, or document, prompt-injection attack because the instruction arrives through retrieved or processed material rather than as the trusted system instruction. Prompt Shields is designed to identify and block these attacks before the model follows them. This protects the agent's instruction hierarchy while it works with product content.","whyNot":"Ordinary content moderation focuses on harm categories and does not specifically detect an attempt to override the model through hidden instructions. PII detection addresses sensitive personal data, and grounding controls what evidence is used but does not itself detect prompt injection.","takeaway":"When untrusted content may contain hidden instructions, apply Prompt Shields for document or indirect attacks.","reviewNote":null,"docs":[{"title":"Prompt Shields in Azure AI Content Safety","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/jailbreak-detection"}]},{"id":"QA-151","n":151,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":91,"question":"… After you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen. You have a multimodal AI generative model that accepts image uploads and uses extracted image text to generate responses. You discover that users can upload unsafe images and embed hidden instructions into images to manipulate the model. You need to implement controls to mitigate the risk. Solution: You configure a prompt shield for user prompts. Does this meet the goal?","options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"correct":["B"],"type":"mcq","answer":"B. No.","why":"A user-prompt shield examines direct attack patterns in the user's prompt channel. The malicious instructions in this scenario are embedded in image-derived text, which is third-party or document content rather than only the direct prompt. The scenario also includes unsafe visual content, which requires image harm analysis. Because one user-prompt control covers neither the full injection path nor the image-safety requirement, the solution does not meet the goal.","whyNot":"Prompt Shields for documents is the relevant injection control for extracted image text, while image moderation is the relevant control for unsafe visuals. Protected-material detection and PII detection address different risks and would not replace those two controls.","takeaway":"A user-prompt shield alone is insufficient when the risks are unsafe images plus indirect instructions in extracted content.","reviewNote":null,"docs":[{"title":"Prompt Shields in Azure AI Content Safety","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/jailbreak-detection"}]},{"id":"QA-152","n":152,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":91,"question":"… After you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen. You have a multimodal AI generative model that accepts image uploads and uses extracted image text to generate responses. You discover that users can upload unsafe images and embed hidden instructions into images to manipulate the model. You need to implement controls to mitigate the risk. Solution: You configure image moderation to block unsafe content before processing the images. Does this meet the goal?","options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"correct":["B"],"type":"mcq","answer":"B. No.","why":"Image moderation can classify the uploaded picture for harmful visual content and block it according to severity. It does not evaluate OCR text as an instruction hierarchy or detect attempts to manipulate the model through that text. The hidden-instruction risk therefore remains even if unsafe imagery is filtered. Because the goal includes both risks, image moderation alone is not sufficient.","whyNot":"Prompt Shields for documents should analyze the extracted text for indirect attacks, complementing image moderation rather than replacing it. A prompt shield for direct user prompts would still target the wrong content channel if the suspicious instruction is supplied as extracted document context.","takeaway":"Image moderation handles visual harm, but add document-attack protection for malicious instructions recovered from images.","reviewNote":null,"docs":[{"title":"Analyze image content with Azure AI Content Safety","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-safety/quickstart-image"},{"title":"Prompt Shields in Azure AI Content Safety","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/jailbreak-detection"}]},{"id":"QA-153","n":153,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":92,"question":"… After you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen. You have a multimodal AI generative model that accepts image uploads and uses extracted image text to generate responses. You discover that users can upload unsafe images and embed hidden instructions into images to manipulate the model. You need to implement controls to mitigate the risk. Solution: You configure a prompt shield for documents. Does this meet the goal?","options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"correct":["B"],"type":"mcq","answer":"B. No.","why":"Prompt Shields for documents can inspect extracted image text as untrusted external content. That addresses hidden instructions intended to override the model's trusted guidance. However, the shield does not classify the pixels for violence, sexual content, self-harm, or other image harm categories. The unsafe-image requirement remains unmet, so this control alone does not achieve the complete goal.","whyNot":"Image moderation is the complementary control that evaluates visual harm and supplies severity levels. A direct user-prompt shield is not a substitute for document-attack detection when the attack resides in OCR or other third-party content.","takeaway":"Document Prompt Shields stop indirect instructions, but pair them with image moderation when unsafe visuals are also in scope.","reviewNote":null,"docs":[{"title":"Prompt Shields in Azure AI Content Safety","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/jailbreak-detection"},{"title":"Analyze image content with Azure AI Content Safety","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-safety/quickstart-image"}]},{"id":"QA-154","n":154,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":92,"question":"… After you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen. You have a multimodal AI generative model that accepts image uploads and uses extracted image text to generate responses. You discover that users can upload unsafe images and embed hidden instructions into images to manipulate the model. You need to implement controls to mitigate the risk. Solution: You configure protected material detection. Does this meet the goal?","options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"correct":["B"],"type":"mcq","answer":"B. No.","why":"Protected material detection checks generated text or code for matches to known protected content. The scenario instead concerns harmful uploaded images and hidden instructions that manipulate model behavior. It neither classifies visual harm nor detects document prompt injection. Therefore it fails both parts of the stated mitigation goal.","whyNot":"Image moderation is the appropriate category for unsafe visual content, and Prompt Shields for documents addresses hidden instructions in extracted text. PII detection is also unrelated unless the scenario separately requires identifying personal information.","takeaway":"Do not use protected-material detection as a substitute for image safety or prompt-injection defenses.","reviewNote":null,"docs":[{"title":"Protected material detection for text","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-safety/quickstart-protected-material"},{"title":"Prompt Shields in Azure AI Content Safety","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/jailbreak-detection"}]},{"id":"QA-155","n":155,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":93,"question":"HOTSPOT HOTSPOT - You have a Microsoft Foundry project that contains an agent. The agent accepts user-uploaded screenshots and uses a multimodal chat model. Some screenshots contain potentially malicious embedded text. You need to prevent a prompt injection attack and ensure that third-party content is treated as lower trust. How should you configure prompt shields for document attacks? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Enable Prompt Shields document-attack detection, submit the OCR/extracted screenshot text as document content rather than as the direct user prompt, and enable Spotlighting so that third-party content is marked as lower trust.","why":"OCR or extracted screenshot text is third-party content, so it should be submitted through the document-content channel rather than promoted to the direct user prompt. Enabling document-attack detection lets Prompt Shields inspect that content for indirect prompt injection. Spotlighting marks or transforms the untrusted content so the model can distinguish it from higher-priority instructions. Together, these settings address both attack detection and the explicit lower-trust requirement.","whyNot":"A user-prompt-only shield targets direct attacks and does not correctly model the screenshot text as external evidence. Image moderation can detect harmful imagery but not instruction-following attacks in OCR text, while omitting Spotlighting loses the requested trust separation.","takeaway":"Send extracted third-party text as document content, enable document-attack detection, and use Spotlighting to reinforce its lower trust.","reviewNote":null,"docs":[{"title":"Prompt Shields in Azure AI Content Safety","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/jailbreak-detection"},{"title":"Prompt Shields content filter","url":"https://learn.microsoft.com/en-us/azure/ai-services/openai/concepts/content-filter-prompt-shields"}]},{"id":"QA-156","n":156,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":93,"question":"You have an app named App1 that uses a Microsoft Foundry multimodal model deployment. App1 runs optical character recognition (OCR) on uploaded images and appends the OCR output to the prompt as additional context. Some uploaded images contain embedded text. You need to prevent potentially malicious instructions from being processed by the model. What should you use?","options":[{"key":"A","text":"image moderation"},{"key":"B","text":"prompt shields for documents"},{"key":"C","text":"protected material text"},{"key":"D","text":"prompt shields for user prompts"}],"correct":["B"],"type":"mcq","answer":"B. Prompt Shields for documents.","why":"The OCR output comes from an uploaded image and is appended as external context. A malicious instruction in that context is an indirect or document attack because it is not a trusted instruction authored by the application. Prompt Shields for documents is designed to inspect this class of untrusted content before the model processes it. Blocking the detected attack prevents the embedded text from steering the model.","whyNot":"Prompt Shields for user prompts targets direct attacks in the user's main prompt and is not the best match for OCR context. Image moderation classifies visual harms, but it does not determine whether extracted words are malicious instructions; PII redaction solves a different problem.","takeaway":"Treat OCR text as untrusted document content and scan it with Prompt Shields for documents before model inference.","reviewNote":null,"docs":[{"title":"Prompt Shields in Azure AI Content Safety","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-safety/concepts/jailbreak-detection"}]},{"id":"QA-157","n":157,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":94,"question":"How should you create an application that analyzes news articles and extracts key people, places, and dates that are mentioned for indexing?","options":[{"key":"A","text":"Use a generative AI model with a custom function tool that matches strings using a regular"},{"key":"B","text":"Use Azure Language in Foundry Tools to extract PII entities."},{"key":"C","text":"Use Azure Language in Foundry Tools to extract named entities."}],"correct":["C"],"type":"mcq","answer":"C. Use Azure Language in Foundry Tools to extract named entities.","why":"Named entity recognition identifies semantically meaningful spans in unstructured text. Its built-in categories include people, locations, dates, organizations, and related entity types. Those extracted values can be stored as metadata fields in a search index for filtering or discovery. This directly matches the need to identify key people, places, and dates in news articles.","whyNot":"Key phrase extraction finds important topics but does not reliably assign the requested person, place, and date types. Sentiment analysis scores opinions, while summarization shortens an article instead of producing structured entity metadata.","takeaway":"Use named entity recognition when indexing requires typed people, places, dates, or organizations from text.","reviewNote":null,"docs":[{"title":"What is named entity recognition (NER) in Azure Language?","url":"https://learn.microsoft.com/en-us/azure/ai-services/language-service/named-entity-recognition/overview"},{"title":"Entity categories recognized by Named Entity Recognition","url":"https://learn.microsoft.com/en-us/azure/ai-services/language-service/named-entity-recognition/concepts/named-entity-categories"}]},{"id":"QA-158","n":158,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":94,"question":"HOTSPOT HOTSPOT - You have a Python application collects customer comments before posting them to a public forum. You need to send a text comment to Azure AI Content Safety and return the self-harm severity from the response. How should you complete the code? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Create `AnalyzeTextOptions(text=comment)`, call `client.analyze_text(...)`, then select the item in `response.categories_analysis` whose category is `TextCategory.SELF_HARM` and return its `severity`.","why":"`AnalyzeTextOptions` packages the customer comment as the text input expected by the Content Safety client. `analyze_text` sends that content for classification across the supported harm categories. The response contains category-analysis entries, so the code must select the entry whose category is `TextCategory.SELF_HARM`. Reading that entry's `severity` returns the exact value requested by the scenario.","whyNot":"Returning the overall response or the category label would not produce the self-harm severity value. Selecting another harm category such as violence would answer a different question, and an image-analysis request would use the wrong input operation.","takeaway":"For a specific text harm score, analyze the text, select the matching category entry, and return its severity.","reviewNote":"The source PDF omits part or all of the exhibit/answer area. Use the original visual source to confirm the exact hotspot selection.","docs":[{"title":"Quickstart: Analyze text content","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-safety/quickstart-text?pivots=programming-language-python"},{"title":"TextCategoriesAnalysis class","url":"https://learn.microsoft.com/en-us/python/api/azure-ai-contentsafety/azure.ai.contentsafety.models.textcategoriesanalysis?view=azure-python"}]},{"id":"QA-159","n":159,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":95,"question":"HOTSPOT HOTSPOT - You have a Python application that redacts sensitive information before sending prompt text to a language model. The application has the following code:","options":[],"correct":[],"type":"review","answer":"Not recoverable from the text-only source because both the code and the Yes/No statements are omitted.","why":"The item requires evaluating a shown Python implementation and a list of Yes/No statements. The source omits both, so there is no way to determine which SDK call, response field, or redaction behavior each statement references. Knowing that Azure Language can detect and redact PII does not reconstruct the missing code. The preserved answer correctly flags the hotspot as unrecoverable from the text-only material.","whyNot":"Assuming a standard PII sample could produce a plausible but unsupported Yes/No pattern because method names, language settings, or response properties may differ. Named entity recognition, key phrase extraction, and Content Safety are adjacent categories, but none can resolve assertions that are not present.","takeaway":"Do not answer code-based hotspots from topic context alone when the code and evaluated statements are missing.","reviewNote":"The source PDF omits part or all of the exhibit/answer area. Use the original visual source to confirm the exact hotspot selection.","docs":[{"title":"Detect and redact Personally Identifiable Information in text","url":"https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/how-to/redact-text-pii"},{"title":"Personally Identifiable Information quickstart","url":"https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/quickstart"}]},{"id":"QA-160","n":160,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":95,"question":"You want to publish extracts from customer testimonials on a web site. You need to remove personal details from the text before publishing it. What should you do?","options":[{"key":"A","text":"Use Azure Language in Foundry Tools to find and redact PII entities."},{"key":"B","text":"Use Azure Language in Foundry Tools to detect the language and publish only the testimonials in"},{"key":"C","text":"Use a gpt-4.1 model to create new AI-generated customer reviews."}],"correct":["A"],"type":"mcq","answer":"A. Use Azure Language in Foundry Tools to find and redact PII entities.","why":"Azure Language PII detection identifies personal details in unstructured text, such as names, contact information, and other supported sensitive entities. Its response can include redacted text in which detected values are replaced or masked. The application can publish that sanitized version instead of the original testimonial. This directly minimizes accidental exposure of customer details.","whyNot":"General named entity recognition can find entities but is not the dedicated privacy-redaction feature. Translation and sentiment analysis do not remove personal data, while manual rules require more development and are less suitable for the range of PII categories.","takeaway":"Use the PII detection and redaction feature when text must be sanitized before public release.","reviewNote":null,"docs":[{"title":"Detect and redact Personally Identifiable Information in text","url":"https://learn.microsoft.com/en-us/azure/ai-services/language-service/personally-identifiable-information/how-to/redact-text-pii"}]},{"id":"QA-161","n":161,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":95,"question":"What function of an Azure Translator **TextTranslationClient** object should you use to convert the Chinese word \"\u0000\u0000\" to the English word \"Hello\"?","options":[{"key":"A","text":"get\\_supported\\_language"},{"key":"B","text":"translate"},{"key":"C","text":"transliterate"}],"correct":["B"],"type":"mcq","answer":"B. `translate`","why":"The source and target represent different languages: Chinese input must become the English word `Hello`. The `translate` operation converts meaning from a source language into a target language. It can detect or accept the source language and return the requested target-language text. That is a language-conversion task, not merely a change of writing system.","whyNot":"`transliterate` changes the script used to represent text while keeping it in the same language, so it would not turn a Chinese word into its English translation. Language detection only identifies the input language, and dictionary lookup is not the general text-translation call requested.","takeaway":"Use `translate` when meaning must cross languages; use transliteration only when the script changes within the same language.","reviewNote":null,"docs":[{"title":"TextTranslationClient class","url":"https://learn.microsoft.com/en-us/python/api/azure-ai-translation-text/azure.ai.translation.text.texttranslationclient?view=azure-python"},{"title":"Translator Translate method","url":"https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/reference/v3/translate"}]},{"id":"QA-162","n":162,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":96,"question":"What function of an Azure Translator **TextTranslationClient** object should you use to convert the Russian word \"спасибо\" in Cyrillic characters to \"spasibo\" in Latin characters?","options":[{"key":"A","text":"get\\_supported\\_language"},{"key":"B","text":"translate"},{"key":"C","text":"transliterate"}],"correct":["C"],"type":"mcq","answer":"C. `transliterate`","why":"`спасибо` and `spasibo` are two written representations of the same Russian word. The desired transformation maps Cyrillic characters to Latin characters without converting the word's meaning into another language. The `transliterate` operation performs exactly that script-to-script conversion. The output remains Russian, just written with Latin characters.","whyNot":"`translate` would produce the word's meaning in another language, such as `thank you` in English, rather than `spasibo`. Language detection only identifies Russian, and ordinary text normalization does not define the Cyrillic-to-Latin mapping.","takeaway":"Choose `transliterate` when the language stays the same but its writing system changes.","reviewNote":null,"docs":[{"title":"TextTranslationClient class","url":"https://learn.microsoft.com/en-us/python/api/azure-ai-translation-text/azure.ai.translation.text.texttranslationclient?view=azure-python"},{"title":"Translator Transliterate method","url":"https://learn.microsoft.com/en-us/azure/ai-services/translator/text-translation/reference/v3/transliterate"}]},{"id":"QA-163","n":163,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":96,"question":"You have a custom named entity recognition (NER) project in Azure Language in Foundry Tools for support tickets. The schema for the project contains an entity type named ContactInfo. In tagged training files, ContactInfo is used for phone numbers, email addresses, and social media handles. Model evaluation shows low precision for ContactInfo, including false positives in which nearby text is extracted as ContactInfo. You need to improve the precision of the project. What should you do before retraining the model?","options":[{"key":"A","text":"Lower the confidence threshold for ContactInfo."},{"key":"B","text":"Trigger an auto-labeling job."},{"key":"C","text":"Add more support tickets as training data and label more ContactInfo entities."},{"key":"D","text":"Replace ContactInfo by using Phone, Email, and SocialMedia entities. Relabel every"}],"correct":["D"],"type":"mcq","answer":"D. Replace `ContactInfo` with separate `Phone`, `Email`, and `SocialMedia` entity types, and relabel every matching span.","why":"The current `ContactInfo` label groups phone numbers, email addresses, and social-media handles even though they have distinct structures. That broad definition makes the model's entity boundary and category harder to learn, which is consistent with nearby text being captured as false positives. Splitting the schema into `Phone`, `Email`, and `SocialMedia` creates clearer, more homogeneous entity types. Relabeling every matching span consistently gives the retrained model the precise examples needed to improve precision.","whyNot":"Simply adding more examples under the same ambiguous `ContactInfo` label preserves the underlying schema problem. Adjusting a deployment threshold cannot teach cleaner entity boundaries, and changing only some labels would introduce inconsistent annotations that can further reduce model quality.","takeaway":"When a custom NER entity mixes structurally different concepts and precision is poor, split it into clear types and relabel consistently before retraining.","reviewNote":null,"docs":[{"title":"Preparing data and designing a schema for custom named entity recognition","url":"https://learn.microsoft.com/en-us/azure/ai-services/language-service/custom-named-entity-recognition/how-to/design-schema"},{"title":"Custom NER evaluation metrics","url":"https://learn.microsoft.com/en-us/azure/ai-services/language-service/custom-named-entity-recognition/concepts/evaluation-metrics"}]},{"id":"QA-164","n":164,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":97,"question":"You are designing a content management system. You need to ensure that the reading experience is optimized for users who have reduced comprehension and learning differences, such as dyslexia. The solution must minimize development effort. Which Azure service should you include in the solution?","options":[{"key":"A","text":"Azure Document Intelligence in Foundry Tools"},{"key":"B","text":"Azure Language in Foundry Tools"},{"key":"C","text":"Azure AI Immersive Reader"},{"key":"D","text":"Azure Translator in Foundry Tools"}],"correct":["C"],"type":"mcq","answer":"C. Azure AI Immersive Reader","why":"Immersive Reader provides a ready-made reading experience designed to improve comprehension and accessibility. Its reading aids support users with learning differences such as dyslexia through features that make text easier to follow and decode. Integrating the service avoids building those specialized interface capabilities from scratch. That combination fits both the target audience and the requirement to minimize development effort.","whyNot":"Speech translation changes language or modality but does not provide the same comprehension-focused reading interface. General text analytics can extract information from content, while a custom web reader would require significantly more accessibility design and implementation work.","takeaway":"Choose Immersive Reader when the goal is a low-effort, comprehension-focused reading experience for users with learning differences.","reviewNote":null,"docs":[{"title":"What is Azure AI Immersive Reader?","url":"https://learn.microsoft.com/en-us/azure/ai-services/immersive-reader/overview"}]},{"id":"QA-165","n":165,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":97,"question":"You are building a speech processing solution in Microsoft Foundry for a customer support platform. The platform will transcribe live phone calls, so that supervisors at your company can view call transcripts and detect issues while the calls are in progress. The call audio will arrive as a continuous stream from the telephony system. You need to ensure that the call transcripts appear within only a few seconds of the audio stream. What should you do?","options":[{"key":"A","text":"Use text to speech by using a custom neural voice."},{"key":"B","text":"Use speech translation to generate the transcripts into multiple languages."},{"key":"C","text":"Run a batch transcription job on recorded audio files."},{"key":"D","text":"Use real-time speech to text to process streaming audio input."}],"correct":["D"],"type":"mcq","answer":"D. Use real-time speech to text to process streaming audio input.","why":"The telephony system supplies audio continuously while each call is still in progress. Real-time speech to text consumes a stream and emits partial and final recognition results with low latency. Supervisors can therefore see transcript updates within seconds instead of waiting for the call to end. This directly matches live monitoring of ongoing conversations.","whyNot":"Batch transcription is designed for recorded audio files and returns results asynchronously, so it cannot provide an in-call transcript quickly enough. Text to speech produces audio rather than transcribing it, and uploading periodic completed files adds avoidable delay.","takeaway":"For transcripts that must appear during a live audio stream, use real-time speech to text rather than batch transcription.","reviewNote":null,"docs":[{"title":"How to recognize speech","url":"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-recognize-speech"},{"title":"Speech to text quickstart","url":"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/get-started-speech-to-text"}]},{"id":"QA-166","n":166,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":98,"question":"… The agent must receive continuous audio input, convert the input into text for reasoning, and then return spoken responses to a user. The workflow must meet the following requirements: Support turn-taking dynamics, where the agent begins to generate the speech output before the user finishes speaking. Operate with low latency to maintain conversational experience. You need to enable both speech to text and text to speech in a real-time agent interaction. What should you do?","options":[{"key":"A","text":"Use batch transcription to convert the audio input and return text responses from the agent."},{"key":"B","text":"Use real-time speech to text for incoming audio and text to speech for agent"},{"key":"C","text":"Use an embeddings model to encode the audio, and then decode the audio into text and speech."},{"key":"D","text":"Use speech translation to convert the audio into another language and return the translated"}],"correct":["B"],"type":"mcq","answer":"B. Use real-time speech to text for incoming audio and text to speech for agent responses.","why":"Real-time speech to text converts the continuous incoming audio into text the agent can reason over as the conversation unfolds. Text to speech converts the agent's generated text back into audible responses. Streaming both directions reduces the delay between user input, reasoning, and playback. This pairing is the listed architecture that supports an interactive voice experience and turn-taking behavior.","whyNot":"Batch speech recognition waits on completed recordings and therefore does not fit live conversation. Speech to text alone cannot produce spoken replies, while text to speech alone gives the agent no transcription of the user's audio.","takeaway":"A low-latency voice agent needs streaming speech to text for input and text to speech for output.","reviewNote":null,"docs":[{"title":"How to recognize speech","url":"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-recognize-speech"},{"title":"How to synthesize speech from text","url":"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-speech-synthesis"}]},{"id":"QA-167","n":167,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":98,"question":"You are building a customer support web app named App1 in Microsoft Foundry that uses a GPT realtime model. App1 must support: • Live, low-latency voice conversations that use Azure OpenAI • Streaming audio input from users and playback audio responses You need to configure a connection method that supports real-time audio streaming in client application and targets approximately 100 ms latency. Which connection method should you use?","options":[{"key":"A","text":"RTMP"},{"key":"B","text":"WebRTC"},{"key":"C","text":"SIP"},{"key":"D","text":"WebSocket"}],"correct":["B"],"type":"mcq","answer":"B. WebRTC","why":"WebRTC is designed for interactive real-time media between client applications and a service. It supports browser-friendly audio capture, transport, and playback with latency appropriate for live conversation. Those characteristics fit the requirement for streaming user audio and returning audio responses at roughly 100 milliseconds. Microsoft therefore positions WebRTC for client-side GPT Realtime experiences.","whyNot":"WebSockets are useful for server-to-server realtime integrations but require more manual media handling and are not the preferred lowest-latency browser audio path. Standard request-response HTTP and batch APIs cannot maintain the bidirectional streaming session needed for a natural live conversation.","takeaway":"Use WebRTC for low-latency browser or mobile audio with GPT Realtime; reserve WebSockets mainly for server-side streaming.","reviewNote":null,"docs":[{"title":"Use the GPT Realtime API via WebRTC","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/realtime-audio-webrtc"},{"title":"Use the GPT Realtime API via WebSockets","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/realtime-audio-websockets"}]},{"id":"QA-168","n":168,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":99,"question":"You are building a text-to-speech solution that uses Azure Speech in Foundry Tools to read instructions from the script in a text file. You discover that the solution often pronounces technical terms incorrectly. You need to prevent the incorrect pronunciations. The solution must minimize development effort. What should you do?","options":[{"key":"A","text":"From Speech Studio, train a custom neural voice"},{"key":"B","text":"Use Speech Synthesis Markup Language (SSML) to specify phonemes."},{"key":"C","text":"Use Speech Synthesis Markup Language (SSML) to apply say as rules."},{"key":"D","text":"Use Speech Synthesis Markup Language (SSML) to adjust the prosody of the voice."},{"key":"E","text":"From Azure OpenAI use the Whisper model."}],"correct":["B"],"type":"mcq","answer":"B. Use SSML to specify phonemes.","why":"SSML lets the application control how synthesized speech is spoken without changing the source text file or training a new voice. The `phoneme` element provides the pronunciation the synthesizer should use for a technical term. This directly corrects recurring pronunciation errors at the term level. It is a small markup change, so it satisfies the requirement to minimize development effort.","whyNot":"Changing speaking rate, pitch, or output format does not define the correct sounds for a mispronounced word. Training a custom voice is much more work and is intended for voice identity or broader voice customization, not a few technical terms.","takeaway":"For specific text-to-speech pronunciation errors, use SSML phonemes before considering custom voice work.","reviewNote":null,"docs":[{"title":"Pronunciation with Speech Synthesis Markup Language (SSML)","url":"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/speech-synthesis-markup-pronunciation"},{"title":"Speech Synthesis Markup Language (SSML) overview","url":"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/speech-synthesis-markup"}]},{"id":"QA-169","n":169,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":99,"question":"Which model can you use to synthesize speech from text?","options":[{"key":"A","text":"gpt-4o-mini"},{"key":"B","text":"gpt-4o-mini-tts"},{"key":"C","text":"gpt-4o-mini-transcribe"}],"correct":["B"],"type":"mcq","answer":"B. `gpt-4o-mini-tts`","why":"`gpt-4o-mini-tts` is an audio-generation model whose task is to synthesize spoken output from text. The model name and capability align directly with the requested text-to-speech direction. It can therefore be selected when an application needs generated speech audio. The other similarly named audio model performs the reverse transformation.","whyNot":"`gpt-4o-mini-transcribe` converts speech into text, so it solves speech recognition rather than synthesis. The general `gpt-4o-mini` model handles text and vision tasks but is not the dedicated text-to-speech model named in the answer.","takeaway":"For model names, match `tts` to text-to-speech output and `transcribe` to speech-to-text input.","reviewNote":null,"docs":[{"title":"Foundry Models sold by Azure","url":"https://learn.microsoft.com/en-us/azure/ai-foundry/openai/overview"},{"title":"Get started with Azure OpenAI audio generation","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/audio-completions-quickstart"}]},{"id":"QA-170","n":170,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":99,"question":"What information do you need from your Microsoft Foundry resource to consume it using the Azure Speech SDK?","options":[{"key":"A","text":"The endpoint and key"},{"key":"B","text":"The primary and secondary keys"},{"key":"C","text":"The Azure subscription ID and resource group name"}],"correct":["A"],"type":"mcq","answer":"A. The endpoint and key","why":"The Speech SDK needs to know which Speech-capable Foundry resource should receive requests. The endpoint identifies that service location, and the key supplies the credential for key-based authentication. Together they are sufficient for the quickstart-style resource connection described by the question. Other runtime details are configured separately in the SDK objects.","whyNot":"A deployment name alone does not authenticate or locate the Speech resource. A subscription ID and resource-group name are management-plane identifiers, while the SDK's speech request needs the data-plane endpoint and credential.","takeaway":"To consume a Speech-capable Foundry resource with key authentication, obtain its endpoint and key.","reviewNote":null,"docs":[{"title":"Speech to text quickstart","url":"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/get-started-speech-to-text"},{"title":"Speech translation quickstart","url":"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/get-started-speech-translation"}]},{"id":"QA-171","n":171,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":99,"question":"Which object should you use to specify that the speech input to be transcribed to text is in an audio file?","options":[{"key":"A","text":"SpeechConfig"},{"key":"B","text":"AudioConfig"},{"key":"C","text":"SpeechRecognizer"}],"correct":["B"],"type":"mcq","answer":"B. `AudioConfig`","why":"`AudioConfig` tells the Speech SDK where recognition audio comes from. It can be created for a filename when the input is an audio file rather than a microphone stream. The resulting audio configuration is passed to the recognizer alongside the service configuration. This separates the input source from service credentials and recognition behavior.","whyNot":"`SpeechConfig` contains service connection and speech settings but does not identify the audio file itself. `SpeechRecognizer` performs recognition and consumes the configurations, while an output audio configuration is used for synthesized audio destinations rather than transcription input.","takeaway":"Use `AudioConfig` to specify a speech input source such as an audio file or microphone.","reviewNote":null,"docs":[{"title":"Speech to text quickstart","url":"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/get-started-speech-to-text"},{"title":"AudioConfig class","url":"https://learn.microsoft.com/en-us/python/api/azure-cognitiveservices-speech/azure.cognitiveservices.speech.audio.audioconfig"}]},{"id":"QA-172","n":172,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":100,"question":"How can you change the voice used in speech synthesis?","options":[{"key":"A","text":"Specify a SpeechSynthesisOutputFormat enumeration in the SpeechConfig object."},{"key":"B","text":"Set the speech\\_synthesis\\_voice\\_name property of the SpeechConfig object to"},{"key":"C","text":"Specify a filename in the AudioConfig object."}],"correct":["B"],"type":"mcq","answer":"B. Set the `speech_synthesis_voice_name` property of `SpeechConfig` to the desired voice name.","why":"SpeechConfig holds the service settings that control a synthesis request, including the neural voice to use. Setting speech_synthesis_voice_name to a valid voice name makes the synthesizer render the text with that voice. This directly changes the speaker characteristics while leaving the text and output destination unchanged.","whyNot":"Changing the synthesis output format affects audio encoding, sample rate, or container format, not the selected voice. AudioConfig chooses where audio is read from or written to, so it does not select the speaker.","takeaway":"To choose an Azure Speech synthesis voice in code, set SpeechConfig.speech_synthesis_voice_name.","reviewNote":null,"docs":[{"title":"How to synthesize speech from text","url":"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-speech-synthesis"},{"title":"SpeechConfig class","url":"https://learn.microsoft.com/en-us/python/api/azure-cognitiveservices-speech/azure.cognitiveservices.speech.speechconfig"}]},{"id":"QA-173","n":173,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":100,"question":"You have a Microsoft Foundry project that contains an agent. The agent uses Azure Speech in Foundry Tools. You fine-tune a baseline speech to text model for the en-us locale and publish the model. The agent calls the Speech to text REST API and returns an error message indicating that the project ID is invalid. You need to set the project property to the correct ID. To what should you set the project property?","options":[{"key":"A","text":"the project URL"},{"key":"B","text":"the custom speech project ID"},{"key":"C","text":"the project ID"},{"key":"D","text":"the custom speech endpoint URL"}],"correct":["B"],"type":"mcq","answer":"B. The custom speech project ID","why":"A fine-tuned speech-to-text model belongs to a Custom Speech project, which has its own project identifier. The REST API project property must reference that Custom Speech project so the service can locate the model and its related assets. The invalid-project error is the clue that the wrong project namespace or ID was supplied.","whyNot":"A Microsoft Foundry project ID identifies the broader Foundry workspace, not the Custom Speech project expected by this Speech API property. Resource IDs, endpoint IDs, and model deployment names identify different objects and therefore do not satisfy the project field.","takeaway":"When a Custom Speech API field asks for project, use the Custom Speech project ID rather than the Foundry project ID.","reviewNote":null,"docs":[{"title":"Customize speech models with fine-tuning","url":"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-custom-speech-create-project"}]},{"id":"QA-174","n":174,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":100,"question":"You have an Azure Speech in Foundry Tools resource that hosts a custom speech to text model deployed to a custom endpoint. An agent uses the endpoint to perform real-time speech recognition. You are approaching the expiration date of the custom speech to text model. What is the expected behavior when the model expires?","options":[{"key":"A","text":"Speech recognition requests will return a 4xx error until a new custom model is deployed."},{"key":"B","text":"Speech recognition requests will continue to use the expired custom model until the model is"},{"key":"C","text":"Speech recognition requests will fall back to the most recent base model for the"},{"key":"D","text":"The custom model will be deleted automatically when the model expires."}],"correct":["C"],"type":"mcq","answer":"C. Speech recognition requests fall back to the most recent base model for the same locale.","why":"A deployed custom speech model can reach the end of its supported lifetime while the custom endpoint remains available. For real-time recognition, the endpoint then uses the most recent base model for the same locale. Recognition therefore continues, but accuracy may decline for vocabulary or acoustic patterns that depended on the customization.","whyNot":"Expiration does not mean the endpoint automatically renews or retrains the custom model. It also does not necessarily make every real-time request fail, because the documented fallback is the locale's current base model.","takeaway":"An expired custom speech model on a real-time endpoint falls back to the latest base model for that locale.","reviewNote":null,"docs":[{"title":"Model lifecycle of custom speech","url":"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-custom-speech-model-and-endpoint-lifecycle"}]},{"id":"QA-175","n":175,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":101,"question":"What two core capabilities does the Azure Speech MCP server expose to agents?","options":[{"key":"A","text":"Language translation and text summarization."},{"key":"B","text":"Speech-to-text recognition and text-to-speech synthesis."},{"key":"C","text":"Named entity recognition and sentiment analysis."}],"correct":["B"],"type":"mcq","answer":"B. Speech-to-text recognition and text-to-speech synthesis.","why":"The Speech MCP server exposes speech recognition so an agent can turn audio into text. It also exposes speech synthesis so the agent can turn text into audio. Together, these two directions cover the core speech input and output needs of an agent.","whyNot":"Translation and language understanding are separate capabilities and are not the two core functions named for the Speech MCP server. Image analysis, document extraction, and web search likewise belong to other tools or services.","takeaway":"Recognize Azure Speech MCP as the agent bridge for speech-to-text and text-to-speech.","reviewNote":null,"docs":[{"title":"Connect Azure Speech in Foundry Tools to an agent","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/azure-ai-speech"}]},{"id":"QA-176","n":176,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":101,"question":"Why does the Azure Speech MCP server require an Azure Storage account?","options":[{"key":"A","text":"To store the agent’s instructions and configuration settings."},{"key":"B","text":"To store input audio files and output audio files generated by the speech tools."},{"key":"C","text":"To cache the MCP server’s tool definitions for faster discovery."}],"correct":["B"],"type":"mcq","answer":"B. To store input audio files and output audio files generated by the speech tools.","why":"The Speech MCP tools work with audio files rather than keeping all audio only inside the prompt. Speech-to-text needs a place from which to read input audio, and text-to-speech needs a place to write generated audio. An Azure Storage account supplies that shared file location for both directions.","whyNot":"The storage account is not used to train the speech model or to store the agent's language-model weights. Authentication to the Speech resource is handled separately, so storage is not a substitute for the Foundry resource credential.","takeaway":"Azure Speech MCP needs Storage because its tools exchange input and generated audio through files.","reviewNote":null,"docs":[{"title":"Connect Azure Speech in Foundry Tools to an agent","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/azure-ai-speech"}]},{"id":"QA-177","n":177,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":101,"question":"What credentials are needed when connecting the Azure Speech MCP server to a Foundry agent?","options":[{"key":"A","text":"An OAuth 2.0 token and a managed identity endpoint URL."},{"key":"B","text":"A Foundry resource key and a SAS URL for a blob container."},{"key":"C","text":"A client certificate and the Azure subscription ID."}],"correct":["B"],"type":"mcq","answer":"B. A Foundry resource key and a SAS URL for a blob container.","why":"The Foundry resource key authorizes calls to the Speech capability. The blob-container SAS URL grants scoped access to the storage location used for input and output audio. Both are required because the integration must access both the speech service and the audio-file container.","whyNot":"A Speech key alone cannot grant access to the blob container, while a SAS URL alone cannot authorize Speech service calls. General Azure subscription credentials or an arbitrary storage account key do not match the two connection values requested by this MCP integration.","takeaway":"For Speech MCP, pair the Foundry resource key with a blob-container SAS URL.","reviewNote":null,"docs":[{"title":"Connect Azure Speech in Foundry Tools to an agent","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/azure-ai-speech"}]},{"id":"QA-178","n":178,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":101,"question":"How can you specify a particular voice when using the text-to-speech tool through the agent?","options":[{"key":"A","text":"By configuring the voice in the MCP server settings before connecting."},{"key":"B","text":"By including the voice name in your natural language prompt to the agent."},{"key":"C","text":"By setting an environment variable in the client application code."}],"correct":["B"],"type":"mcq","answer":"B. Include the voice name in the natural-language prompt to the agent.","why":"The agent interprets the user's natural-language instruction and passes the requested voice to the Speech MCP text-to-speech tool. Naming the voice in the prompt therefore lets the tool synthesize the response with that specific voice. This is the agent-facing method and does not require the caller to modify SDK configuration directly.","whyNot":"Changing SpeechConfig is an SDK pattern, but this question asks about invoking text-to-speech through an agent and MCP tool. Audio format and storage settings affect the file, not which voice speaks.","takeaway":"When using Speech through an agent's MCP tool, request the desired voice by name in the prompt.","reviewNote":null,"docs":[{"title":"Connect Azure Speech in Foundry Tools to an agent","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/azure-ai-speech"}]},{"id":"QA-179","n":179,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":101,"question":"What are the two authentication methods supported by the Voice Live API?","options":[{"key":"A","text":"OAuth 2.0 and JWT (JSON Web Tokens)"},{"key":"B","text":"Basic authentication and API keys"},{"key":"C","text":"Microsoft Entra (keyless) and API key"}],"correct":["C"],"type":"mcq","answer":"C. Microsoft Entra (keyless) and API key","why":"Voice Live can authenticate with Microsoft Entra credentials, which supports token-based keyless access. It can also authenticate with an API key associated with the resource. These are the two supported choices identified by the service.","whyNot":"SAS tokens are used for scoped storage access, not as the primary Voice Live API authentication method. Basic username/password authentication and client certificates are not the two supported methods in this scenario.","takeaway":"Voice Live authentication is either Microsoft Entra keyless authentication or an API key.","reviewNote":null,"docs":[{"title":"How to use the Voice Live API","url":"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live-how-to"},{"title":"Voice Live API reference 2026-07-15","url":"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live-api-reference-2026-07-15"}]},{"id":"QA-180","n":180,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":102,"question":"Which protocol is used for avatar streaming integration in Voice Live API?","options":[{"key":"A","text":"HTTP/2"},{"key":"B","text":"WebRTC"},{"key":"C","text":"gRPC"}],"correct":["B"],"type":"mcq","answer":"B. WebRTC","why":"Voice Live uses WebRTC to negotiate and carry the avatar's real-time media stream. WebRTC is designed for low-latency interactive audio and video, which fits a speaking avatar. The connection setup exchanges session information needed to establish that real-time media path.","whyNot":"HTTP REST calls can configure or control sessions but are not the continuous avatar media transport. WebSockets can stream data in other real-time scenarios, but the avatar streaming integration named here uses WebRTC.","takeaway":"Associate Voice Live avatar streaming with WebRTC.","reviewNote":null,"docs":[{"title":"Voice Live API with WebRTC","url":"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live-webrtc"},{"title":"Voice Live API reference 2026-07-15","url":"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live-api-reference-2026-07-15"}]},{"id":"QA-181","n":181,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":102,"question":"How do you configure and test Voice Live agent integration in the Foundry Portal?","options":[{"key":"A","text":"You can’t - Voice Live is only accessible through the REST API or Python SDK."},{"key":"B","text":"In the Azure Speech in Foundry Tools Voice Live playground"},{"key":"C","text":"Enable Voice mode in the agent playground"}],"correct":["C"],"type":"mcq","answer":"C. Enable Voice mode in the agen
