ons":[{"key":"A","text":"Logic node"},{"key":"B","text":"Agent node"},{"key":"C","text":"Data transformation node"}],"correct":["B"],"type":"mcq","answer":"B. Agent node.","why":"An Agent node is the workflow element that invokes a configured AI agent. It passes workflow input to the agent and makes the agent's result available to later steps. The question asks specifically for invocation rather than branching or data manipulation, so the Agent node is the matching type.","whyNot":"If/Else and other logic nodes control execution paths but do not themselves call an agent. Data-transformation or variable nodes reshape and store values, while loop nodes repeat work over collections.","takeaway":"Use an Agent node whenever a Foundry workflow step must invoke an AI agent.","reviewNote":null,"docs":[{"title":"Build a workflow in Microsoft Foundry","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/workflow"}]},{"id":"QA-043","n":43,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":35,"question":"Which node type would you use to handle multiple tickets in a workflow without duplicating nodes?","options":[{"key":"A","text":"If/Else node"},{"key":"B","text":"For-Each node"},{"key":"C","text":"Send message node"}],"correct":["B"],"type":"mcq","answer":"B. For-Each node.","why":"A For-Each node receives a collection and executes the same nested steps once for every item. Supplying the ticket collection lets one set of processing nodes handle each ticket in turn. This removes the need to copy the same workflow branch for every ticket.","whyNot":"Duplicating nodes creates a fixed, harder-to-maintain workflow and does not scale when the number of tickets changes. An If/Else node chooses between conditions, and an Agent node invokes an agent, but neither provides collection iteration by itself.","takeaway":"Choose For-Each when the same workflow actions must run for every item in a collection.","reviewNote":null,"docs":[{"title":"Apply Power Fx in workflows","url":"https://learn.microsoft.com/en-us/training/modules/build-agent-workflows-microsoft-foundry/6-apply-power-fx"},{"title":"Build a workflow in Microsoft Foundry","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/workflow"}]},{"id":"QA-044","n":44,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":36,"question":"Which of the following best describes how structured agent outputs are used in workflows?","options":[{"key":"A","text":"They are ignored once generated, since agents always handle routing automatically"},{"key":"B","text":"They provide predictable data that can be stored in variables, evaluated with"},{"key":"C","text":"They replace the need for loops and If/Else nodes"}],"correct":["B"],"type":"mcq","answer":"B. Structured outputs provide predictable data that can be stored, evaluated, and used to trigger later workflow steps.","why":"Structured output makes an agent return data in a defined shape instead of only free-form prose. A workflow can reliably store named fields, test them in conditions, and pass them to later nodes. The clue is that the output must participate in subsequent workflow logic, which requires predictable values that other steps can reference.","whyNot":"Structured output does not replace If/Else or For-Each nodes; those nodes still perform branching and iteration. Free-form text is harder to validate and route because the workflow cannot safely assume that a particular field or value will be present.","takeaway":"Choose structured output when later workflow steps must reliably store, inspect, or route an agent's result.","reviewNote":null,"docs":[{"title":"Build a workflow in Microsoft Foundry","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/workflow"}]},{"id":"QA-045","n":45,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":37,"question":"… following business requirements: Users that interact with Agent1 must have a personalized experience in future interactions, including the ability for Agent1 to retain conversation context and recall relevant information from previous interactions. Agent1 must answer questions only about the products sold by Contoso. You need to recommend a solution to assess the responses generated by Agent1 when the agent uses the product information stored in storage1. The solution must meet the technical requirements. What should you include in the recommendation?","options":[{"key":"A","text":"a Retrieval Augmented Generation (RAG) evaluator"},{"key":"B","text":"a custom guardrail"},{"key":"C","text":"model fine-tuning"},{"key":"D","text":"a groundedness evaluator"}],"correct":["D","A"],"type":"mcq","answer":"D. A groundedness evaluator.","why":"Groundedness measures whether an agent response is supported by the retrieved product-sheet context. Because the requirement is to assess relevance, completeness, and accuracy when Agent1 uses indexed product information, this evaluator directly checks the relationship between the generated answer and its grounding evidence.","whyNot":"A general RAG evaluator can cover broader retrieval quality, but the question specifically asks whether the generated response is supported by the retrieved content. Guardrails enforce constraints rather than score evidential support, and fine-tuning changes model behavior instead of evaluating an answer.","takeaway":"When the question asks whether a generated claim is supported by retrieved context, choose groundedness.","reviewNote":null,"docs":[{"title":"What is Microsoft Foundry Agent Service?","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/overview"}]},{"id":"QA-046","n":46,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":40,"question":"… As a result, these questions do not appear on the Review Screen. You have a Microsoft Foundry project that contains an agent. The agent generates summaries from retrieved policy documents. Users report that some responses omit required regulatory clauses, even when the clauses are present in the retrieved content. You need to improve response completeness. Solution: You run an evaluation flow that scores responses for completeness and blocks responses that fall below a defined threshold. Does this meet the goal?","options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"correct":["B"],"type":"mcq","answer":"B. No.","why":"The goal is to improve the completeness of the generated response, not merely identify bad responses. A completeness evaluator can score the draft and a threshold can prevent an incomplete answer from being shown. However, the described solution has no corrective action that regenerates or repairs the response, so it does not make responses more complete. Therefore, the solution does not meet the stated goal.","whyNot":"“Yes” would be defensible only if the workflow used the failed evaluation to trigger a retry, reflection, or regeneration step. Blocking alone is a quality gate, not an improvement mechanism.","takeaway":"Evaluation detects a defect; a retry or regeneration step is required to correct it before return.","reviewNote":null,"docs":[{"title":"Retrieval-Augmented Generation (RAG) evaluators","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"}]},{"id":"QA-047","n":47,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":40,"question":"… The evaluation will run against a labeled test dataset that contains support questions and the expected grounding context. You need to ensure that Pipeline1 fails if unsupported content or a retrieval mismatch exceeds a defined threshold: • responses include claims not supported by the retrieved source content • retrieved source content does not align with the labeled expected context Which two built-in evaluators should you use in Pipeline1? Each correct answer presents pat of the solution. NOTE: Each correct selection is worth one point.","options":[{"key":"A","text":"Retrieval"},{"key":"B","text":"Fluency"},{"key":"C","text":"Coherence"},{"key":"D","text":"Groundedness"},{"key":"E","text":"Response Completeness"}],"correct":["A","D"],"type":"mcq","answer":"A and D: Retrieval and Groundedness.","why":"The Retrieval evaluator compares retrieved context with the query or labeled expected context, so it detects a retrieval mismatch. The Groundedness evaluator checks whether claims in the generated response are supported by the retrieved source content. The two failure descriptions map directly to those separate stages of a RAG pipeline: retrieval quality first, answer support second.","whyNot":"Relevance of the final response does not specifically prove that the retrieved context matches the labeled context, and fluency measures language quality rather than evidence support. Risk and safety evaluators detect harmful-content categories, not retrieval mismatch or unsupported factual claims.","takeaway":"Use Retrieval for context-selection errors and Groundedness for claims unsupported by the selected context.","reviewNote":null,"docs":[{"title":"Retrieval-Augmented Generation (RAG) evaluators","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"}]},{"id":"QA-048","n":48,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":41,"question":"… You need to run a pre-production evaluation by using labeled CSV dataset that contains the query, context, response and ground truth. The evaluation must measure the following: • Whether responses address the user query • Whether responses are supported by the provided context • Whether responses contain sensitive or proprietary information Which AI quality evaluation metrics should you use? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Query addressed → Relevance; supported by context → Groundedness; sensitive or proprietary information → Sensitive Data Leakage (for agent runs) or Protected Materials when “proprietary” means copyrighted material.","why":"Relevance measures whether the response addresses the user's query. Groundedness measures whether the response is supported by the provided context. For the third requirement, Sensitive Data Leakage fits disclosure of confidential data during agent runs, while Protected Materials fits copyrighted or otherwise protected content. The omitted options and the broad word “proprietary” prevent choosing between those two labels with certainty.","whyNot":"Fluency assesses writing quality and does not test whether an answer addresses the query or is supported by context. Retrieval metrics evaluate selected context, and general harmful-content metrics do not specifically identify sensitive-data or protected-material disclosure.","takeaway":"Map query fit to Relevance, evidence support to Groundedness, and disclosure risk to the evaluator named for the protected data type.","reviewNote":"The source PDF omits part or all of the exhibit/answer area. Use the original visual source to confirm the exact hotspot selection.","docs":[{"title":"Retrieval-Augmented Generation (RAG) evaluators","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"},{"title":"Risk and safety evaluators for generative AI","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators"}]},{"id":"QA-049","n":49,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":41,"question":"You plan to configure an evaluation in Microsoft Foundry for a Retrieval Augmented Generation (RAG) chat app. You need to provide scores for groundedness, relevance, and harmful content categories. Which two evaluation categories can you use? Each correct answer presents a complete solution. NOTE: Each correct selection is worth one point.","options":[{"key":"A","text":"risk and safety metrics"},{"key":"B","text":"fluency evaluator"},{"key":"C","text":"similarity evaluators"},{"key":"D","text":"AI quality (NLP) metrics"},{"key":"E","text":"AI quality (AI assisted) metrics"}],"correct":["A","E"],"type":"mcq","answer":"A and E: risk and safety metrics, and AI quality (AI-assisted) metrics.","why":"Groundedness and relevance are AI-assisted quality measures because they judge how well an answer uses context and addresses the request. Harmful-content scores belong to the risk and safety evaluation category. The scenario asks for all three score types, so both AI quality and risk and safety categories are required.","whyNot":"A single metric such as fluency or similarity cannot cover both RAG quality and harmful-content detection. Performance or operational measures such as latency also do not evaluate groundedness, relevance, or content harm.","takeaway":"Combine AI quality evaluators for answer quality with risk and safety evaluators for harmful-content categories.","reviewNote":null,"docs":[{"title":"Built-in evaluators reference","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/built-in-evaluators"},{"title":"Risk and safety evaluators for generative AI","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators"}]},{"id":"QA-050","n":50,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":42,"question":"Which evaluation metric measures linguistic correctness and natural language quality?","options":[{"key":"A","text":"Fluency"},{"key":"B","text":"Groundedness"},{"key":"C","text":"Relevance"}],"correct":["A"],"type":"mcq","answer":"A. Fluency.","why":"Fluency evaluates the linguistic quality of generated text. It considers features such as grammar, vocabulary, readability, and whether the wording sounds natural. The clue is the focus on linguistic correctness rather than factual support or task alignment.","whyNot":"Groundedness asks whether claims are supported by context, while relevance asks whether the answer addresses the query. Coherence concerns logical organization, but fluency is the direct metric for natural and grammatically sound language.","takeaway":"When the question asks about grammar, readability, or natural wording, choose Fluency.","reviewNote":null,"docs":[{"title":"General purpose evaluators for generative AI","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/general-purpose-evaluators"}]},{"id":"QA-051","n":51,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":42,"question":"HOTSPOT HOTSPOT - You have a Python application named App1 that integrates with a Microsoft Foundry project named Project1. You need to ensure that App1 meets the following requirements: Authenticates by using a Microsoft Entra managed identity Sends prompts to a deployed model by using the Azure OpenAI Responses API How should you complete the Python code? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Use `DefaultAzureCredential()` with `AIProjectClient`, obtain the OpenAI client with `project_client.get_openai_client()`, and call `openai_client.responses.create(...)`.","why":"`DefaultAzureCredential()` can obtain a Microsoft Entra token from a managed identity when the application runs in an Azure-hosted environment. `AIProjectClient` uses that credential to connect to the Foundry project without embedding a secret. The project client can then provide an OpenAI client, and `responses.create(...)` sends the prompt through the Responses API. These elements match both the keyless-authentication and API requirements in the stem.","whyNot":"An API key would violate the managed-identity requirement, and a manually stored client secret would also add credential-management risk. `chat.completions.create(...)` targets the Chat Completions API rather than the specifically requested Responses API.","takeaway":"For managed identity plus the Responses API, use an Azure Identity credential, obtain the project OpenAI client, and call `responses.create`.","reviewNote":null,"docs":[{"title":"Build with runtime components in Foundry Agent Service","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/runtime-components"},{"title":"Quickstart: Build agents using the Responses API","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/quickstarts/responses-api"}]},{"id":"QA-052","n":52,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":42,"question":"Which endpoint offers the broadest support for OpenAI APIs with Foundry Models?","options":[{"key":"A","text":"The Foundry project endpoint"},{"key":"B","text":"The Azure OpenAI endpoint"},{"key":"C","text":"The Foundry Tools endpoint"}],"correct":["B"],"type":"mcq","answer":"B. The Azure OpenAI endpoint.","why":"The Azure OpenAI endpoint is designed for applications that use OpenAI-compatible APIs and SDK patterns. In the exam's endpoint comparison, it exposes the broadest OpenAI API surface for supported Foundry models. The clue is “broadest support for OpenAI APIs,” not access to project-scoped Foundry assets.","whyNot":"A Foundry project endpoint is useful when an application needs project connections, agents, or other Foundry platform capabilities, but that is a different selection criterion. A model-specific or inference endpoint does not by itself imply the broad OpenAI API compatibility requested.","takeaway":"Choose the Azure OpenAI endpoint when OpenAI API compatibility is the primary requirement.","reviewNote":null,"docs":[{"title":"Choose an endpoint and SDK","url":"https://learn.microsoft.com/en-us/training/modules/foundry-sdk/03-microsoft-foundry-sdk"},{"title":"Quickstart: Build agents using the Responses API","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/quickstarts/responses-api"}]},{"id":"QA-053","n":53,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":43,"question":"Which package must you install to use the Microsoft Foundry SDK in Python?","options":[{"key":"A","text":"Package `azure-foundry`"},{"key":"B","text":"Package `azure-ai-projects`"},{"key":"C","text":"Package `microsoft-foundry-sdk`"}],"correct":["B"],"type":"mcq","answer":"B. `azure-ai-projects`.","why":"`azure-ai-projects` is the Python package that provides the Microsoft Foundry project SDK. It contains project-client functionality used to work with project resources and obtain service clients. The package name directly matches the requirement to use the Foundry SDK from Python.","whyNot":"`openai` provides OpenAI-compatible API clients but is not the Foundry project SDK itself. `azure-identity` supplies credentials, and other Azure AI packages cover specific services rather than project-level Foundry operations.","takeaway":"Associate the Python Foundry project SDK with the `azure-ai-projects` package.","reviewNote":null,"docs":[{"title":"Connect an Azure AI Search index to Foundry agents","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/ai-search"}]},{"id":"QA-054","n":54,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":43,"question":"Which method do you use to generate responses with the Responses API?","options":[{"key":"A","text":"client.chat.completions.create()"},{"key":"B","text":"client.get\\_response\\_id()"},{"key":"C","text":"client.responses.create()"}],"correct":["C"],"type":"mcq","answer":"C. `client.responses.create()`.","why":"The Responses API is exposed through the client's `responses` resource. Calling `client.responses.create()` creates a response for the supplied model input and options. The method path mirrors the API name, making it the direct fit for the question.","whyNot":"`client.chat.completions.create()` calls the older Chat Completions interface, not the Responses API. Methods that create assistants, runs, or threads belong to other abstractions and do not generate a Responses API result.","takeaway":"Responses API question means `client.responses.create()`.","reviewNote":null,"docs":[{"title":"Build with runtime components in Foundry Agent Service","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/runtime-components"},{"title":"Quickstart: Build agents using the Responses API","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/quickstarts/responses-api"}]},{"id":"QA-055","n":55,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":43,"question":"When building a Python client application, how do you reference a Foundry agent when calling the OpenAI Responses API?","options":[{"key":"A","text":"By passing the agent’s API key as a request header to the endpoint."},{"key":"B","text":"By specifying the agent name in the agent\\_reference field in extra\\_body."},{"key":"C","text":"By passing the agent’s endpoint URL as the model parameter value."}],"correct":["B"],"type":"mcq","answer":"B. Put an `agent_reference` containing the agent name in `extra_body`.","why":"The request must tell the generic OpenAI Responses client which saved Foundry agent should handle it. An `agent_reference` in `extra_body` carries that agent selection while the normal request still uses the Responses API. The agent name identifies the saved agent within the project, which is the key scenario clue.","whyNot":"An API key authenticates a caller and does not identify an agent. Supplying only an endpoint or model name selects infrastructure or a model deployment, not the saved agent configuration with its instructions and tools.","takeaway":"Reference a saved Foundry agent in a Responses request by placing its name in an `agent_reference` inside `extra_body`.","reviewNote":null,"docs":[{"title":"Build with runtime components in Foundry Agent Service","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/runtime-components"}]},{"id":"QA-056","n":56,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":44,"question":"You are building a web app named App1 that generates responses by using a model deployed to a Microsoft Foundry project named Project1. Before sending the prompts to the model, App1 must retrieve documents by using Azure AI Search. You need to integrate Project1 and App1. The solution must meet the following requirements: Multiple client applications must use the same search configuration. A security policy must prevent key-based authentication. Administrative effort must be minimized. What should you do?","options":[{"key":"A","text":"Create a custom HTTP connection in Foundry and manually configure Azure AI Search endpoints"},{"key":"B","text":"Configure an Azure AI Search connection in Project1 and reference the connection"},{"key":"C","text":"Call Azure AI Search directly from each application by using Microsoft Entra authentication."},{"key":"D","text":"Enable a managed identity for each application and call Azure AI Search directly."}],"correct":["B"],"type":"mcq","answer":"B. Configure one Azure AI Search project connection in Project1, use Microsoft Entra/managed-identity authentication, and reference that connection from each application.","why":"A project connection stores the Azure AI Search endpoint and authentication configuration once at the Foundry project level. Multiple applications can reference that shared configuration instead of duplicating search settings. Using Microsoft Entra authentication with a managed identity removes keys and allows access to be governed through RBAC. This combination meets reuse, keyless security, and low-administration requirements.","whyNot":"Giving each application its own search key duplicates configuration and violates the keyless policy. Embedding the endpoint and credentials in every client increases administrative effort, while merely disabling keys without configuring an identity and shared connection does not provide usable access.","takeaway":"For reusable keyless service access, centralize the service as a project connection and authenticate it with managed identity and RBAC.","reviewNote":null,"docs":[{"title":"Connect an Azure AI Search index to Foundry agents","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/ai-search"}]},{"id":"QA-057","n":57,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":44,"question":"Which extension should you use in Visual Studio Code to work with Foundry projects?","options":[{"key":"A","text":"Python extension for Visual Studio Code"},{"key":"B","text":"GitHub Copilot"},{"key":"C","text":"Foundry Toolkit for Visual Studio Code"}],"correct":["C"],"type":"mcq","answer":"C. Microsoft Foundry Toolkit for Visual Studio Code.","why":"Microsoft Foundry Toolkit for Visual Studio Code is the extension intended for Foundry development inside VS Code. It supports the project workflow for building, testing, deploying, evaluating, and monitoring AI applications and agents. The wording asks specifically for the extension associated with Foundry projects, which points directly to this toolkit.","whyNot":"General Azure extensions can manage resources but do not provide the Foundry-focused project experience. GitHub Copilot assists with coding, yet it is not the extension used to manage and work with Foundry projects.","takeaway":"For Foundry project work in VS Code, choose Microsoft Foundry Toolkit.","reviewNote":null,"docs":[{"title":"Microsoft Foundry Toolkit for Visual Studio Code overview","url":"https://learn.microsoft.com/en-us/azure/foundry/how-to/develop/get-started-projects-visual-studio-code"}]},{"id":"QA-058","n":58,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":44,"question":"What are the key steps to create a Microsoft Foundry Agent using the Microsoft Agent Framework?","options":[{"key":"A","text":"Deploy a custom AI model before creating an agent definition in the Azure portal."},{"key":"B","text":"Initialize the agent by defining a model in the `AgentThread` constructor."},{"key":"C","text":"Create an `AzureAIAgentClient`, define a ChatAgent with instructions and tools,"}],"correct":["C"],"type":"mcq","answer":"C. Create an `AzureAIAgentClient`, define a `ChatAgent` with instructions and tools, and create/reuse an `AgentThread` for the conversation.","why":"`AzureAIAgentClient` supplies access to the Foundry-backed agent service or model capabilities. A `ChatAgent` defines the agent's instructions and tools, which determine its behavior. An `AgentThread` is then created or reused to carry the conversation state across turns. Together, these components cover connectivity, behavior, and state.","whyNot":"An `AgentThread` does not define the model or the agent's tools; it represents conversation state. Creating only a client is also insufficient because the agent's instructions and callable capabilities still need to be defined.","takeaway":"Remember the Agent Framework sequence: client for access, `ChatAgent` for behavior and tools, `AgentThread` for conversation state.","reviewNote":null,"docs":[{"title":"AgentThread class","url":"https://learn.microsoft.com/en-us/python/api/agent-framework-core/agent_framework.agentthread?view=agent-framework-python-latest"},{"title":"What is Microsoft Foundry Agent Service?","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/overview"}]},{"id":"QA-059","n":59,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":45,"question":"Which component in the Microsoft Agent Framework manages conversation state and stores messages?","options":[{"key":"A","text":"AgentThread"},{"key":"B","text":"ChatAgent"},{"key":"C","text":"AzureAIAgentClient"}],"correct":["A"],"type":"mcq","answer":"A. `AgentThread`.","why":"`AgentThread` represents the ongoing conversation associated with an agent. It retains the messages or a reference to service-managed conversation state so later turns can continue in context. The question's two clues—state management and stored messages—are the thread's responsibility.","whyNot":"A `ChatAgent` defines instructions and tools but is not the per-conversation message container. The client connects to the service, and a tool performs an action; neither is the component that owns the conversation history.","takeaway":"In Microsoft Agent Framework, use `AgentThread` for per-conversation state and message history.","reviewNote":null,"docs":[{"title":"AgentThread class","url":"https://learn.microsoft.com/en-us/python/api/agent-framework-core/agent_framework.agentthread?view=agent-framework-python-latest"}]},{"id":"QA-060","n":60,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":45,"question":"You have a Microsoft Foundry project that contains an agent. The agent has a Model Context Protocol (MCP) tool that queries a knowledge base stored in Azure AI Search. Some agent runs return answers from the base model without invoking the knowledge base, which results in responses without grounded citations. You are provided with the following code snippet that runs the agent. image16 You need to add the correct tool _choice parameter to the code to deterministically force the agent to invoke the MCP tool on each run. What should you add?","options":[{"key":"A","text":"tool_choice={“required”}"},{"key":"B","text":"tool_choice={“auto”}"},{"key":"C","text":"tool_choice={“type”:“knowledge_base”}"},{"key":"D","text":"tool_choice ={“type”:“mcp”}"}],"correct":["A"],"type":"mcq","answer":"A conceptually, but the valid Python value is `tool_choice=\"required\"` (not `tool_choice={\"required\"}`).","why":"Setting `tool_choice=\"required\"` prevents the model from producing a final answer without calling a configured tool. Because the scenario describes the MCP tool as the knowledge path, requiring a tool forces retrieval before the response when it is the only available tool. The Python value must be the string `\"required\"`, not a set-like expression such as `{\"required\"}`. This directly addresses the tool-skipping behavior.","whyNot":"`auto` allows the model to answer without any tool, which caused the problem. A generic `required` setting does not select one named tool when several are configured, so a specific tool selector would be safer in that different scenario.","takeaway":"Use `tool_choice=\"required\"` to force at least one tool call; select a named tool when one specific tool must run.","reviewNote":null,"docs":[{"title":"Tool best practices for Microsoft Foundry Agent Service","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/tool-best-practice"},{"title":"Connect agents to MCP server endpoints","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/model-context-protocol"}]},{"id":"QA-061","n":61,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":46,"question":"… Sometimes, customers return to a session days later to continue the same support case, and the agent must resume with the full historical context. The agent must provide the following: Multi-turn continuity within the session Cross-session continuity for the same case Access to the full interaction history, including user messages, agent messages, tool calls, and tool outputs You need to ensure that the agent automatically reloads the complete history on each new turn. What should you do?","options":[{"key":"A","text":"Create and reuse a conversation by storing the conversation’s ID and supplying the"},{"key":"B","text":"Persist only the final model response stored in the client application and prepend the response"},{"key":"C","text":"Enable memory summarization on the agent definition to persist the context automatically."}],"correct":["A"],"type":"mcq","answer":"A. Create a conversation, persist its ID, and pass the same ID on later requests.","why":"A conversation is a durable runtime object that stores the interaction items associated with a case. Persisting and reusing its ID allows later requests to reload prior user messages, agent messages, tool calls, and tool outputs. That provides both multi-turn continuity and resumption across sessions days later. The clue is the requirement for the complete historical record, not just selected user preferences.","whyNot":"Sending only the latest prompt loses the earlier history, while rebuilding the entire message list in the client adds unnecessary state management. Memory is suited to recalling selected facts or preferences, but it is not a substitute for the full ordered interaction history stored by a conversation.","takeaway":"Persist and reuse a conversation ID when an agent must resume the complete interaction history across sessions.","reviewNote":null,"docs":[{"title":"Build with runtime components in Foundry Agent Service","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/runtime-components"}]},{"id":"QA-062","n":62,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":46,"question":"HOTSPOT HOTSPOT - You need to recommend a plan to create a customer support agent by using the Microsoft Foundry Agent Service. The agent must meet the following requirements: Retain user preferences across multiple conversations. Enable users to provide contextual grounding by directly uploading documents during a chat. Which Foundry capability should you recommend for each requirement? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Retain preferences across conversations → Foundry Memory (memory store/search tool); user-uploaded chat documents → File Search.","why":"Foundry Memory supports long-term recall across separate conversations, making it suitable for persistent user preferences. The memory scope can keep those preferences associated with the right user. File Search accepts uploaded documents, indexes their contents, and retrieves relevant passages during the chat. Each requirement therefore maps to a different capability: remembered user information versus document grounding.","whyNot":"A conversation preserves full interaction history but is not the dedicated capability for distilled cross-conversation preferences. Memory does not itself ingest and search an uploaded document as a chat knowledge source, and File Search does not provide user preference memory across unrelated conversations.","takeaway":"Use Memory for cross-session preferences and File Search for documents uploaded to ground a chat.","reviewNote":null,"docs":[{"title":"What is Memory?","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-memory"},{"title":"File search tool for Microsoft Foundry agents","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/file-search"}]},{"id":"QA-063","n":63,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":47,"question":"You have a Microsoft Foundry project that contains a support-ticket triage agent built by using the Foundry Agent Service. The agent uses tool to classify the ticket type and sot the ticket priority. Sometimes, the same support case continues across multiple sessions over several days. You need to persist state by using a durable ID to ensure that the agent can automatically reuse the full interaction history. The solution must preserve previous user messages, tool calls and tool outputs across turns and sessions. Which runtime component should you use?","options":[{"key":"A","text":"output item"},{"key":"B","text":"agent"},{"key":"C","text":"conversation"},{"key":"D","text":"response"}],"correct":["C"],"type":"mcq","answer":"C. Conversation.","why":"A Conversation is the durable runtime component identified by a reusable ID. It stores the ordered input and output items from agent turns, including messages, tool calls, and tool outputs. Reusing the same conversation lets a support case continue across different sessions without reconstructing its history in the client. Those details match every persistence requirement in the stem.","whyNot":"A single response represents one model interaction and does not by itself provide the durable case container described. Memory can recall selected facts, but it does not preserve the complete sequence of interaction items required here.","takeaway":"Choose Conversation when the exam asks for a durable ID and the full history of messages and tool activity.","reviewNote":null,"docs":[{"title":"Build with runtime components in Foundry Agent Service","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/runtime-components"}]},{"id":"QA-064","n":64,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":47,"question":"You have a Microsoft Foundry project that contains an agent for a customer support chat app. The agent uses a memory store and a memory search tool. You need to ensure that the conversation history does NOT persist across separate sessions. To what should you set the scope of the memory tool?","options":[{"key":"A","text":"session"},{"key":"B","text":"{{$conversationId}}"},{"key":"C","text":"{{$userId}}"},{"key":"D","text":"global"}],"correct":["A"],"type":"mcq","answer":"A. Use a session-specific scope (`session`, or an equivalent unique scope per session).","why":"A memory tool retrieves records only within its configured scope. Giving each chat session a distinct session-specific scope isolates the records created during that session. When a new session uses a different scope, prior conversation history is not returned. This meets the explicit requirement that history must not persist across separate sessions.","whyNot":"A user scope intentionally carries memory across sessions for the same person, which is the opposite of the requirement. A shared or global scope can expose memories across even more sessions or users and therefore provides less isolation.","takeaway":"Use a unique session scope to prevent memory from crossing chat-session boundaries.","reviewNote":null,"docs":[{"title":"Create and use memory in Foundry Agent Service","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/memory-usage"},{"title":"What is Memory?","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-memory"}]},{"id":"QA-065","n":65,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":48,"question":"DRAG DROP - You have a Microsoft Foundry project that contains an agent. You need to enable long-term memory to ensure that the agent can recall user preferences across separate conversations. Stored memories must be isolated per authenticated user without the client application manually generating user IDs. How should you complete the Python code? To answer, drag the appropriate values to the correct targets. Each value may be used once, more than once, or not at all. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Configure the memory search tool with the memory store and set its scope to the authenticated user identity (the visual option is typically `{{$userId}}`).","why":"The memory search tool must be connected to the memory store so it can retrieve saved preferences. Scoping the tool to the authenticated user identity keeps one user's memories separate from another's while allowing recall in later conversations. A built-in identity placeholder such as `{{$userId}}` avoids having the client invent and manage user identifiers. This satisfies both cross-conversation recall and per-user isolation.","whyNot":"A session scope would discard the desired continuity when the user starts a separate conversation. A global or shared scope could mix users' preferences, while a client-generated arbitrary ID adds the manual identity management the scenario explicitly excludes.","takeaway":"For automatic per-user long-term memory, scope the memory tool to the authenticated user identity rather than to a session or global value.","reviewNote":"The source PDF omits part or all of the exhibit/answer area. Use the original visual source to confirm the exact hotspot selection.","docs":[{"title":"Create and use memory in Foundry Agent Service","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/memory-usage"}]},{"id":"QA-066","n":66,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":48,"question":"HOTSPOT HOTSPOT - You have a Microsoft Foundry project. You need to create a customer support agent that meets the following requirements: • Grounds responses only in company policy documents stored in curated repositories • Retains customer preferences across separate chat sessions How should you configure the agent? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Company policy grounding → File Search (or a managed Foundry IQ/Azure AI Search knowledge source over the curated repository); cross-session preferences → Foundry Memory with per-user scope.","why":"A retrieval capability such as File Search or a managed search-backed knowledge source grounds answers in the curated company policy documents. Foundry Memory addresses the separate need to retain customer preferences across different chat sessions. Applying a per-user scope keeps those remembered preferences isolated to the correct customer. The scenario therefore requires both document retrieval and long-term user memory.","whyNot":"Memory alone is not a controlled document-retrieval system and should not be used as the policy repository. File Search or search grounding alone can answer from policies but does not preserve a user's preferences across separate sessions.","takeaway":"Pair a curated retrieval source for company facts with per-user Memory for cross-session personalization.","reviewNote":null,"docs":[{"title":"File search tool for Microsoft Foundry agents","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/file-search"},{"title":"What is Memory?","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-memory"}]},{"id":"QA-067","n":67,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":49,"question":"What is the primary benefit of using Microsoft Foundry Agent Service compared to building agents with standard APIs?","options":[{"key":"A","text":"It provides access to more powerful AI models"},{"key":"B","text":"It requires no Azure subscription"},{"key":"C","text":"It handles tool calling, state management, and infrastructure automatically"},{"key":"D","text":"It only works with the Azure portal"}],"correct":["C"],"type":"mcq","answer":"C. It handles tool calling, state management, and managed infrastructure.","why":"Microsoft Foundry Agent Service provides a managed runtime for executing agents and coordinating their tools. It also supplies service-managed state components and infrastructure capabilities that otherwise require custom implementation. The main advantage over assembling standard APIs is therefore reduced orchestration and infrastructure work, not a different prompting technique.","whyNot":"The service does not eliminate the need for an Azure subscription or all application code. It is not limited to portal-only development, and its primary benefit is broader than merely hosting a model endpoint.","takeaway":"Foundry Agent Service is the managed choice when you want built-in tool orchestration, state, and runtime infrastructure.","reviewNote":null,"docs":[{"title":"What is Microsoft Foundry Agent Service?","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/overview"}]},{"id":"QA-068","n":68,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":49,"question":"How does Microsoft Foundry Agent Service handle conversation state?","options":[{"key":"A","text":"By requiring developers to manually manage conversation history"},{"key":"B","text":"Through external database connections"},{"key":"C","text":"Through the Responses API which automatically manages conversation context"},{"key":"D","text":"Using local file storage on the client device"}],"correct":["C"],"type":"mcq","answer":"C, with qualification: use the Responses API together with a conversation (or `previous_response_id`) to maintain context.","why":"The Responses API can use service-managed state so the client does not need to resend the full message history on every turn. Reusing a Conversation provides durable context across turns, while `previous_response_id` can chain a new response to an earlier one. The qualification matters because merely calling the Responses API without one of these continuity mechanisms does not identify the history to reuse. The scenario is about how context is maintained, not only which API is called.","whyNot":"Manually rebuilding the full message list can work but gives up the service-managed state benefit described. Assuming that all independent Responses API calls automatically share context is also wrong; the calls must be linked by a conversation or previous response reference.","takeaway":"Responses become stateful when you reuse a Conversation or chain them with `previous_response_id`.","reviewNote":null,"docs":[{"title":"Build with runtime components in Foundry Agent Service","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/runtime-components"},{"title":"Quickstart: Build agents using the Responses API","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/quickstarts/responses-api"}]},{"id":"QA-069","n":69,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":49,"question":"What happens when an agent determines it needs a tool to respond to a user request?","options":[{"key":"A","text":"The agent asks the user for permission to use the tool"},{"key":"B","text":"The agent stops processing and waits for developer input"},{"key":"C","text":"The agent automatically invokes the tool, processes results, and incorporates them"},{"key":"D","text":"The agent sends the request to a separate processing queue"}],"correct":["C"],"type":"mcq","answer":"C. The agent invokes the tool, processes its result, and incorporates the result into the response.","why":"The model first determines from the prompt, instructions, and tool descriptions that external capability is needed. The agent runtime invokes a hosted tool, receives its result, and makes that result available to the model. The model then incorporates the information into the response rather than returning the raw call request as the final answer. This is the normal tool-use loop described by the scenario.","whyNot":"The agent does not simply mention the tool without using its output, and a hosted tool does not require the user to call it manually. For client-side function tools, the application must execute the requested function, so it would be wrong to assume that every tool is executed entirely by the service.","takeaway":"Tool use follows decide, invoke, return output, then generate the grounded response—with the app executing client-side functions.","reviewNote":null,"docs":[{"title":"Build with runtime components in Foundry Agent Service","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/runtime-components"},{"title":"Use function calling with Microsoft Foundry agents","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling"}]},{"id":"QA-070","n":70,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":49,"question":"Why is it critical to specify retrieval behavior in agent instructions?","options":[{"key":"A","text":"Without proper instructions, agents might answer from training data instead of the"},{"key":"B","text":"Instructions determine the semantic ranking algorithm that Foundry IQ applies to search results."},{"key":"C","text":"Instructions enable the agent to automatically update knowledge base content when it detects"}],"correct":["A"],"type":"mcq","answer":"A. Explicit retrieval instructions keep the agent using the knowledge source, grounding claims, and citing evidence instead of relying on model knowledge.","why":"Tool instructions tell the model what the retrieval source contains and when it should be used. Explicit grounding rules reduce the chance that the model answers from its pretrained knowledge when current or private evidence is required. They can also require evidence-based behavior such as citing retrieved sources or declining when retrieval has no support. The clue is the need for consistent retrieval behavior, which is controlled through clear agent instructions.","whyNot":"Adding a retrieval tool without usage guidance leaves tool selection discretionary and can still produce ungrounded answers. Increasing model creativity or relying only on general model knowledge does not enforce source use or citations.","takeaway":"Tell the agent when to retrieve, how to use the result, and what to do when the source provides no support.","reviewNote":null,"docs":[{"title":"Tool best practices for Microsoft Foundry Agent Service","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/tool-best-practice"},{"title":"Retrieval augmented generation (RAG) and indexes in Microsoft Foundry","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/retrieval-augmented-generation"}]},{"id":"QA-071","n":71,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":50,"question":"You have a Microsoft Foundry project named Project1 that contains an agent. The agent uses an OpenAPI 3.0 specification to call an external weather service. The weather service requires a key to be passed in an HTTP header. The key value is stored as a connection in Project1. You need to ensure that the key value from the connection is included automatically whenever the OpenAPI tool is invoked. What should you configure in the OpenAPI specification?","options":[{"key":"A","text":"a header parameter defined for each operation"},{"key":"B","text":"an Azure Key Vault connection"},{"key":"C","text":"an API key security scheme"},{"key":"D","text":"a Bearer token security scheme"}],"correct":["C"],"type":"mcq","answer":"C. An API-key security scheme (`type: apiKey`, `in: header`) linked to the project connection.","why":"An OpenAPI security scheme with `type: apiKey` describes API-key authentication. Setting `in: header` tells the tool that the credential belongs in an HTTP request header. Linking that security definition to the project connection lets Foundry obtain the stored secret and inject it when the operation runs. The combination matches the external service's header-key requirement without exposing the key in the specification.","whyNot":"A normal operation parameter treats the value as request data and can require callers to supply the secret repeatedly, rather than modeling authentication. OAuth or HTTP bearer schemes describe different credential flows and would not match an API that expects a fixed key header.","takeaway":"For a header API key, define an OpenAPI `apiKey` security scheme with `in: header` and bind it to the secret-bearing connection.","reviewNote":null,"docs":[{"title":"Connect OpenAPI tools to Microsoft Foundry agents","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/openapi"}]},{"id":"QA-072","n":72,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":50,"question":"You have a Microsoft Foundry project named Project1 that contains the following: An OpenAPI tool that calls an external API A project connection named Connection1 that stores the API key of the external API When an agent calls the OpenAPI tool, the API returns a 401 unauthorized error, and traces show that the API key header is NOT being sent. You need to ensure that the OpenAPI tool automatically includes the API key from Connection1 on all requests. What should you do?","options":[{"key":"A","text":"Enable identity passthrough so that the tool uses the Microsoft Entra token of the caller."},{"key":"B","text":"Add the API key header manually to the OpenAPI specification."},{"key":"C","text":"Configure the tool to use the default connection of Project1."},{"key":"D","text":"Connect the tool to Connection1."}],"correct":["D"],"type":"mcq","answer":"D. Connect the OpenAPI tool to `Connection1`.","why":"The OpenAPI specification can declare that an API key must be sent, but it does not contain the secret value. `Connection1` is the project object that stores that value securely. Associating the OpenAPI tool with `Connection1` gives Foundry the credential source needed to populate the header for every call. The missing header and 401 response are direct clues that this binding is absent.","whyNot":"Editing unrelated request parameters does not provide the credential, and hard-coding the key in the OpenAPI document would expose a secret and duplicate configuration. Defining the security scheme without connecting its credential source still leaves Foundry with no value to inject.","takeaway":"A security scheme defines where authentication goes; a bound project connection supplies the actual credential.","reviewNote":null,"docs":[{"title":"Connect OpenAPI tools to Microsoft Foundry agents","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/openapi"}]},{"id":"QA-073","n":73,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":51,"question":"DRAG DROP - You have a Microsoft Foundry project that contains a deployed ticket-triage agent. You discover that sometimes the agent responds without calling any tools, even when a tool is required. You need to ensure that the agent calls a tool during execution. How should you complete the Python code? To answer, drag the appropriate values to the correct targets. Each value may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Set `tool_choice=\"required\"` on the `responses.create(...)` call.","why":"`tool_choice=\"required\"` tells the Responses API that the model must call at least one configured tool during that response. This removes the `auto` behavior that permitted the ticket-triage agent to answer directly. Because the requirement is to ensure some tool is called, the generic required setting is sufficient. It belongs on the `responses.create(...)` request that starts the execution.","whyNot":"`tool_choice=\"auto\"` allows either a tool call or a direct answer, so it does not enforce the requirement. Disabling tool choice or omitting the parameter also leaves the decision to the model.","takeaway":"Set `tool_choice=\"required\"` on the response request when every run must include at least one tool call.","reviewNote":null,"docs":[{"title":"Tool best practices for Microsoft Foundry Agent Service","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/tool-best-practice"}]},{"id":"QA-074","n":74,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":51,"question":"… Ensure that the agent can access up-to-date information from public websites. Ensure that the agent can retrieve information from documents uploaded directly to the agent. What should you use for each requirement? To answer, drag the appropriate tools to the correct requirements. Each tool may be used once, more than once, or not at all. You may need to drag the split bar between panes or scroll to view content. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Calculations → Code Interpreter; current public-web information → Web Search/Grounding with Bing Search; uploaded agent documents → File Search.","why":"Code Interpreter executes Python in a sandbox, making it appropriate for calculations and data-processing tasks. Web Search or Grounding with Bing Search retrieves current information from public websites. File Search indexes and retrieves passages from documents uploaded for the agent. The three clues distinguish computation, live public retrieval, and private uploaded-file retrieval.","whyNot":"File Search cannot provide current general web information unless that content was uploaded, and Web Search is not the tool for private uploaded documents. Code Interpreter can calculate with provided data but is not a replacement for either retrieval source.","takeaway":"Map calculations to Code Interpreter, current public facts to Web Search, and uploaded documents to File Search.","reviewNote":null,"docs":[{"title":"Use Code Interpreter with Microsoft Foundry agents","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/code-interpreter"},{"title":"File search tool for Microsoft Foundry agents","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/file-search"}]},{"id":"QA-075","n":75,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":52,"question":"You have a Microsoft Foundry project that contains an agent. The agent uses two tools to perform the following actions: • Use Azure AI Search to retrieve answers from a private product documentation index. • Use the web search tool to retrieve public information on the internet. You need to ensure that for a specific run, the agent deterministically retrieves information only from the internet. To what should you set tool_choice?","options":[{"key":"A","text":"{“type”: “bing_grouding”}"},{"key":"B","text":"{“type”: “azure_ai-search”}"},{"key":"C","text":"“auto”"},{"key":"D","text":"“required”"}],"correct":["A"],"type":"mcq","answer":"A, corrected: `{\"type\": \"bing_grounding\"}` (the source misspells it as `bing_grouding`).","why":"A specific tool selector makes the run use the Bing grounding tool rather than leaving the model to choose between private search and web search. The valid documented tool type is `bing_grounding`, so `{\"type\": \"bing_grounding\"}` expresses the intended selection. This is more deterministic than merely requiring any tool because two tools are available. The correction also preserves the important distinction between the valid token and the source's misspelling.","whyNot":"`auto` can choose Azure AI Search or answer without the desired web tool, and `required` can force either available tool. The misspelled value `bing_grouding` is not the documented tool type and should not be copied into code.","takeaway":"When one tool must run among several, select that named tool type; for Bing grounding, spell it `bing_grounding`.","reviewNote":null,"docs":[{"title":"Use Grounding with Bing Search tools with the agents API","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/bing-tools"}]},{"id":"QA-076","n":76,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":52,"question":"Which tool should you use when a model needs to answer questions from your own uploaded policy documents?","options":[{"key":"A","text":"web\\_search"},{"key":"B","text":"file\\_search"},{"key":"C","text":"code\\_interpreter"}],"correct":["B"],"type":"mcq","answer":"B. `file_search`.","why":"`file_search` is designed to ground an agent in documents supplied by the user or application. It indexes those files in a vector store and retrieves relevant passages for the model's answer. The phrase “your own uploaded policy documents” directly identifies private file retrieval rather than public-web access or computation.","whyNot":"Web Search retrieves public internet content and does not search the agent's uploaded private files. Code Interpreter runs Python and can process files, but it is not the managed semantic retrieval tool requested here.","takeaway":"Choose `file_search` whenever an agent must answer from documents uploaded to its own knowledge store.","reviewNote":null,"docs":[{"title":"File search tool for Microsoft Foundry agents","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/file-search"}]},{"id":"QA-077","n":77,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":52,"question":"In a function-calling workflow, what should your application do after the model returns a function\\_call item?","options":[{"key":"A","text":"Wait for the model to run the function automatically"},{"key":"B","text":"Run the function in your code and send a function\\_call\\_output back to the model"},{"key":"C","text":"Convert the function call into a web\\_search request"}],"correct":["B"],"type":"mcq","answer":"B. Execute the requested function in application code and send a `function_call_output` item back to the model.","why":"A `function_call` item is a request from the model, not the result of executing local code. The application reads the requested function name and arguments, invokes the corresponding function, and captures its result. It then sends that result back as a `function_call_output` item so the model can continue reasoning and form the final response. This application-mediated loop is the core mechanism of function calling.","whyNot":"Returning the `function_call` directly to the user leaves the requested work unfinished. The model cannot execute arbitrary local application functions by itself, and sending ordinary user text instead of a linked function output would not complete the pending tool call correctly.","takeaway":"After `function_call`, the app executes the function and returns a matching `function_call_output` before asking for the final answer.","reviewNote":null,"docs":[{"title":"Use function calling with Microsoft Foundry agents","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling"}]},{"id":"QA-078","n":78,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":53,"question":"Which statement about the code\\_interpreter tool is correct?","options":[{"key":"A","text":"It can run Python code in a sandboxed runtime to help solve tasks"},{"key":"B","text":"It can browse external websites directly during code execution"},{"key":"C","text":"It only supports file uploads and can’t perform calculations"}],"correct":["A"],"type":"mcq","answer":"A. It runs Python code in a sandboxed execution environment.","why":"Code Interpreter provides a sandboxed environment in which the model can write and run Python. That enables calculations, data analysis, file processing, charts, and iterative correction based on execution results. The sandbox limits the execution context, which is an important part of the tool's design. The statement therefore describes both its language and execution model correctly.","whyNot":"Code Interpreter is not a general web browser or a live public-search tool. It also does not run arbitrary code directly on the application's host machine; execution occurs in the managed sandbox.","takeaway":"Think of Code Interpreter as managed sandboxed Python for computation and file analysis, not web retrieval.","reviewNote":null,"docs":[{"title":"Use Code Interpreter with Microsoft Foundry agents","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/code-interpreter"}]},{"id":"QA-079","n":79,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":53,"question":"What are custom tools, and how can they help you develop effective agents with Microsoft Foundry Agent Service?","options":[{"key":"A","text":"Callable functions that an agent can use to extend its capabilities."},{"key":"B","text":"Extensions for Visual Studio Code that make it easier to create and deploy agents."},{"key":"C","text":"Fine-tuned models that the agent can use to generate custom output."}],"correct":["A"],"type":"mcq","answer":"A. Callable functions that extend an agent’s capabilities.","why":"Custom tools expose application-specific capabilities that the base model does not have on its own. A function definition provides a name, description, and parameter schema that help the model decide when and how to request it. The application performs the operation and returns the output, allowing the agent to act on business systems or custom logic. This is why callable functions extend an agent's capabilities.","whyNot":"Custom tools are not extra training data and do not change the model's weights. They are also not merely prompt text; they define executable operations with structured inputs and outputs.","takeaway":"Use custom function tools to let an agent request application-defined actions through a structured callable interface.","reviewNote":null,"docs":[{"title":"Use function calling with Microsoft Foundry agents","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/function-calling"}]},{"id":"QA-080","n":80,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":53,"question":"You need to integrate functionality from an OpenAPI 3.0-based web service into an agent solution. What should you do?","options":[{"key":"A","text":"Add the JSON schema of the web service to the agent’s instructions."},{"key":"B","text":"Rewrite the web service as a Python function and hard-code it in your agent app."},{"key":"C","text":"Add the web service as an OpenAPI specification tool to the agent definition"}],"correct":["C"],"type":"mcq","answer":"C. Add the web service’s OpenAPI specification as an OpenAPI tool in the agent definition.","why":"An OpenAPI tool lets Foundry read an OpenAPI 3.0 specification and expose its operations to the agent. The specification provides operation paths, parameters, request and response shapes, and authentication metadata needed for tool calls. Adding it to the agent definition turns the external web service into an executable capability rather than merely descriptive context. That directly fits the requirement to integrate an OpenAPI-based service.","whyNot":"Pasting the specification into agent instructions does not configure callable HTTP operations. Rewriting every endpoint as an unrelated local function is unnecessary when the service already publishes a compatible OpenAPI description.","takeaway":"Integrate an OpenAPI 3.x service by registering its specification as an OpenAPI tool on the agent.","reviewNote":null,"docs":[{"title":"Connect OpenAPI tools to Microsoft Foundry agents","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/tools/openapi"}]},{"id":"QA-081","n":81,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":53,"question":"Your agent application code includes a local function that you want the agent to call. What kind of tool should you add to the agent's definition?","options":[{"key":"A","text":"Function calling"},{"key":"B","text":"Code interpreter"},{"key":"C","text":"Azure Functions"}],"correct":["A"],"type":"mcq","answer":"A. Function calling","why":"Function calling is the tool type used to describe a local application function to the model. Its schema tells the model the function's purpose and expected arguments. When selected, the model requests the call, and the application executes the local function and returns its output. This keeps local business logic in the application while making it available to the agent.","whyNot":"An OpenAPI tool is intended for services described by an OpenAPI document, not a local in-process function. File Search and Code Interpreter provide retrieval and sandboxed computation, respectively, and do not expose the application's own callable function.","takeaway":"Expose a local application function to an agent with a function-calling tool.","reviewNote":null,"docs":[{"title":"Azure AI Agents function calling","url":"https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/function-calling"}]},{"id":"QA-082","n":82,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":54,"question":"What role does the MCP server play in the MCP agent tool integration?","options":[{"key":"A","text":"Runs the AI agent and processes user prompts directly."},{"key":"B","text":"Manages network connections between multiple agents."},{"key":"C","text":"Hosts tool definitions and makes them available for discovery by the client."}],"correct":["C"],"type":"mcq","answer":"C. Hosts tool definitions and makes them available for discovery by the client.","why":"The MCP server publishes a catalog of tools and their descriptions through the Model Context Protocol. An MCP client connects to the server, discovers those tools, and can invoke them using the protocol. The server may also expose resources and prompts, but its key role in tool integration is to host and advertise capabilities. This separation lets clients use tools without hard-coding every implementation detail.","whyNot":"The server is not the language model and does not decide the agent's final answer. The client, not the server, integrates discovered tools into the agent workflow and requests their execution.","takeaway":"In MCP, the server exposes discoverable capabilities and the client discovers and invokes them for the agent.","reviewNote":null,"docs":[{"title":"Connect agents to Model Context Protocol servers","url":"https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/model-context-protocol"},{"title":"Using MCP tools with agents","url":"https://learn.microsoft.com/en-us/agent-framework/agents/tools/local-mcp-tools"}]},{"id":"QA-083","n":83,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":54,"question":"How does an MCP client retrieve available tools from the MCP server?","options":[{"key":"A","text":"By calling `session.list_tools()` to get the current tool catalog."},{"key":"B","text":"By reading a static JSON file from the server directory."},{"key":"C","text":"By subscribing to server events via a WebSocket connection."}],"correct":["A"],"type":"mcq","answer":"A. Call `session.list_tools()`.","why":"An MCP client operates through an active session with the server. Calling `session.list_tools()` asks that server for its currently available tool catalog and returns the definitions the client can adapt for agent use. This supports dynamic discovery rather than assuming a fixed set of tools. The method name directly matches the requested action.","whyNot":"Reading a local configuration file would not reflect the server's live advertised capabilities. Calling a tool-execution method before discovery also does not retrieve the catalog and requires the client to already know the tool name and schema.","takeaway":"Use `session.list_tools()` to discover the tools currently advertised by an MCP server.","reviewNote":null,"docs":[{"title":"Using MCP tools with agents","url":"https://learn.microsoft.com/en-us/agent-framework/agents/tools/local-mcp-tools"}]},{"id":"QA-084","n":84,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":54,"question":"Why should MCP tools be wrapped in async functions on the client-side?","options":[{"key":"A","text":"To allow the agent to wait for user input."},{"key":"B","text":"To enable asynchronous invocation so the agent can call tools without blocking."},{"key":"C","text":"To convert the functions into REST API endpoints automatically."}],"correct":["B"],"type":"mcq","answer":"B. To enable asynchronous invocation so the agent can call tools without blocking.","why":"MCP tool calls normally involve network or other I/O while the client waits for the server's response. Wrapping them in async functions lets the application `await` that work without blocking the event loop. This allows other agent or application tasks to make progress while the remote invocation is pending. The benefit is responsive, scalable orchestration rather than faster tool logic by itself.","whyNot":"Async wrappers do not change a synchronous server operation into local computation or guarantee parallel execution automatically. They also are not primarily for authentication or schema conversion; their purpose here is nonblocking invocation.","takeaway":"Wrap MCP calls asynchronously because remote tool I/O should be awaited without blocking the agent application's event loop.","reviewNote":null,"docs":[{"title":"Using MCP tools with agents","url":"https://learn.microsoft.com/en-us/agent-framework/agents/tools/local-mcp-tools"}]},{"id":"QA-085","n":85,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":54,"question":"What is the main difference between shared scope and organization scope when publishing an agent?","options":[{"key":"A","text":"Shared scope requires more Azure resources"},{"key":"B","text":"Organization scope requires admin approval before the agent is available to all users"},{"key":"C","text":"Shared scope only works in the Foundry playground"},{"key":"D","text":"Organization scope provides better agent performance"}],"correct":["B"],"type":"mcq","answer":"B. Organization scope requires admin approval before the agent is available to all users.","why":"Shared or individual publishing makes an agent available within the narrower sharing model without granting organization-wide availability. Organization scope expands availability to all users in the tenant, which introduces an administrative governance boundary. Requiring Microsoft 365 administrator approval provides that organization-level control. The key distinction is therefore approval and reach, not a difference in the agent's model or tools.","whyNot":"Shared scope is not automatically equivalent to tenant-wide publication, and it does not require the same organization-wide approval path. Organization scope does not inherently change the agent's runtime behavior; it changes how broadly the published agent is made available.","takeaway":"Organization scope means tenant-wide availability and therefore requires admin approval; shared scope is narrower.","reviewNote":null,"docs":[{"title":"Understand Foundry agent publishing options","url":"https://learn.microsoft.com/en-us/training/modules/integrate-foundry-agent-with-m365/2-understand-publishing-options"},{"title":"Publish an agent from Foundry portal to Teams","url":"https://learn.microsoft.com/en-us/training/modules/integrate-foundry-agent-with-m365/3-publish-agent-foundry-portal"}]},{"id":"QA-086","n":86,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":55,"question":"What is Microsoft Work IQ?","options":[{"key":"A","text":"A machine learning model for workplace analytics"},{"key":"B","text":"A CLI and MCP server that connects AI agents to Microsoft 365 data"},{"key":"C","text":"A replacement for Microsoft Teams"},{"key":"D","text":"A Visual Studio Code extension for building agents"}],"correct":["B"],"type":"mcq","answer":"B. A CLI and MCP server that connects AI agents to Microsoft 365 data.","why":"Microsoft Work IQ provides a command-line interface for accessing Microsoft 365 information in development and automation workflows. It also runs as an MCP server, allowing compatible AI agents and assistants to discover and use Microsoft 365-connected capabilities as tools. The combination of CLI and MCP server is the defining clue in the question. Its role is connectivity to Microsoft 365 data, not model hosting.","whyNot":"Work IQ is not a foundation model, an agent orchestration service, or a replacement for Microsoft 365 itself. A standalone portal or database description also misses its two stated interfaces: command line and MCP.","takeaway":"Recognize Microsoft Work IQ as the CLI-and-MCP bridge that exposes Microsoft 365 data to AI agents.","reviewNote":null,"docs":[{"title":"Microsoft Work IQ CLI","url":"https://learn.microsoft.com/en-us/microsoft-365/copilot/extensibility/work-iq/cli"}]},{"id":"QA-087","n":87,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":55,"question":"When should you consider using the Microsoft 365 Agents Toolkit instead of direct publishing from Foundry?","options":[{"key":"A","text":"For all production deployments"},{"key":"B","text":"When you need custom SSO, middleware logic, or multi-environment deployment"},{"key":"C","text":"When publishing to shared scope"},{"key":"D","text":"When your agent doesn’t use any tools"}],"correct":["B"],"type":"mcq","answer":"B. When you need custom SSO, middleware logic, or multi-environment deployment.","why":"Direct publishing from Foundry is optimized for a straightforward path to supported channels. The Microsoft 365 Agents Toolkit becomes useful when the solution needs application-level control beyond that managed path. Custom single sign-on, middleware that intercepts or enriches requests, and deployment across separate environments all require that extra control. Those scenario clues therefore point to the toolkit rather than direct publishing.","whyNot":"Direct Foundry publishing is the better fit when the goal is minimal setup and the standard publishing experience is sufficient. Rebuilding the agent or changing its model does not provide custom SSO, middleware, or environment-aware deployment pipelines.","takeaway":"Choose Microsoft 365 Agents Toolkit when publishing requires custom authentication, middleware, or multi-environment application lifecycle control.","reviewNote":null,"docs":[{"title":"Understand Foundry agent publishing options","url":"https://learn.microsoft.com/en-us/training/modules/integrate-foundry-agent-with-m365/2-understand-publishing-options"}]},{"id":"QA-088","n":88,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":55,"question":"How do you add custom functionality to a Microsoft Foundry Agent in the Microsoft Agent Framework?","options":[{"key":"A","text":"Configure custom functions in the Azure portal and link them to the agent through connection"},{"key":"B","text":"Create Python functions with proper type annotations and descriptions, then pass"},{"key":"C","text":"Modify the AI model’s architecture to integrate the custom functionality directly."}],"correct":["B"],"type":"mcq","answer":"B. Create typed, described Python functions and pass them to the agent's `tools` parameter.","why":"The Microsoft Agent Framework can expose ordinary Python functions as tools that an agent may call. Type annotations define the expected inputs, while descriptions tell the model what the function does and when it is appropriate. Passing those functions through the agent's `tools` parameter registers them as callable capabilities. This adds custom behavior without embedding the implementation details in the prompt.","whyNot":"Putting function instructions only in the system prompt does not make the function executable. An MCP server or OpenAPI tool can also expose capabilities, but those are unnecessary when the functionality already exists as local typed Python functions.","takeaway":"For local custom behavior in Agent Framework, define well-described typed Python functions and register them in `tools`.","reviewNote":null,"docs":[{"title":"Build agents using the Responses API","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/quickstarts/responses-api"},{"title":"Azure AI Agents function calling","url":"https://learn.microsoft.com/en-us/azure/ai-foundry/agents/how-to/tools/function-calling
