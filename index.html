*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Segoe UI",Arial,sans-serif}.app{min-height:100%;display:grid;grid-template-columns:300px minmax(0,1fr)}button,input,select{font:inherit}button{cursor:pointer}.sidebar{background:var(--nav);color:#eaf2f8;padding:22px 18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}.mark{width:42px;height:42px;border-radius:10px;background:#fff;color:#102a43;font-weight:800;display:grid;place-items:center;letter-spacing:-.7px}.brand h1{font-size:17px;line-height:1.15;margin:0}.brand p{margin:3px 0 0;color:#a8bed0;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:0 0 18px}.stat{background:rgba(255,255,255,.075);border:1px solid rgba(255,255,255,.1);border-radius:9px;padding:9px 7px}.stat strong{display:block;font-size:16px}.stat span{font-size:10px;color:#b8c9d6;text-transform:uppercase;letter-spacing:.6px}.side-label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:#b9c9d5;margin:17px 0 7px}.side-control{width:100%;height:44px;border:1px solid rgba(255,255,255,.24);background:rgba(255,255,255,.09);color:#fff;border-radius:9px;padding:0 11px}.side-control::placeholder{color:#c3d0da}.side-control option{color:#17212b}.domains{display:grid;gap:5px}.domain-btn{border:0;background:transparent;color:#d4e0e8;text-align:left;border-radius:8px;padding:10px}.domain-btn:hover,.domain-btn.active{background:rgba(255,255,255,.11);color:#fff}.domain-btn small{display:block;color:#afc2d0}.map{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:8px}.qdot{height:34px;border-radius:7px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.05);color:#cbd8e2;font-size:11px;padding:0}.qdot.current{outline:2px solid #78bcff;outline-offset:1px}.qdot.correct{background:#126048;color:#fff}.qdot.wrong{background:#8c3537;color:#fff}.qdot.flagged:after{content:"•";color:#ffd078;position:absolute}.qdot{position:relative}.main{min-width:0}.topbar{height:68px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(16px,4vw,48px);position:sticky;top:0;z-index:5}.crumb{font-size:13px;color:var(--muted)}.crumb strong{color:var(--ink)}.top-actions{display:flex;gap:8px}.icon-btn,.ghost,.primary,.choice,.self-btn{min-height:44px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}.icon-btn{width:44px}.content{max-width:980px;margin:0 auto;padding:32px clamp(16px,4vw,48px) 60px}.progress-row{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:14px;color:var(--muted);font-size:13px}.progress{height:7px;background:var(--line);border-radius:99px;overflow:hidden;flex:1}.progress>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.card-head{padding:24px 28px 18px;border-bottom:1px solid var(--line)}.eyebrow{display:flex;gap:8px;align-items:center;color:var(--muted);font-size:13px;letter-spacing:.2px;flex-wrap:wrap}.badge{background:var(--accent-soft);color:var(--accent);padding:4px 9px;border-radius:99px;font-weight:700;white-space:nowrap}.question{font-size:19px;line-height:1.4;font-weight:600;margin:15px 0 0;white-space:pre-line;text-wrap:pretty}.card-body{padding:24px 28px}.helper{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;color:var(--muted);font-size:13px}.choices{display:grid;gap:10px}.choice{width:100%;text-align:left;padding:13px 15px;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;transition:border-color .15s,background .15s,transform .15s}.choice:hover{border-color:var(--accent);transform:translateY(-1px)}.choice:focus-visible,.primary:focus-visible,.ghost:focus-visible,.icon-btn:focus-visible,.domain-btn:focus-visible,.qdot:focus-visible{outline:3px solid color-mix(in srgb,var(--accent) 35%,transparent);outline-offset:2px}.choice .letter{width:30px;height:30px;border-radius:8px;background:var(--panel-2);border:1px solid var(--line);display:grid;place-items:center;font-weight:750}.choice.selected{border-color:var(--accent);background:var(--accent-soft)}.choice.correct{border-color:var(--good);background:var(--good-soft)}.choice.wrong{border-color:var(--bad);background:var(--bad-soft)}.choice[disabled]{cursor:default;transform:none}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:22px}.action-group{display:flex;gap:9px}.primary,.ghost,.self-btn{padding:0 17px;font-weight:650}.primary{background:var(--accent);border-color:var(--accent);color:#fff}.primary:disabled{opacity:.45;cursor:not-allowed}.feedback{margin-top:22px;border-top:1px solid var(--line);padding-top:22px;display:none}.feedback.show{display:block}.result-line{display:flex;gap:10px;align-items:center;font-size:17px;font-weight:750;margin-bottom:16px}.result-line.good{color:var(--good)}.result-line.bad{color:var(--bad)}.explain-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:14px}.explain{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:15px}.explain h3,.takeaway h3,.docs h3{margin:0 0 7px;font-size:13px;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}.explain p,.takeaway p{margin:0;color:var(--ink)}.takeaway{margin-top:14px;background:var(--good-soft);border:1px solid color-mix(in srgb,var(--good) 42%,var(--line));border-radius:11px;padding:15px}.review-note{margin-top:12px;background:var(--warn-soft);color:var(--warn);padding:12px 14px;border-radius:10px}.docs{margin-top:16px}.docs a{display:block;color:var(--accent);margin:5px 0;text-underline-offset:2px}.review-panel{text-align:center;padding:10px 0 2px}.review-panel p{color:var(--muted);max-width:620px;margin:0 auto 16px}.answer-reveal{display:none;text-align:left;background:var(--panel-2);border:1px solid var(--line);border-radius:11px;padding:16px;margin-top:16px}.answer-reveal.show{display:block}.answer-reveal strong{color:var(--good)}.self-score{display:none;justify-content:center;gap:10px;margin-top:14px}.self-score.show{display:flex}.flag{margin-left:auto;border:0;background:transparent;color:var(--muted);min-height:44px;padding:0 8px}.flag.active{color:var(--warn);font-weight:700}.mobile-menu{display:none}.empty{text-align:center;padding:55px 20px;color:var(--muted)}.kbd{font:11px/1 ui-monospace,Consolas,monospace;border:1px solid var(--line);background:var(--panel-2);border-radius:5px;padding:2px 5px}

<script>
const QUESTIONS=[{"id":"QA-001","n":1,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":5,"question":"You have a Microsoft Foundry project. You plan to build a customer support solution that contains an agent. The solution must meet the following requirements: Provide accurate, context-aware responses grounded in internal product documentation stored in Azure AI Search. Require deep, multi-step reasoning across long contexts. Generate detailed natural language responses. Which type of model should you use to power the agent?","options":[{"key":"A","text":"a multimodal model"},{"key":"B","text":"a small language model (SLM)"},{"key":"C","text":"a key phrase extraction model"},{"key":"D","text":"a large language model (LLM)"}],"correct":["D"],"type":"mcq","answer":"D. A large language model (LLM).","why":"A large language model is designed to interpret long prompts, reason across multiple pieces of context, and produce detailed natural-language answers. In this scenario, Azure AI Search retrieves the relevant internal documentation, while the LLM synthesizes that retrieved evidence into a context-aware response. The requirements for deep, multi-step reasoning and long-context processing point to the greater capability of an LLM.","whyNot":"A small language model is usually chosen when lower cost, lower latency, or constrained deployment matters more than maximum reasoning depth. Azure AI Search is a retrieval system rather than the generative model that composes the final support response, and an embedding model creates vectors rather than detailed answers.","takeaway":"Choose an LLM when the task emphasizes long context, multi-step reasoning, and rich natural-language generation; use search only to supply grounding context.","reviewNote":null,"docs":[{"title":"Model benchmarks and leaderboards in Microsoft Foundry","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/model-benchmarks"},{"title":"Agentic retrieval overview","url":"https://learn.microsoft.com/en-us/azure/search/agentic-retrieval-overview"}]},{"id":"QA-002","n":2,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":5,"question":"Which model benchmark indicates the model's ability to process prompts and return comprehensive responses quickly?","options":[{"key":"A","text":"Quality index"},{"key":"B","text":"Cost"},{"key":"C","text":"Throughput"}],"correct":["C"],"type":"mcq","answer":"C. Throughput.","why":"Throughput measures how much prompt-and-response work a model can complete over time. A model with higher throughput can process incoming prompts and return comprehensive responses faster under a given workload. The clue is the question's focus on processing speed and response delivery rather than answer quality or price.","whyNot":"Quality index evaluates the quality of model outputs, not how quickly requests are processed. Cost measures the expense of using the model, while latency focuses on the delay for an individual request rather than aggregate processing capacity.","takeaway":"When a benchmark asks how much inference work a model can process quickly at scale, choose throughput.","reviewNote":null,"docs":[{"title":"Model benchmarks and leaderboards in Microsoft Foundry","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/model-benchmarks"}]},{"id":"QA-003","n":3,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":6,"question":"… Requirements - Contoso identifies the following business requirements: Users that interact with Agent1 must have a personalized experience in future interactions, including the ability for Agent1 to retain conversation context and recall relevant information from previous interactions. Agent1 must answer questions only about the products sold by Contoso. You need to recommend a solution to support the planned changes and technical requirements for Agent1 to use the product information stored in storage1. What should you include in the recommendation?","options":[{"key":"A","text":"Azure Translator in Foundry Tools"},{"key":"B","text":"Grounding with Bing Search"},{"key":"C","text":"Azure AI Search"},{"key":"D","text":"Azure Document intelligence in Foundry Tools"}],"correct":["C"],"type":"mcq","answer":"C. Azure AI Search.","why":"Azure AI Search can index the product PDFs stored in Azure Blob Storage and make relevant passages retrievable by the agent. Its semantic and vector search capabilities support grounding answers in Contoso's own product information. This directly supports the requirement that the agent answer only from the internal product catalog.","whyNot":"Azure AI Translator changes text between languages but does not index or retrieve product knowledge. Grounding with Bing Search targets public web content, which does not provide the required control over Contoso's private product sheets.","takeaway":"Use Azure AI Search when an agent must retrieve and ground answers in private documents stored in Azure.","reviewNote":null,"docs":[{"title":"Agentic retrieval overview","url":"https://learn.microsoft.com/en-us/azure/search/agentic-retrieval-overview"},{"title":"Generate embeddings","url":"https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-generate-embeddings"}]},{"id":"QA-004","n":4,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":8,"question":"Which component of Microsoft Foundry provides pre-built services for common AI tasks?","options":[{"key":"A","text":"Foundry Tools"},{"key":"B","text":"Foundry Models"},{"key":"C","text":"Foundry IQ"}],"correct":["A"],"type":"mcq","answer":"A. Foundry Tools.","why":"Foundry Tools provides ready-made AI capabilities for common tasks such as language analysis, vision, speech, and content processing. These services let a solution add established AI functions without training a model for each task. The phrase “pre-built services for common AI tasks” therefore maps directly to Foundry Tools.","whyNot":"Foundry Models is the catalog and deployment layer for generative and other models, not the collection of pre-built task services. Foundry IQ supplies a managed knowledge and retrieval layer, so it addresses grounding rather than general-purpose language or vision operations.","takeaway":"Map pre-built language, vision, speech, and content capabilities to Foundry Tools.","reviewNote":null,"docs":[{"title":"What are Foundry Tools?","url":"https://learn.microsoft.com/en-us/azure/ai-services/what-are-ai-services"}]},{"id":"QA-005","n":5,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":9,"question":"You have a chat app in a Microsoft Foundry project and an Azure AI Search vectorized index. You need to connect to the index to meet the following requirements: Complex questions must retrieve information from multiple chunks. Multi-turn conversations must influence retrieval planning. Retrievals must run in parallel to reduce latency. Which retrieval approach should you use?","options":[{"key":"A","text":"iterative retrieval"},{"key":"B","text":"agentic Retrieval Augmented Generation (RAG)"},{"key":"C","text":"chain of thought"},{"key":"D","text":"classic Retrieval Augmented Generation (RAG)"}],"correct":["B"],"type":"mcq","answer":"B. Agentic retrieval-augmented generation (RAG).","why":"Agentic RAG uses the conversation history to understand a complex information need and plan several focused retrieval queries. It can run those subqueries in parallel and combine evidence from multiple chunks before generating an answer. Those behaviors match all three clues: complex questions, multi-turn context, and parallel retrieval for lower latency.","whyNot":"Classic RAG usually performs a more direct retrieval pass from the current query and lacks the same query-planning behavior. Simple vector search can find similar chunks, but by itself it does not decompose a question or coordinate parallel searches informed by conversation history.","takeaway":"Choose agentic RAG when retrieval must plan, decompose, and parallelize searches using multi-turn context.","reviewNote":null,"docs":[{"title":"Agentic retrieval overview","url":"https://learn.microsoft.com/en-us/azure/search/agentic-retrieval-overview"}]},{"id":"QA-006","n":6,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":9,"question":"You have a Microsoft Foundry project. You need to deploy a model from the model catalog to support a search solution for internal policy documents. The model must generate vector representations of the text in the documents and of user queries. Which type of model should you use?","options":[{"key":"A","text":"an embedding model"},{"key":"B","text":"an image generation model"},{"key":"C","text":"a large language model (LLM)"},{"key":"D","text":"a small language model (SLM)"}],"correct":["A"],"type":"mcq","answer":"A. An embedding model.","why":"An embedding model converts document text and user queries into numeric vectors in the same semantic space. Azure AI Search can compare those vectors to retrieve documents whose meanings are similar to the query. The requirement to generate vector representations for both corpus text and queries is the defining use case for an embedding model.","whyNot":"A large language model generates or transforms natural language but is not the specialized choice for producing search vectors. A reranking model can reorder retrieved candidates, while a chat model produces responses; neither creates the primary document and query embeddings requested here.","takeaway":"If both documents and queries must become vectors for similarity search, use an embedding model.","reviewNote":null,"docs":[{"title":"Generate embeddings","url":"https://learn.microsoft.com/en-us/azure/search/vector-search-how-to-generate-embeddings"}]},{"id":"QA-007","n":7,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":10,"question":"You are planning a Microsoft Foundry project named Project1 that will contain multiple agents. Each agent will access the same Azure AI Search resource. You need to recommend a solution to centrally manage the Azure AI Search credentials within Project1. The solution must be implemented across all the agents. What should you recommend?","options":[{"key":"A","text":"Enable role-based access control (RBAC) for the Azure AI Search resource."},{"key":"B","text":"Disable key-based access control on the Azure AI Search resource."},{"key":"C","text":"Add a connection to the Azure AI Search resource."},{"key":"D","text":"Create a managed private endpoint that connects to the Azure AI Search resource."}],"correct":["C"],"type":"mcq","answer":"C. Add a connection to the Azure AI Search resource.","why":"A project connection stores the Azure AI Search endpoint and authentication configuration at the Foundry project level. Every agent in Project1 can reference that shared connection instead of maintaining separate credentials. This centralizes administration and satisfies the requirement to implement the configuration across all agents.","whyNot":"Assigning RBAC roles controls authorization but does not create a reusable project-level connection for the agents. Disabling keys can enforce keyless access, but it still does not define the shared endpoint and credential configuration that each agent needs.","takeaway":"Use a project connection to centralize one external resource configuration for multiple agents in the same Foundry project.","reviewNote":null,"docs":[{"title":"Add a new connection to your project","url":"https://learn.microsoft.com/en-us/azure/foundry/how-to/connections-add"}]},{"id":"QA-008","n":8,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":11,"question":"… Business Requirements - Contoso identifies the following business requirements: • Users that interact with Agent1 must have a personalized experience in future interactions, including the ability for Agent1 to retain conversation context and recall relevant information from previous interactions. • Agent1 must answer questions only about the products sold by Contoso. You need to configure personalized user interactions for Agent1. The solution must meet the business requirements. What should you include in the solution?","options":[{"key":"A","text":"knowledge"},{"key":"B","text":"memory"},{"key":"C","text":"guardrails"},{"key":"D","text":"tools"}],"correct":["B"],"type":"mcq","answer":"B. Memory.","why":"Memory retains useful user details and conversation-derived information beyond a single interaction. On later visits, the agent can retrieve those stored preferences or facts to personalize the experience and recall relevant prior context. That cross-interaction continuity is exactly what the scenario requires.","whyNot":"Knowledge or retrieval grounds responses in external documents, but it does not by itself preserve per-user history or preferences. A conversation object can maintain a thread of messages, yet long-term personalization across distinct conversations is the role highlighted by Memory.","takeaway":"Choose Memory when an agent must remember user-specific context or preferences across future interactions.","reviewNote":null,"docs":[{"title":"What is Memory?","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/what-is-memory"}]},{"id":"QA-009","n":9,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":14,"question":"Which data source option provides real-time access to SharePoint content with Microsoft 365 governance?","options":[{"key":"A","text":"SharePoint Indexed, which pre-processes SharePoint content into Azure AI Search."},{"key":"B","text":"SharePoint Remote, which queries SharePoint sites and libraries in real-time."},{"key":"C","text":"Azure Blob Storage, which connects to SharePoint files stored as blobs."}],"correct":["B"],"type":"mcq","answer":"B. SharePoint Remote.","why":"SharePoint Remote retrieves content directly from SharePoint when the user asks a question rather than relying on a separately copied index. Because access occurs through Microsoft 365, existing permissions and governance can be honored at retrieval time. The clues “real-time access” and “Microsoft 365 governance” therefore identify SharePoint Remote.","whyNot":"SharePoint Indexed ingests and preprocesses content into an Azure AI Search index, so results depend on the indexing cycle rather than direct real-time access. A generic web or file source would not automatically carry the same SharePoint permission and governance model.","takeaway":"Choose SharePoint Remote for live SharePoint retrieval that respects Microsoft 365 permissions and governance.","reviewNote":null,"docs":[{"title":"Create a SharePoint (Remote) knowledge source","url":"https://learn.microsoft.com/en-us/azure/search/agentic-knowledge-source-how-to-sharepoint-remote"}]},{"id":"QA-010","n":10,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":14,"question":"What is the purpose of scoring profiles in Foundry IQ knowledge bases?","options":[{"key":"A","text":"To encrypt sensitive fields and protect confidential information during retrieval."},{"key":"B","text":"To boost specific fields or attributes so more important results surface first."},{"key":"C","text":"To configure how documents are chunked and embedded for semantic search."}],"correct":["B"],"type":"mcq","answer":"B. Boost specific fields or attributes so more important results surface first.","why":"A scoring profile adjusts relevance scoring so selected fields or document attributes contribute more strongly to the final rank. This can promote results based on factors such as field importance, freshness, distance, or defined values. Its purpose is therefore to make the most important matching results surface first.","whyNot":"Scoring profiles do not encrypt sensitive fields or define who can read a document. They also do not control document chunking or create embeddings; those behaviors belong to ingestion and vectorization configuration.","takeaway":"Use a scoring profile to boost relevance signals and reorder matching search results.","reviewNote":null,"docs":[{"title":"Add scoring profiles to an Azure AI Search index","url":"https://learn.microsoft.com/en-us/azure/search/index-add-scoring-profiles"}]},{"id":"QA-011","n":11,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":14,"question":"HOTSPOT HOTSPOT You plan to create a Microsoft Foundry project named Project1 that will contain an agent and use an Azure key vault named KV1. You need to configure a connection from Project1 to KV1. How should you complete the Bicep code? To answer, select the appropriate options in the answer area? NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Use a `Microsoft.CognitiveServices/accounts/connections` child resource with `category: 'AzureKeyVault'`, `target: existingKeyVault.id`, and `authType: 'AccountManagedIdentity'`.","why":"A `Microsoft.CognitiveServices/accounts/connections` child resource represents a reusable connection owned by the Foundry account. Setting `category` to `AzureKeyVault` and `target` to the existing vault ID identifies the connection type and destination. Using `authType: 'AccountManagedIdentity'` makes the Foundry account identity authenticate to the vault without storing a secret, although the missing visual must confirm the exact hotspot placements.","whyNot":"A key-based authentication choice would introduce a stored credential and would not match the managed-identity pattern in the answer. A generic deployment or project resource would not define the Key Vault connection, and different category or target values would point to the wrong service.","takeaway":"For a keyless Foundry-to-Key-Vault connection in Bicep, use an account connection targeting the vault with account managed identity authentication.","reviewNote":"The source PDF omits part or all of the exhibit/answer area. Use the original visual source to confirm the exact hotspot selection.","docs":[{"title":"Set up an Azure Key Vault connection","url":"https://learn.microsoft.com/en-us/azure/foundry/how-to/set-up-key-vault-connection"}]},{"id":"QA-012","n":12,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":15,"question":"HOTSPOT HOTSPOT You have an Azure subscription. You need to create a new resource that will generate fictional stores in response to user prompts. The solution must ensure that the resource uses a customer-managed key to protect data. How should you complete the script? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"The exact script selections cannot be determined from the text-only source; create the Foundry/AI Services resource with a managed identity, then configure its encryption to use the customer-managed Key Vault key.","why":"Customer-managed-key encryption requires the AI resource to have an identity that can access the selected key in Azure Key Vault. The resource's encryption settings must then reference that customer-managed key so the service uses it for data protection. These are the stable architectural requirements even though the omitted script prevents identifying the exact command flags or dropdown values.","whyNot":"Creating the resource with only provider-managed encryption would not satisfy the customer-managed-key requirement. Supplying a key reference without a usable managed identity and key permissions would also fail because the service could not access the key.","takeaway":"For customer-managed keys, pair a managed identity with an encryption configuration that references an accessible Key Vault key.","reviewNote":"The source PDF omits part or all of the exhibit/answer area. Use the original visual source to confirm the exact hotspot selection.","docs":[{"title":"Customer-managed keys for Foundry Tools","url":"https://learn.microsoft.com/en-us/azure/ai-services/encryption/cognitive-services-encryption-keys-portal"}]},{"id":"QA-013","n":13,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":15,"question":"HOTSPOT HOTSPOT You need to create a new resource that will be used to perform sentiment analysis and optical character recognition (OCR). The solution must meet the following requirements: • Use a single key and endpoint to access multiple services. • Consolidate billing for future services that you might use. • Support the use of Azure Vision in Foundry Tools in the future. How should you complete the HTTP request to create the new resource? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Create a multi-service Foundry resource (`kind: AIServices`, normally SKU `S0`) by using the Microsoft.CognitiveServices/accounts REST resource provider.","why":"A multi-service Foundry resource uses the `Microsoft.CognitiveServices/accounts` provider with `kind: AIServices`. It provides a shared endpoint and key for supported services and consolidates their billing under one resource. That design supports sentiment analysis now and Azure Vision later, with `S0` as the normal production SKU, although the missing HTTP template still requires visual confirmation of each blank.","whyNot":"Separate Language and Vision resources would create separate endpoints, keys, and billing, violating the consolidation requirements. A single-service resource kind would also constrain the account to that service instead of allowing future supported capabilities through the same resource.","takeaway":"Choose a multi-service `AIServices` account when one endpoint, one key, and consolidated billing must span multiple Foundry Tools services.","reviewNote":"The source PDF omits part or all of the exhibit/answer area. Use the original visual source to confirm the exact hotspot selection.","docs":[{"title":"Create a Foundry resource","url":"https://learn.microsoft.com/en-us/azure/ai-services/multi-service-resource"}]},{"id":"QA-014","n":14,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":15,"question":"Which web portal should you use to work with assets in a Microsoft Foundry project?","options":[{"key":"A","text":"The Azure portal"},{"key":"B","text":"Microsoft Copilot"},{"key":"C","text":"The Microsoft Foundry portal"}],"correct":["C"],"type":"mcq","answer":"C. The Microsoft Foundry portal.","why":"The Microsoft Foundry portal is the project workspace for working with assets such as models, deployments, agents, connections, evaluations, and data. It presents the authoring and management experiences associated with a Foundry project. Because the question asks specifically where to work with project assets, the Foundry portal is the direct match.","whyNot":"The Azure portal is primarily used to create and administer Azure resources, subscriptions, networking, and access control. Other development tools may call project APIs, but they are not the web portal designed as the central project-asset workspace.","takeaway":"Use the Microsoft Foundry portal to author and manage assets inside a Foundry project.","reviewNote":null,"docs":[{"title":"Microsoft Foundry architecture","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/architecture"}]},{"id":"QA-015","n":15,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":16,"question":"… the following business requirements: Users that interact with Agent1 must have a personalized experience in future interactions, including the ability for Agent1 to retain conversation context and recall relevant information from previous interactions. Agent1 must answer questions only about the products sold by Contoso. You need to configure the model deployment for Agent1 to meet the technical requirements. What should you configure? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Configure a Data Zone Standard deployment for the EU and pin/disable automatic model-version upgrades so the version remains fixed.","why":"A Data Zone Standard deployment can use available standard capacity within the EU data zone while keeping processing within that zone. It provides dynamically allocated pay-as-you-go throughput, unlike a provisioned deployment that reserves capacity. Pinning the model version or disabling automatic upgrades keeps behavior on the selected version, which addresses the fixed-version requirement, though the missing hotspot labels must be checked visually.","whyNot":"Global Standard can route outside the required EU data zone, so it does not meet the stated processing boundary. Provisioned throughput is intended for reserved capacity, and automatic model-version upgrades would undermine the requirement that the version remain fixed.","takeaway":"Use Data Zone Standard for flexible regional-zone processing, and pin the version when automatic upgrades are not allowed.","reviewNote":"The source PDF omits part or all of the exhibit/answer area. Use the original visual source to confirm the exact hotspot selection.","docs":[{"title":"Deployment overview for Microsoft Foundry Models","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/deployments-overview"},{"title":"Azure OpenAI quotas and limits","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/quotas-limits"}]},{"id":"QA-016","n":16,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":19,"question":"You have a Microsoft Foundry project. You need to deploy a model from the model catalog to support real-time inference. The solution must meet the following requirements: • Use key-based authentication. • Support real-time REST API access. • NOT consume the vCPU quota of the virtual machines in the Azure subscription. Which type of deployment should you use?","options":[{"key":"A","text":"serverless API"},{"key":"B","text":"batch"},{"key":"C","text":"self-hosted container"},{"key":"D","text":"standard"}],"correct":["D"],"type":"mcq","answer":"D. Standard.","why":"A Standard deployment is a managed, serverless option for real-time inference through a REST endpoint. It supports key-based authentication and consumes service quota rather than the subscription's virtual-machine vCPU quota. These properties satisfy all three requirements without the customer managing compute infrastructure.","whyNot":"Batch deployment is designed for asynchronous jobs rather than interactive real-time requests. A managed-compute or self-hosted deployment relies on dedicated compute and can consume VM-related capacity, so it conflicts with the vCPU-quota constraint.","takeaway":"Choose Standard deployment for managed real-time REST inference that supports keys without using subscription VM vCPU quota.","reviewNote":null,"docs":[{"title":"Deployment overview for Microsoft Foundry Models","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/deployments-overview"},{"title":"Deployment options for Microsoft Foundry Models (classic)","url":"https://learn.microsoft.com/en-us/azure/ai-foundry/concepts/deployments-overview"}]},{"id":"QA-017","n":17,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":19,"question":"Which deployment type in Microsoft Foundry is best for general use while offering the largest quota?","options":[{"key":"A","text":"Data Zone Batch"},{"key":"B","text":"Global Standard"},{"key":"C","text":"Developer"}],"correct":["B"],"type":"mcq","answer":"B. Global Standard.","why":"Global Standard is the general-purpose, pay-as-you-go deployment type for broad production use. It can route requests across globally available capacity, which gives the service greater flexibility to satisfy demand. That broad capacity pool is why it is associated with the largest quota among the listed general-use choices.","whyNot":"Data Zone Batch is asynchronous and constrained to a data zone, so it is not the best general interactive option. Developer deployment is intended for development and testing rather than the largest production quota, while provisioned options trade flexibility for reserved throughput.","takeaway":"When the exam asks for general use plus the broadest quota, select Global Standard.","reviewNote":null,"docs":[{"title":"Deployment overview for Microsoft Foundry Models","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/deployments-overview"},{"title":"Azure OpenAI quotas and limits","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/quotas-limits"}]},{"id":"QA-018","n":18,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":20,"question":"HOTSPOT HOTSPOT - You have a Microsoft Foundry project that contains an agent. You use a GitHub Actions workflow for CI/CD. You need to configure the workflow to automatically evaluate the agent when a pull request (PR) is created and prevent branches from merging if the evaluation results do NOT meet the defined thresholds. How should you configure the workflow? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Trigger the workflow on `pull_request`, run the Foundry evaluation action with the threshold configuration, and make the evaluation job a required status check so a failed threshold blocks merging.","why":"The `pull_request` event causes the workflow to run when a PR is opened or updated. The Foundry evaluation action must load the evaluation configuration and return a failing job status when a metric misses its threshold. Configuring that job as a required status check makes branch protection prevent the merge until the evaluation passes, though the omitted hotspot requires confirmation of exact YAML fields.","whyNot":"A `push`-only trigger would run too late or on the wrong event for PR gating. Allowing the evaluation step to ignore failures, or failing to mark its job as required, would record poor results without actually blocking the merge.","takeaway":"To gate PRs with evaluation results, trigger on `pull_request`, fail on threshold breaches, and require that check in branch protection.","reviewNote":"The source PDF omits part or all of the exhibit/answer area. Use the original visual source to confirm the exact hotspot selection.","docs":[{"title":"Run an evaluation in GitHub Actions","url":"https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluation-github-action"}]},{"id":"QA-019","n":19,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":20,"question":"You have a Microsoft Foundry project that contains an agent and uses a GitHub repository. The repository contains a YAML file named File1 that defines the evaluation settings of the agent. You need to create a GitHub Actions workflow that runs the evaluation defined in File1 when a pull request (PR) is opened. How should you configure the workflow?","options":[{"key":"A","text":"Set project-endpoint to the endpoint of the project."},{"key":"B","text":"Set evaluation-config to the path of the YAML file."},{"key":"C","text":"Set model-deployment-name to the deployed model."},{"key":"D","text":"Set tenant-id to the Microsoft Entra tenant ID"}],"correct":["B"],"type":"mcq","answer":"B. Set `evaluation-config` to the path of File1.","why":"The `evaluation-config` input tells the GitHub Actions evaluation step which YAML definition to load. Pointing it to File1 therefore applies the datasets, evaluators, and thresholds declared in that file. This is the setting that connects the workflow to the named evaluation configuration.","whyNot":"A project endpoint or model deployment identifies infrastructure used during evaluation but does not select File1. Tenant and authentication values establish identity; they do not tell the action where the evaluation definition is stored.","takeaway":"In a Foundry evaluation workflow, set `evaluation-config` to the path of the YAML evaluation file.","reviewNote":null,"docs":[{"title":"Run an evaluation in GitHub Actions","url":"https://learn.microsoft.com/en-us/azure/foundry/how-to/evaluation-github-action"}]},{"id":"QA-020","n":20,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":21,"question":"HOTSPOT HOTSPOT - You have a Microsoft Foundry project that contains an internal Q&A agent. Users report the following issues when they ask the agent questions: An increase in the following response: “No relevant information found” Periodic HTTP 429 rate limit exceeded errors during peak hours You need to identify whether each issue is caused by model unavailability, resource limits, or inference failures. What should you do? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Classify the increase in “No relevant information found” as an inference/retrieval failure signal, and classify HTTP 429 errors as resource or rate-limit exhaustion.","why":"“No relevant information found” means the run completed far enough to determine that usable grounding context was not available, so it points to the retrieval or inference path. An HTTP 429 response explicitly means the service is throttling requests because a rate or quota limit was reached. The two symptoms therefore map to inference/retrieval failure and resource-limit exhaustion, respectively.","whyNot":"Model unavailability is more commonly indicated by availability or server-side errors, often in the 5xx range, rather than a normal no-results response. Treating 429 as an inference-quality problem would miss its explicit throttling meaning and would not address the capacity pressure.","takeaway":"Interpret no-useful-context responses as retrieval/inference signals, but classify HTTP 429 as quota or rate-limit exhaustion.","reviewNote":null,"docs":[{"title":"Troubleshoot common HTTP errors for Azure OpenAI","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/troubleshoot-errors"},{"title":"RAG evaluators for generative AI","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"}]},{"id":"QA-021","n":21,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":21,"question":"You have a customer support agent built by using the Microsoft Foundry Agent Service. The agent calls an Azure OpenAI model deployment. During load testing, calls intermittently fail and return an HTTP 429 rate limit exceeded error. You need to handle throttling to reduce call failures and improve reliability under load. The solution must remain within the service and model limits. What should you do?","options":[{"key":"A","text":"Create a new thread and retry the calls immediately."},{"key":"B","text":"Reduce the number of registered tools."},{"key":"C","text":"Implement a retry policy that uses exponential backoff and jitter."},{"key":"D","text":"Spit uploaded content into smaller files."}],"correct":["C"],"type":"mcq","answer":"C. Implement retries with exponential backoff and jitter.","why":"An HTTP 429 response indicates temporary throttling, so the client should wait before trying again. Exponential backoff progressively increases the delay when throttling continues, and jitter randomizes retry timing across callers. Together they reduce synchronized retry spikes and improve the chance that later requests run after capacity becomes available.","whyNot":"Immediate or fixed rapid retries can amplify the overload and produce more 429 responses. Reducing tool count or splitting files addresses different constraints and does not change the model deployment's request or token rate limits.","takeaway":"Handle 429 throttling with bounded exponential backoff plus jitter, while staying within documented retry and service limits.","reviewNote":null,"docs":[{"title":"Troubleshoot common HTTP errors for Azure OpenAI","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/troubleshoot-errors"},{"title":"Azure OpenAI quotas and limits","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/quotas-limits"}]},{"id":"QA-022","n":22,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":22,"question":"… Some user uploads fail and generate an HTTP 400 file size exceeded error. You need to mitigate the errors and reduce call failures. The solution must remain within the service and model limits. What should you do to resolve each error? To answer, drag the appropriate actions to the correct errors. Each action may be used once, more than once or not at all. You may need to drag the split bar between panes or scroll to view content. NOTE: Each comet selection is worth one point.","options":[],"correct":[],"type":"review","answer":"For HTTP 429, retry with exponential backoff and jitter; for HTTP 400 file-size-exceeded, split or reduce the uploaded file so each upload is within the service limit.","why":"A 429 error is transient throttling, so delayed retries with exponential backoff and jitter allow the rate-limit window to recover. A 400 file-size-exceeded response is a deterministic validation failure, so the payload itself must change. Splitting or reducing the file ensures that each upload falls within the service's size limit.","whyNot":"Retrying the same oversized file will keep producing HTTP 400 because time does not change its size. Conversely, splitting requests is not the standard response to general 429 throttling when the service expects clients to slow down and retry responsibly.","takeaway":"Retry transient 429 errors with backoff, but fix a 400 size error by reducing or splitting the upload.","reviewNote":null,"docs":[{"title":"Troubleshoot common HTTP errors for Azure OpenAI","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/troubleshoot-errors"}]},{"id":"QA-023","n":23,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":22,"question":"You have a Microsoft Foundry project that uses Azure AI Search to ground an agent in internal documentation. After a recent content update, users report that the agent’s answers have become less accurate. You need to identify whether the retrieved content is negatively influencing the model’s generated responses. Which observability signal should you review?","options":[{"key":"A","text":"indexer status and failure history"},{"key":"B","text":"latency breakdown traces"},{"key":"C","text":"prediction drift metrics"},{"key":"D","text":"groundedness evaluation metrics"}],"correct":["D"],"type":"mcq","answer":"D. Groundedness evaluation metrics.","why":"Groundedness measures whether claims in the generated response are supported by the context retrieved for that response. Reviewing it after a content update shows whether the new retrieved passages still provide evidence for the model's answers or instead lead to unsupported claims. That directly tests the suspected negative influence of grounding content on answer accuracy.","whyNot":"Indexer status can reveal ingestion failures, but a successful indexer does not prove that generated claims are supported by retrieved passages. Latency measures speed, and prediction-drift-style signals do not directly compare the response with its grounding context.","takeaway":"Use groundedness when the question is whether generated claims are supported by the retrieved context.","reviewNote":null,"docs":[{"title":"RAG evaluators for generative AI","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"}]},{"id":"QA-024","n":24,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":23,"question":"You have a Microsoft Foundry project that contains a model deployment. You have an application that calls the deployment by using the Azure OpenAI v1 API and DefaultAzureCredential. The developers at your company receive HTTP 403 errors when they send inference requests, even after running az login. You need to ensure that the developers can perform model inference. The solution must follow the principle of least privilege. Which role-based access control (RBAC) role should you assign to the developers?","options":[{"key":"A","text":"Cognitive Services User"},{"key":"B","text":"Cognitive Services OpenAI User"},{"key":"C","text":"Contributor"},{"key":"D","text":"Cognitive Services Data Reader"}],"correct":["B"],"type":"mcq","answer":"B. Cognitive Services OpenAI User.","why":"`DefaultAzureCredential` obtains a Microsoft Entra token, so the caller needs a data-plane role that permits Azure OpenAI inference. Cognitive Services OpenAI User grants the required ability to invoke model deployments without broad control-plane management rights. It therefore resolves the 403 while following least privilege.","whyNot":"Contributor is a broad resource-management role and does not necessarily grant the required data-plane inference action. Data Reader can inspect data-related information but cannot invoke the model, while Owner would grant far more permission than the developers need.","takeaway":"For keyless Azure OpenAI inference, assign Cognitive Services OpenAI User rather than a broad management role.","reviewNote":null,"docs":[{"title":"Configure keyless authentication with Microsoft Entra ID","url":"https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/configure-entra-id"}]},{"id":"QA-025","n":25,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":24,"question":"… that interact with Agent1 must have a personalized experience in future interactions, including the ability for Agent1 to retain conversation context and recall relevant information from previous interactions. • Agent1 must answer questions only about the products sold by Contoso. You need to ensure that Agent1Dev Team can access Agent1. The solution must meet the security and compliance requirements. How should you complete the Python code? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Assign the `SC_Agent1_Dev` group the least-privileged Foundry project role at the Project1 scope by using the group object ID in the role assignment.","why":"Assigning access to the `SC_Agent1_Dev` security group manages the team as one principal and avoids per-user role assignments. Scoping the assignment to Project1 limits the group's access to the project that contains Agent1. Using the group's object ID ensures the role assignment targets the Microsoft Entra group, while the missing code and choices must be reviewed to confirm the exact SDK method and role label.","whyNot":"Assigning users individually increases administration and can leave stale permissions as team membership changes. A subscription- or resource-group-level assignment would grant access beyond Project1, and a broader role than project use requires would violate least privilege.","takeaway":"Grant a development team access through its Entra group, using the least-privileged project role at the project scope.","reviewNote":"The source PDF omits part or all of the exhibit/answer area. Use the original visual source to confirm the exact hotspot selection.","docs":[{"title":"Microsoft Foundry architecture","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/architecture"},{"title":"Configure keyless authentication with Microsoft Entra ID","url":"https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/configure-entra-id"}]},{"id":"QA-026","n":26,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":27,"question":"HOTSPOT HOTSPOT You have a Microsoft Foundry project that contains an agent. The agent uses a stored access key to retrieve secrets from an Azure key vault, which violates a keyless-credentials requirement. You need to ensure that the agent can retrieve the secrets. The solution must follow the principle of least privilege. What should you configure? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Use a managed identity for the agent/project and grant that identity the Key Vault Secrets User role on KV1 (or the narrowest required vault/secret scope).","why":"A managed identity lets the agent or project authenticate to Key Vault without storing an access key. The Key Vault Secrets User role allows that identity to read secret values needed at runtime. Scoping the assignment to KV1, or to an individual secret when practical, provides the required access while limiting exposure.","whyNot":"Key Vault Administrator grants broad control over secrets, keys, and certificates and is excessive for read-only secret retrieval. Continuing to use an access key violates the keyless requirement, while Reader can view resource metadata but cannot read secret values.","takeaway":"For keyless secret retrieval, use managed identity plus Key Vault Secrets User at the narrowest practical scope.","reviewNote":null,"docs":[{"title":"Set up an Azure Key Vault connection","url":"https://learn.microsoft.com/en-us/azure/foundry/how-to/set-up-key-vault-connection"},{"title":"Agent identity concepts in Microsoft Foundry","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agent-identity"}]},{"id":"QA-027","n":27,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":27,"question":"You have an Azure subscription that contains an Azure App Service app named App1. You provision a Microsoft Foundry Service resource named CSAccount1. You need to configure App1 to access CSAccount1. The solution must minimize administrative effort. What should you use to configure App1?","options":[{"key":"A","text":"the endpoint URI and subscription key"},{"key":"B","text":"the endpoint URI and an OAuth token"},{"key":"C","text":"the endpoint URI and a shared access signature (SAS) token"},{"key":"D","text":"a system assigned managed identity and an X.509 certificate"}],"correct":["A"],"type":"mcq","answer":"A. The endpoint URI and subscription key.","why":"The endpoint URI identifies the Foundry service resource that App1 must call. The subscription key authenticates those calls with minimal additional setup, making this the lowest-administration option in the choices. No identity registration, token acquisition flow, or certificate lifecycle is required.","whyNot":"OAuth or Microsoft Entra authentication is stronger for keyless scenarios but requires identity and RBAC configuration, so it does not minimize initial administrative effort here. SAS tokens and X.509 client certificates are not the standard authentication mechanism for this Foundry service endpoint.","takeaway":"When minimum setup is the explicit priority and keyless access is not required, use the service endpoint and subscription key.","reviewNote":null,"docs":[{"title":"Create a Foundry resource","url":"https://learn.microsoft.com/en-us/azure/ai-services/multi-service-resource"}]},{"id":"QA-028","n":28,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":28,"question":"… Add a new query key. > 2. Change the app to use the new query key. > 3. Delete the compromised query key. ![Original recorded Question 112 answer image](image-70.png) <section class=\"answer-correction\" aria-label=\"Corrected HTML answer for Question 112\"> <p class=\"replica-label\">Corrected HTML answer<\/p> <ol> <li>Add a new query key.<\/li> <li>Change the app to use the new query key.<\/li> <li>Delete the compromised query key.<\/li> <\/ol> <\/section> No multiple-choice options were available for this item in the source.","options":[],"correct":[],"type":"review","answer":"1. Add a new query key. 2. Change the app to use the new query key. 3. Delete the compromised query key.","why":"Creating a new query key first preserves a valid read-only credential while the compromised one is being replaced. Updating the application to use the new key before deletion avoids downtime. Deleting the compromised query key last removes the exposed credential only after the application has safely switched.","whyNot":"Deleting the old key first could interrupt search requests until the application is updated. Regenerating or distributing an admin key would grant unnecessary write and management permissions when the application only needs query access.","takeaway":"Rotate a compromised query key by creating the replacement, switching the app, and deleting the old key in that order.","reviewNote":null,"docs":[{"title":"Connect to Azure AI Search using API keys","url":"https://learn.microsoft.com/en-us/azure/search/search-security-api-keys"}]},{"id":"QA-029","n":29,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":29,"question":"You are developing an application that will use Azure AI Search for internal documents. You need to implement document-level filtering for Azure AI Search. Which three actions should you include in the solution? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point.","options":[{"key":"A","text":"Add allowed groups to each index entry"},{"key":"B","text":"Create one index per group."},{"key":"C","text":"Send access tokens from Microsoft Entra ID, with the search request."},{"key":"D","text":"Retrieve all the groups."},{"key":"E","text":"Retrieve the group memberships of the user"},{"key":"F","text":"Supply the groups as a filter for the search requests"}],"correct":["A","E","F"],"type":"mcq","answer":"A, E, and F: add allowed groups to each index document, retrieve the user’s group memberships, and pass those groups in a search filter.","why":"Document-level security filtering starts by storing the groups allowed to read each document in a filterable field in the index. At query time, the application obtains the caller's group memberships and constructs a filter that matches those groups against the document field. Azure AI Search then returns only documents whose access list intersects the user's groups, which is why actions A, E, and F form the complete pattern.","whyNot":"Creating a separate index for every group duplicates data and creates unnecessary operational overhead. Merely sending a user access token does not apply a custom group filter to ordinary indexed documents unless a supported permission-aware mechanism translates that identity into document access rules.","takeaway":"For Azure AI Search document security, index allowed principals and filter every query with the caller's group memberships.","reviewNote":null,"docs":[{"title":"Security filter pattern for Azure AI Search","url":"https://learn.microsoft.com/en-us/azure/search/search-security-trimming-for-azure-search"}]},{"id":"QA-030","n":30,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":29,"question":"What authentication method is used when connecting the Azure Language MCP server to a Foundry agent?","options":[{"key":"A","text":"OAuth 2.0 authentication with a client certificate and tenant ID."},{"key":"B","text":"Key-based authentication using the Ocp-Apim-Subscription-Key credential."},{"key":"C","text":"Anonymous access that requires no authentication or credentials."}],"correct":["B"],"type":"mcq","answer":"B. Key-based authentication with the `Ocp-Apim-Subscription-Key` credential.","why":"The Azure Language MCP server authenticates requests by using the Azure Language resource key. That key is supplied as the `Ocp-Apim-Subscription-Key` credential so the server can call the Language service. The named header and key-based mechanism therefore match the expected connection configuration.","whyNot":"Anonymous access would leave the Language resource unprotected and is not supported for normal service calls. Client-certificate OAuth is not the described MCP connection pattern, and a bearer token would represent a different authentication configuration.","takeaway":"For the Azure Language MCP server, recognize the resource-key credential named `Ocp-Apim-Subscription-Key`.","reviewNote":null,"docs":[{"title":"Azure Language in Foundry Tools—tools and agents","url":"https://learn.microsoft.com/en-us/azure/ai-services/language-service/concepts/foundry-tools-agents"}]},{"id":"QA-031","n":31,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":30,"question":"What capability of Microsoft Foundry helps mitigate harmful content generation at the Safety System level?","options":[{"key":"A","text":"DALL-E model support"},{"key":"B","text":"Fine-tuning"},{"key":"C","text":"Guardrails"}],"correct":["C"],"type":"mcq","answer":"C. Guardrails.","why":"Guardrails are safety controls applied around the model and agent execution path. They can inspect or constrain inputs, tool calls, tool results, and generated outputs to detect or block harmful content. Because the question asks for mitigation at the Safety System level, guardrails are the direct capability.","whyNot":"Fine-tuning adjusts model behavior from training examples but does not replace runtime safety controls. Prompt instructions can encourage safer behavior, yet they are not a complete enforcement layer and can be bypassed or produce inconsistent outcomes.","takeaway":"Map runtime harmful-content controls at the Safety System layer to guardrails.","reviewNote":null,"docs":[{"title":"Guardrails and controls overview in Microsoft Foundry","url":"https://learn.microsoft.com/en-us/azure/foundry/guardrails/guardrails-overview"}]},{"id":"QA-032","n":32,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":30,"question":"… named DB1 and receive the following results: • Content harm defect rate of Run1: 12% • Content harm defect rate of Run2: 4% • Protected material evaluation of Run1: 6% • Protected material evaluation of Run1: 6% You start a fine-tuning job by using DB1. The job fails during automatic RAI checks for multiple content harm types. You discover that the content filtering configuration is set to high severity. For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"The exact Yes/No sequence cannot be determined because the statements to evaluate are missing from the source.","why":"A medium content-harm threshold generally flags a broader range of severity than a high-only threshold, which can explain a higher defect rate such as 12% versus 4%. Protected-material evaluation is a separate measurement and is not determined by the content-harm severity threshold. However, the actual Yes/No statements are absent, so these facts cannot be mapped to an exact sequence without the original visual.","whyNot":"Inferring a Yes/No order from the percentages alone would invent the missing propositions being judged. It would also be wrong to assume that changing a content-harm severity threshold automatically changes protected-material results, because those evaluators address different risk categories.","takeaway":"Do not derive hotspot Yes/No answers from metrics alone when the statements are missing; review the original exhibit.","reviewNote":"The source PDF omits part or all of the exhibit/answer area. Use the original visual source to confirm the exact hotspot selection.","docs":[{"title":"Risk and safety evaluators for generative AI","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators"},{"title":"Safety evaluation for fine-tuning","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/fine-tuning-safety-evaluation"}]},{"id":"QA-033","n":33,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":31,"question":"You are developing a new sales system that will process user-generated video and text from a public-facing website. You plan to notify users that their data has been processed by the sales system. Which responsible AI principle does this help meet?","options":[{"key":"A","text":"fairness"},{"key":"B","text":"transparency"},{"key":"C","text":"inclusiveness"},{"key":"D","text":"reliability and safety"}],"correct":["B"],"type":"mcq","answer":"B. Transparency.","why":"Transparency requires people to understand when an AI system is involved and how their data is being used. Notifying users that their video and text were processed gives them visibility into the system's operation. That disclosure directly supports informed awareness, which is the core clue for transparency.","whyNot":"Fairness focuses on equitable treatment and outcomes across people or groups. Reliability and safety concern consistent, secure operation, while privacy and security focus on protecting data rather than simply disclosing AI involvement.","takeaway":"When a scenario emphasizes informing users about AI use or data processing, choose transparency.","reviewNote":null,"docs":[{"title":"Responsible AI practices for Azure OpenAI","url":"https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/openai/overview"}]},{"id":"QA-034","n":34,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":31,"question":"Why should you consider creating an AI Impact Assessment when designing a generative AI solution?","options":[{"key":"A","text":"To make a legal case that indemnifies you from responsibility for harms caused by the solution"},{"key":"B","text":"To document the purpose, expected use, and potential harms for the solution"},{"key":"C","text":"To evaluate the cost of cloud services required to implement your solution"}],"correct":["B"],"type":"mcq","answer":"B. To document the purpose, expected use, and potential harms for the solution.","why":"An AI Impact Assessment documents why the solution exists, how it is expected to be used, and who may be affected. It also records foreseeable misuse, potential harms, and the mitigations or oversight needed to manage them. This creates a structured basis for responsible design decisions before and during deployment.","whyNot":"The assessment is not a liability waiver and does not transfer responsibility away from the organization. It is also not primarily a cloud-cost estimate or a substitute for technical testing, although its findings can guide both governance and validation work.","takeaway":"Use an AI Impact Assessment to document intended use, affected stakeholders, foreseeable harms, and planned mitigations.","reviewNote":null,"docs":[{"title":"Responsible AI practices for Azure OpenAI","url":"https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/openai/overview"},{"title":"Manage a responsible generative AI solution","url":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-studio/6-operate-responsibly"}]},{"id":"QA-035","n":35,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":31,"question":"Why should you consider a phased delivery plan for your generative AI solution?","options":[{"key":"A","text":"To enable you to gather feedback and identify issues before releasing the solution"},{"key":"B","text":"To eliminate the need to map, measure, mitigate, and manage potential harms"},{"key":"C","text":"To enable you to charge more for the solution"}],"correct":["A"],"type":"mcq","answer":"A. To gather feedback and identify issues before broader release.","why":"A phased delivery exposes the solution to a limited audience or scope before broad release. The team can observe real behavior, collect feedback, identify unexpected harms or quality problems, and improve controls between phases. This reduces the impact of defects while evidence about the system is still being gathered.","whyNot":"A phased rollout does not eliminate the need for responsible AI assessment, testing, monitoring, or incident response. It also does not guarantee safety automatically; it is a risk-management approach that makes issues easier to discover and contain.","takeaway":"Choose phased delivery when the goal is to learn from limited exposure and fix issues before wider release.","reviewNote":null,"docs":[{"title":"Manage a responsible generative AI solution","url":"https://learn.microsoft.com/en-us/training/modules/responsible-ai-studio/6-operate-responsibly"}]},{"id":"QA-036","n":36,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":32,"question":"… The agents use tool calling to query internal systems. You need to implement responsible AI auditing to meet the following requirements: • Capture all the nested operations across the entire agent run. • Record tool invocation arguments and retuned results as metadata. What should you use for each requirement? To answer, drag the appropriate options to the correct targets Each option may be used once, more than once, or not at all. You may need o dag the split bar between panes or scroll to view content. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Use a trace to capture the complete agent run and its nested spans; use span attributes to record tool arguments and returned results as metadata.","why":"A trace represents the complete end-to-end execution of an agent request. Nested spans record the individual operations within that trace, preserving their order, parent-child relationships, and timing. Span attributes are key-value metadata, so they are the appropriate place to capture tool arguments and returned results for auditing.","whyNot":"A single log message does not naturally represent the hierarchy of nested LLM and tool operations. Metrics aggregate numeric behavior across runs and are useful for monitoring trends, but they do not preserve per-operation arguments and results in an ordered execution record.","takeaway":"Use traces and nested spans for the full agent run, and span attributes for tool inputs and outputs.","reviewNote":null,"docs":[{"title":"Agent tracing overview","url":"https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept"}]},{"id":"QA-037","n":37,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":32,"question":"… You need to publish the agent for a compliance workflow. The solution must meet the following requirements: Each workflow run must include a retrieval step before generating a response. Tool calls must authenticate by using the published agent’s own identity. Tool access must use an identity isolated from other project resources. Tool access must use support audit tracing. What should you do? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Set `tool_choice` to `required`, publish the agent with its own agent identity, and grant that identity only the downstream permissions needed by the tools.","why":"Setting `tool_choice` to `required` ensures that the model performs at least one tool call before completing the response, which enforces the retrieval-step requirement when the relevant tool is configured. Publishing the agent gives it a distinct agent identity rather than reusing the broader project identity. Granting only the downstream permissions needed by the tools keeps access isolated, least-privileged, and attributable in audit traces.","whyNot":"With `tool_choice` set to `auto`, the model may answer directly and skip retrieval. Using the shared project identity would mix this agent's permissions with other project resources, while granting broad roles would weaken isolation and least privilege.","takeaway":"For mandatory retrieval and isolated audited access, require tool use and authorize the published agent's own identity narrowly.","reviewNote":null,"docs":[{"title":"Tool best practices for Microsoft Foundry Agent Service","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/tool-best-practice"},{"title":"Publish your agent as an Agent Application","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/how-to/agent-applications"}]},{"id":"QA-038","n":38,"domain":"Domain 1","domainTitle":"Plan and manage an Azure AI solution","sourcePage":33,"question":"Which of the following is NOT a recommended security practice for AI agents?","options":[{"key":"A","text":"Using role-based access controls"},{"key":"B","text":"Implementing prompt filtering and validation"},{"key":"C","text":"Maintaining comprehensive logging and traceability"},{"key":"D","text":"Allowing agents unrestricted access to all enterprise data"}],"correct":["D"],"type":"mcq","answer":"D. Allowing agents unrestricted access to all enterprise data.","why":"Unrestricted access to enterprise data violates least privilege and exposes far more information than an agent needs for its task. A prompt-injection attack, erroneous tool choice, or compromised integration could then affect or disclose data across the organization. Secure agent design instead scopes identities, resources, and tool permissions to the minimum required set.","whyNot":"Recommended practices include validating tool inputs and outputs, applying guardrails, and tracing agent activity for investigation. Restricting access with dedicated identities and RBAC reduces blast radius; it is the opposite of granting universal data access.","takeaway":"Any option that gives an agent unrestricted enterprise access is a security anti-pattern; choose least-privileged, scoped permissions.","reviewNote":null,"docs":[{"title":"Agent identity concepts in Microsoft Foundry","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/agent-identity"},{"title":"Tool best practices for Microsoft Foundry Agent Service","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/tool-best-practice"}]},{"id":"QA-039","n":39,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":34,"question":"When should you use Retrieval Augmented Generation (RAG) instead of relying on prompt engineering alone?","options":[{"key":"A","text":"When you want the model to respond in a consistent style and format."},{"key":"B","text":"When the model needs access to domain-specific or current data that it wasn’t"},{"key":"C","text":"When you want to reduce the length of prompts sent to the model."}],"correct":["B"],"type":"mcq","answer":"B. Use RAG when the model needs domain-specific, private, or current data that was not in its training data.","why":"RAG retrieves relevant information at request time and places it in the model's context before generation. This gives the model access to private domain data or current facts that were not present in its original training set. The answer can then be grounded in that retrieved evidence without retraining the model.","whyNot":"Prompt engineering can change instructions, formatting, and reasoning guidance, but it cannot make unavailable private or newly updated facts appear in the model's knowledge. Fine-tuning is better for behavior or style consistency and is not an efficient replacement for frequently changing factual content.","takeaway":"Use RAG—not prompting alone—when answers require private, domain-specific, or current information outside model training.","reviewNote":null,"docs":[{"title":"Retrieval augmented generation (RAG) and indexes in Microsoft Foundry","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/retrieval-augmented-generation"}]},{"id":"QA-040","n":40,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":34,"question":"What is the primary advantage of Retrieval Augmented Generation (RAG) over simple AI agents?","options":[{"key":"A","text":"RAG eliminates the need for large language models by relying entirely on document retrieval."},{"key":"B","text":"RAG enables agents to ground responses in current organizational information and"},{"key":"C","text":"RAG automatically retrains the language model whenever organizational documents change."}],"correct":["B"],"type":"mcq","answer":"B. RAG grounds responses in current organizational information and can provide citations/source transparency.","why":"RAG retrieves current organizational content and supplies it to the model as evidence for the response. Because the source passages are known, the application can expose citations or links that show where claims came from. This improves freshness and source transparency compared with an agent relying only on the base model's learned knowledge.","whyNot":"RAG does not eliminate the language model; the model still interprets the retrieved context and generates the answer. It also does not retrain the model whenever documents change, because updates are handled in the external knowledge source or index.","takeaway":"The key advantage of RAG is grounded, updateable answers with source evidence—not retraining or replacing the LLM.","reviewNote":null,"docs":[{"title":"Retrieval augmented generation (RAG) and indexes in Microsoft Foundry","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/retrieval-augmented-generation"}]},{"id":"QA-041","n":41,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":35,"question":"… You have an Ask a question node that stores user responses in a local variable named Var01. You need to create the following Power Fx expressions: An if/else condition expression that ensures that Var01 contains a value A Send message expression that returns the stored user response in uppercase How should you configure the expressions? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"If/Else condition: `Not(IsBlank(Local.Var01))` (equivalently `!IsBlank(Local.Var01)`). Send message: `{Upper(Local.Var01)}`.","why":"Workflow local variables are referenced through the `Local.` scope, so the stored response is `Local.Var01`. `IsBlank` tests whether that value is empty, and wrapping it with `Not` or `!` makes the condition true only when a response exists. `Upper(Local.Var01)` transforms the captured text to uppercase, and braces embed that Power Fx result in the Send message output.","whyNot":"Testing `IsBlank(Local.Var01)` without negation would select the empty-value case rather than confirm that a response was provided. Omitting the `Local.` prefix can reference the wrong scope, while using a display-only text operation would not perform the requested uppercase transformation.","takeaway":"In Foundry workflows, qualify local variables with `Local.`, use `Not(IsBlank(...))` for presence, and `Upper(...)` for uppercase output.","reviewNote":null,"docs":[{"title":"Build a workflow in Microsoft Foundry","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/concepts/workflow"},{"title":"Apply Power Fx in workflows","url":"https://learn.microsoft.com/en-us/training/modules/build-agent-workflows-microsoft-foundry/6-apply-power-fx"}]},{"id":"QA-042","n":42,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":35,"question":"Which type of node in a Foundry workflow is used to invoke an AI agent?","opti
