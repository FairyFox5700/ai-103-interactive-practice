t playground.","why":"The agent playground is the portal experience for exercising an agent interactively. Enabling Voice mode connects that test experience to Voice Live so you can configure and try spoken interaction. This satisfies both the configuration and testing parts of the question without building a separate client first.","whyNot":"The standard text chat mode does not activate the live voice path. Deploying a new model or creating a standalone Speech SDK application adds work and is not the portal's direct Voice Live testing workflow.","takeaway":"In the Foundry portal, turn on Voice mode in the agent playground to configure and test Voice Live.","reviewNote":null,"docs":[{"title":"Quickstart: Voice Live with Foundry Agent Service","url":"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live-agents-quickstart"}]},{"id":"QA-182","n":182,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":102,"question":"How can you stop audio playback when a user interrupts the voice agent?","options":[{"key":"A","text":"You can’t - the user must wait for the agent to finish."},{"key":"B","text":"Handle the ServerEventType.INPUT\\_AUDIO\\_BUFFER\\_SPEECH\\_STARTED event"},{"key":"C","text":"Reset the Voice Live session and clear the conversation history"}],"correct":["B"],"type":"mcq","answer":"B. Handle `ServerEventType.INPUT_AUDIO_BUFFER_SPEECH_STARTED`.","why":"Voice activity detection emits INPUT_AUDIO_BUFFER_SPEECH_STARTED when it detects that the user has begun speaking. The client can treat that event as a barge-in signal and immediately stop the audio currently playing. This creates natural interruption behavior instead of making the user wait for the agent to finish.","whyNot":"Events that report completed audio, generated responses, or speech stopping occur too late to halt playback at the start of an interruption. Clearing playback without listening for a speech-start event would not reliably coordinate the interruption with user input.","takeaway":"Use INPUT_AUDIO_BUFFER_SPEECH_STARTED as the signal to stop agent audio when the user interrupts.","reviewNote":null,"docs":[{"title":"Voice Live API reference 2026-07-15","url":"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/voice-live-api-reference-2026-07-15"},{"title":"ServerEventInputAudioBufferSpeechStarted interface","url":"https://learn.microsoft.com/en-us/javascript/api/@azure/ai-voicelive/servereventinputaudiobufferspeechstarted?view=azure-node-latest"}]},{"id":"QA-183","n":183,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":102,"question":"Which model can you use to generate text from speech?","options":[{"key":"A","text":"gpt-4o-mini"},{"key":"B","text":"gpt-4o-mini-tts"},{"key":"C","text":"gpt-4o-mini-transcribe"}],"correct":["C"],"type":"mcq","answer":"C. `gpt-4o-mini-transcribe`","why":"gpt-4o-mini-transcribe accepts speech audio and produces a text transcription. Its direction is therefore speech-to-text, exactly matching the request to generate text from speech. The model name itself provides the key clue: transcribe means audio recognition.","whyNot":"gpt-4o-mini-tts performs the reverse operation by generating speech from text. A general gpt-4o-mini model is not the dedicated transcription model requested here.","takeaway":"Choose a transcribe model for speech-to-text and a TTS model for text-to-speech.","reviewNote":null,"docs":[{"title":"Foundry Models sold by Azure","url":"https://learn.microsoft.com/en-us/azure/ai-foundry/openai/overview"},{"title":"Choose an Azure speech recognition and generation technology","url":"https://learn.microsoft.com/en-us/azure/architecture/data-guide/ai-services/speech-recognition-generation"}]},{"id":"QA-184","n":184,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":103,"question":"You have an application named App1 that uses Azure Speech in Foundry Tools to transcribe live calls. Transcript segments often contain both English and Spanish. App1 sends each segment to Azure Translator in Foundry Tools to translate to another language. Sometimes, mixed-language segments result in incomplete or incorrect translations. You need to reduce translation errors. The solution must ensure that the entire transcript is translated successfully. What should you do before sending the segments to Translator?","options":[{"key":"A","text":"Use document translation to translate the entire transcript as a single document."},{"key":"B","text":"Split the mixed-language segments into single-language segments and translate"},{"key":"C","text":"Enable automatic language detection for the translation request."},{"key":"D","text":"Specify English as the source language in the translation request for all the segments."}],"correct":["B"],"type":"mcq","answer":"B. Split mixed-language segments into single-language segments and translate each segment separately.","why":"A single input segment that switches languages can make language identification and translation less reliable. Splitting the transcript at language boundaries gives Translator a linguistically consistent input for each call. Translating every single-language segment and then recombining the results improves the chance that the entire mixed-language transcript is covered correctly.","whyNot":"Sending the unchanged mixed-language segment again does not remove the ambiguity that caused the error. Speech recognition settings and output formatting do not solve the Translator input problem once the transcript already contains multiple languages.","takeaway":"Before translating mixed-language text, divide it into single-language segments and translate them separately.","reviewNote":null,"docs":[{"title":"Azure Translator known issues","url":"https://learn.microsoft.com/en-us/azure/ai-services/translator/reference/known-issues"},{"title":"Azure Translator transparency note","url":"https://learn.microsoft.com/en-us/azure/foundry/responsible-ai/translator/transparency-note"}]},{"id":"QA-185","n":185,"domain":"Domain 4","domainTitle":"Text analysis solutions","sourcePage":103,"question":"Which Azure Speech SDK object should you use to specify the language(s) into which you want speech translated?","options":[{"key":"A","text":"SpeechConfig"},{"key":"B","text":"SpeechTranslationConfig"},{"key":"C","text":"AudioConfig"}],"correct":["B"],"type":"mcq","answer":"B. `SpeechTranslationConfig`","why":"SpeechTranslationConfig is the Speech SDK configuration object for speech translation. It records the recognition language and the target language or languages requested for translated output. The translation recognizer then uses this configuration when processing the incoming speech.","whyNot":"SpeechConfig configures ordinary speech recognition or synthesis but does not represent the speech-translation target-language set. AudioConfig specifies the audio source, and a recognizer performs the operation rather than defining its target languages.","takeaway":"Use SpeechTranslationConfig to specify target languages for speech translation.","reviewNote":null,"docs":[{"title":"How to translate speech","url":"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/how-to-translate-speech"},{"title":"Speech translation quickstart","url":"https://learn.microsoft.com/en-us/azure/ai-services/speech-service/get-started-speech-translation"}]},{"id":"QA-186","n":186,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":104,"question":"Which component of an Azure AI Search solution is scheduled to extract and enrich data to populate an index?","options":[{"key":"A","text":"Indexer"},{"key":"B","text":"Projection"},{"key":"C","text":"Query"}],"correct":["A"],"type":"mcq","answer":"A. Indexer","why":"An indexer connects to a supported data source and retrieves content for indexing. It can invoke an attached skillset to enrich the content before mapping the results into an index. Its schedule controls when that extraction and enrichment pipeline runs again.","whyNot":"An index stores searchable fields but does not crawl the source or run on a schedule. A skillset defines enrichment steps, while a data source defines the connection; neither alone drives the scheduled pipeline.","takeaway":"In Azure AI Search, the indexer is the scheduled pipeline driver that extracts, enriches, and populates an index.","reviewNote":null,"docs":[{"title":"Indexers in Azure AI Search","url":"https://learn.microsoft.com/en-us/azure/search/search-indexer-overview"}]},{"id":"QA-187","n":187,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":105,"question":"… must have a personalized experience in future interactions, including the ability for Agent1 to retain conversation context and recall relevant information from previous interactions. Agent1 must answer questions only about the products sold by Contoso. You need to configure an indexing pipeline for Agent1 to retrieve the relevant product information in storage1. The solution must meet the technical requirement. Which two built-in skills should you use? Each correct answer presents part of the solution. NOTE: Each correct selection is worth one point.","options":[{"key":"A","text":"Azure OpenAI Embedding"},{"key":"B","text":"Entity Recognition"},{"key":"C","text":"Text Split"},{"key":"D","text":"Merge"},{"key":"E","text":"Language Detection"},{"key":"F","text":"key phrase extraction"}],"correct":["A","C"],"type":"mcq","answer":"A and C. Azure OpenAI Embedding; Text Split","why":"The Text Split skill divides long product documents into chunks that fit retrieval and embedding workflows. The Azure OpenAI Embedding skill converts those chunks into vectors that capture semantic meaning. Together they create chunk-level vector content that an agent can retrieve even when a question uses different wording.","whyNot":"OCR is useful for extracting text from images, but it does not create semantic vectors from already available text. Entity-recognition, sentiment, or language-detection skills add other annotations and do not provide the required chunking-plus-embedding pipeline.","takeaway":"For integrated vectorization, split documents into chunks and then generate an embedding for each chunk.","reviewNote":null,"docs":[{"title":"Integrated vectorization overview","url":"https://learn.microsoft.com/en-us/azure/search/vector-search-integrated-vectorization"},{"title":"Text Split skill","url":"https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-textsplit"}]},{"id":"QA-188","n":188,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":108,"question":"You have a Microsoft Foundry project that contains an agent. The agent uses Azure AI Search for Retrieval Augmented Generation (RAG). You plan to ingest and index PDF product manuals. You need to build a solution that supports semantic similarity matching. The solution must ensure that the agent retrieves relevant data when user questions use different wording than the product manuals. Which indexing approach should you use?","options":[{"key":"A","text":"vector search"},{"key":"B","text":"semantic ranking"},{"key":"C","text":"suggesters"},{"key":"D","text":"analyzers"}],"correct":["A"],"type":"mcq","answer":"A. vector search","why":"Vector search represents both manual passages and user questions as embeddings. Similar concepts are near one another in vector space even when they use different words, so the search can return semantically relevant content. This directly addresses the wording mismatch between users and the product manuals.","whyNot":"Keyword or full-text search depends more heavily on shared terms and can miss paraphrases. Semantic ranking improves the ordering of text search results, but it does not replace the vector indexing and vector query approach explicitly needed for similarity matching.","takeaway":"Choose vector search when retrieval must match meaning rather than exact wording.","reviewNote":null,"docs":[{"title":"Integrated vectorization overview","url":"https://learn.microsoft.com/en-us/azure/search/vector-search-integrated-vectorization"}]},{"id":"QA-189","n":189,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":108,"question":"You have a Microsoft Foundry agent that grounds responses from an Azure Search index that contains the following: • Searchable text fields for product names and product codes • A vector field that stores embeddings for product descriptions You need to ensure that users can query the index by using the following: • Exact product names or codes • Natural language descriptions of the products What should you configure?","options":[{"key":"A","text":"vector search only"},{"key":"B","text":"hybrid search"},{"key":"C","text":"keyword search only"},{"key":"D","text":"semantic search only"}],"correct":["B"],"type":"mcq","answer":"B. hybrid search","why":"Hybrid search submits a lexical full-text query and a vector query against the same index. The lexical side handles exact product names and codes well, while the vector side matches natural-language descriptions by meaning. Combining their results supports both query styles without forcing users to choose a search mode.","whyNot":"Vector-only search can weaken exact identifier matching, especially for product codes. Full-text-only search handles exact terms but can miss descriptions phrased differently from the indexed text.","takeaway":"Use hybrid search when an index must support both exact terms and semantic natural-language queries.","reviewNote":null,"docs":[{"title":"Hybrid search using vectors and full-text search","url":"https://learn.microsoft.com/en-us/azure/search/hybrid-search-overview"}]},{"id":"QA-190","n":190,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":109,"question":"You have a Microsoft Foundry project that contains an agent. The agent uses Azure AI Search as the retriever. You plan to ingest PDF into an Azure AI Search index to ensure that the agent can ground responses in texts in both documents and embedded images. Users require citations that link to the source files. You need to ensure that during indexing, the images are extracted into a structure that can be used as input for the built-in optical character recognition (OCR) skill. Which indexing approach should you use?","options":[{"key":"A","text":"an indexer to extract image data into a normalized_images collection"},{"key":"B","text":"a Shaper skill to restructure the OCR input"},{"key":"C","text":"a skillset to run the OCR skill directly against the content field of the index"},{"key":"D","text":"the outputFieldMappings parameter to write image data to a searchable field"}],"correct":["A"],"type":"mcq","answer":"A. an indexer configured to extract image data into a normalized_images collection","why":"An Azure AI Search indexer can extract images embedded in PDFs when its image extraction action is enabled. The extracted images are placed in the normalized_images collection, which is the expected input shape for image enrichment skills. The OCR skill can then read text from those images while the pipeline retains source metadata needed for citations.","whyNot":"Sending only the PDF's plain text to OCR omits the embedded image content. A vectorizer creates embeddings but does not extract PDF images into the structure consumed by OCR.","takeaway":"To OCR images inside PDFs, configure the indexer to create normalized_images before running the OCR skill.","reviewNote":null,"docs":[{"title":"Extract text and information from images by using AI enrichment","url":"https://learn.microsoft.com/en-us/azure/search/cognitive-search-concept-image-scenarios"},{"title":"OCR skill","url":"https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-ocr"}]},{"id":"QA-191","n":191,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":109,"question":"You have an Azure AI Search indexer that ingests PDF policy manuals. Client applications must display page-level citations that have bounding polygons for both text and images. You need to add a single built-in multimodal content extraction skill to the Azure AI Search skillset. The solution must meet the following requirements: • Provide text and image location metadata. • Extract tables that span multiple pages. What should you add?","options":[{"key":"A","text":"Document Extraction"},{"key":"B","text":"Azure Content Understanding in Foundry Tools"},{"key":"C","text":"GenAI Prompt"},{"key":"D","text":"Document Layout"}],"correct":["B"],"type":"mcq","answer":"B. Azure Content Understanding in Foundry Tools","why":"Azure Content Understanding performs layout-aware extraction across text, images, tables, and other document elements. It can preserve page and location information used to ground citations to bounding regions. Its document understanding also handles structures such as tables that continue across page boundaries, satisfying both requirements with one multimodal skill.","whyNot":"The OCR skill extracts text from images but does not by itself reconstruct cross-page tables or provide the full multimodal structure requested. Basic text splitting or embedding skills prepare retrieval content but do not perform layout-aware document extraction.","takeaway":"Choose Azure Content Understanding when one enrichment step must preserve multimodal layout, locations, and complex tables.","reviewNote":null,"docs":[{"title":"Azure Content Understanding skill","url":"https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-content-understanding"},{"title":"What is Azure Content Understanding?","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/overview"}]},{"id":"QA-192","n":192,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":110,"question":"You are building an Azure AI Search indexing pipeline named Pipeline1 that ingests invoices stored in Azure Blob Storage. The invoices are stored as scanned images. You need to enable users to search invoice data across the invoice fields. Which built-in skill should you add to the skillset of Pipeline1?","options":[{"key":"A","text":"Text Split"},{"key":"B","text":"Text Translation"},{"key":"C","text":"optical character recognition (OCR)"},{"key":"D","text":"Image Analysis"}],"correct":["C"],"type":"mcq","answer":"C. optical character recognition (OCR)","why":"The invoices are scanned images, so their printed content is pixels rather than searchable text. The OCR skill recognizes text in those images and emits machine-readable content that can be mapped into index fields. Once indexed, users can search the invoice text and extracted values.","whyNot":"Image Analysis describes visual features but is not the primary skill for recovering all printed invoice text. Text Split and embedding skills require text input and cannot recover characters directly from scanned pixels.","takeaway":"Use OCR first when searchable document content exists only inside scanned images.","reviewNote":null,"docs":[{"title":"OCR skill","url":"https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-ocr"}]},{"id":"QA-193","n":193,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":110,"question":"You have an Azure AI Search indexer that ingest PDF policy manuals. Client applications must display page-level citations that have bounding polygons for both text and images. You need to add a single built-in multimodal content extraction skill to the Azure AI Search skillset. The solution must meet the following requirements: • Provide text and image location metadata. • Extract tables that span multiple pages. What should you add?","options":[{"key":"A","text":"Document Layout"},{"key":"B","text":"Document Extraction"},{"key":"C","text":"Azure Content Understanding"},{"key":"D","text":"GenAI Prompt"}],"correct":["C"],"type":"mcq","answer":"C. Azure Content Understanding","why":"Azure Content Understanding analyzes text and visual elements while preserving document layout. It returns grounding and location metadata that supports page-level citations and bounding polygons. It also understands complex document structures such as tables that span multiple pages, so one skill meets the full requirement.","whyNot":"OCR alone recognizes characters but does not supply the complete layout and cross-page table understanding requested. Separate image analysis, text splitting, or embedding skills each address only part of the pipeline and would not be the required single multimodal extraction skill.","takeaway":"For page-grounded multimodal extraction with complex tables, select Azure Content Understanding.","reviewNote":null,"docs":[{"title":"Azure Content Understanding skill","url":"https://learn.microsoft.com/en-us/azure/search/cognitive-search-skill-content-understanding"},{"title":"What is Azure Content Understanding?","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/overview"}]},{"id":"QA-194","n":194,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":111,"question":"HOTSPOT HOTSPOT - You are creating an enrichment pipeline that will use Azure AI Search. The knowledge store contains unstructured JSON data and the text from scanned PDF documents. Which projection type should you use for each data type? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Needs visual review: the hotspot answer area and its selectable options are omitted. Unstructured JSON maps to an object projection, but the exact required selection for the scanned-PDF text cannot be confirmed from the surviving text alone.","why":"An object projection is the matching knowledge-store projection when enriched content must be serialized as unstructured JSON. Knowledge-store projections differ according to whether the target is JSON objects, relational tables, or normalized image files. The surviving source does not include the hotspot choices needed to identify the exact expected projection for the scanned-PDF text, so that part must remain visually unresolved.","whyNot":"A table projection creates rows and columns rather than an unstructured JSON object. A file projection is for normalized binary images, and the missing answer area prevents safely choosing among the remaining labels for the extracted text.","takeaway":"Map JSON to an object projection, but verify the original hotspot before selecting the projection for scanned-PDF text.","reviewNote":"The source PDF omits part or all of the exhibit/answer area. Use the original visual source to confirm the exact hotspot selection.","docs":[{"title":"Projection concepts in Azure AI Search","url":"https://learn.microsoft.com/en-us/azure/search/knowledge-store-projection-overview"}]},{"id":"QA-195","n":195,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":111,"question":"Which service supports built-in AI skills in Azure AI Search?","options":[{"key":"A","text":"Azure Functions"},{"key":"B","text":"Foundry Tools"},{"key":"C","text":"Azure Cosmos DB"}],"correct":["B"],"type":"mcq","answer":"B. Foundry Tools","why":"Azure AI Search skillsets can call built-in AI enrichment capabilities supplied through Foundry Tools. Attaching the appropriate Foundry resource gives the skillset access to supported billable cognitive operations. This is how built-in skills such as language, vision, and embedding enrichment are backed.","whyNot":"Azure Functions is commonly used to host custom Web API skills, not to supply the built-in skill catalog. Azure AI Search runs the enrichment pipeline, but the question asks which service supports the built-in AI capabilities it invokes.","takeaway":"Associate Azure AI Search built-in AI enrichment skills with Foundry Tools.","reviewNote":null,"docs":[{"title":"Attach a Foundry resource to a skillset","url":"https://learn.microsoft.com/en-us/azure/search/cognitive-search-attach-cognitive-services"}]},{"id":"QA-196","n":196,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":111,"question":"Which kind of projection results in a relational data schema for extracted fields?","options":[{"key":"A","text":"File"},{"key":"B","text":"Object"},{"key":"C","text":"Table"}],"correct":["C"],"type":"mcq","answer":"C. Table","why":"A table projection writes selected enrichment fields as rows and columns. That shape supports a relational-style schema for querying structured extracted values. It is the projection type designed for tabular output rather than document-shaped JSON or binary content.","whyNot":"An object projection serializes enriched data as JSON and therefore preserves an object hierarchy rather than a relational table. A file projection stores normalized image files and does not create fields in rows and columns.","takeaway":"Choose a table projection when knowledge-store output must have a relational rows-and-columns schema.","reviewNote":null,"docs":[{"title":"Projection concepts in Azure AI Search","url":"https://learn.microsoft.com/en-us/azure/search/knowledge-store-projection-overview"}]},{"id":"QA-197","n":197,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":112,"question":"… You have an ingestion job that extracts only plain text, causing loss of table structure, headings, and page-number metadata. Users frequently ask questions that require the retrieval of specific table rows across the pages. You need to configure an ingestion job for a Retrieval Augmented Generation (RAG) pipeline that performs optical character recognition (OCR) on scanned PDFs, preserves tables and headings as structure-aware chunks, and stores page-number metadata with each chunk. How should you configure the ingestion job?","options":[{"key":"A","text":"Use advanced data parsing to reingest the documents."},{"key":"B","text":"Use OCR and page-level chunking."},{"key":"C","text":"Use page-level OCR extraction and store each page as a single chunk."},{"key":"D","text":"Use basic parsing and fixed-size chunking."}],"correct":["A"],"type":"mcq","answer":"A. Use advanced data parsing to reingest the documents.","why":"Advanced data parsing interprets document structure instead of reducing every page to an undifferentiated text stream. It can recover scanned text with OCR, preserve headings and tables, and carry page metadata into structure-aware chunks. Reingesting with this mode gives the RAG pipeline chunks that better represent table rows and their source pages.","whyNot":"Basic plain-text or fixed-size parsing can split tables and disconnect content from headings or page locations. Adding embeddings after structure has already been lost cannot reconstruct the missing layout and metadata.","takeaway":"Use advanced parsing when RAG ingestion must preserve OCR text, document structure, tables, and page metadata.","reviewNote":null,"docs":[{"title":"Advanced data parsing for Agentic Retrieval","url":"https://learn.microsoft.com/en-us/azure/azure-arc/edge-rag/advanced-data-parsing"}]},{"id":"QA-198","n":198,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":112,"question":"Which prebuilt analyzer would you use to extract vendor names and item totals from a purchase receipt?","options":[{"key":"A","text":"prebuilt-image"},{"key":"B","text":"prebuilt-invoice"},{"key":"C","text":"prebuilt-receipt"}],"correct":["C"],"type":"mcq","answer":"C. prebuilt-receipt","why":"The prebuilt-receipt analyzer is trained for purchase receipts and returns common merchant, item, tax, and total fields. Vendor or merchant names and item totals are therefore part of its intended schema. Using the domain-specific prebuilt analyzer minimizes custom extraction work.","whyNot":"The prebuilt-invoice analyzer targets invoice fields and layouts rather than retail purchase receipts. The layout analyzer can recover text and tables but does not provide the same receipt-specific field extraction.","takeaway":"Use prebuilt-receipt for structured merchant and total information from purchase receipts.","reviewNote":null,"docs":[{"title":"Content Understanding analyzer reference","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"},{"title":"Content Understanding prebuilt analyzers","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers"}]},{"id":"QA-199","n":199,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":113,"question":"You have a Microsoft Foundry project that contains an agent. The agent ingests scanned PDF vendor invoices that contain tables and embedded QR codes. The agent must preserve the PDF layout in the extracted output to ensure that downstream processing can reference sections and tables. You plan to call Azure Content Understanding in Foundry Tools. You need to extract content and layout elements and detect QR codes without requiring a language model deployment. Which built-in analyzer should you use?","options":[{"key":"A","text":"prebuilt-documentFieldSchema"},{"key":"B","text":"prebuilt-read"},{"key":"C","text":"prebuilt-documentSearch"},{"key":"D","text":"prebuilt-layout"}],"correct":["D"],"type":"mcq","answer":"D. prebuilt-layout","why":"prebuilt-layout combines OCR with detailed extraction of document geometry and structure. It preserves elements such as paragraphs, tables, figures, hyperlinks, and barcode or QR-code information from the PDF. Because it is prebuilt, it meets the extraction requirements without requiring a separate language-model deployment.","whyNot":"A text-only OCR choice would miss the richer layout relationships needed by downstream processing. A field-oriented invoice analyzer focuses on predefined invoice values, while a generative analyzer would add unnecessary model dependency for this layout-and-code-detection task.","takeaway":"Choose prebuilt-layout for OCR plus detailed PDF structure and barcode or QR-code extraction without an LLM deployment.","reviewNote":null,"docs":[{"title":"Content Understanding prebuilt analyzers","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers"}]},{"id":"QA-200","n":200,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":113,"question":"… The invoices have varied layouts and include multipage tables. You have a pipeline that uses optical character recognition (OCR) and extracts totals and invoice numbers. The results are often incorrect because the document structure is ignored. You need to implement a solution that provides OCR, layout analysis, and template-generalizing field extraction. The solution must NOT require training a custom model. The solution must minimize administrative effort. What should you include in the solution?","options":[{"key":"A","text":"Azure Language in Foundry Tools"},{"key":"B","text":"Azure Content Understanding in Foundry Tools"},{"key":"C","text":"an Azure Machine Learning model"}],"correct":["B"],"type":"mcq","answer":"B. Azure Content Understanding in Foundry Tools","why":"Azure Content Understanding combines OCR with layout-aware interpretation of tables, sections, and other document structures. Its schema-driven extraction can identify values such as totals and invoice numbers across varied templates. Because the capability is managed and can start without training a custom model, it minimizes administration while addressing the errors caused by structure-blind OCR.","whyNot":"OCR alone returns text but does not understand the invoice layout that relates labels, values, and tables. A custom-trained document model could work, but it violates the requirement to avoid custom training and adds administration.","takeaway":"Use Content Understanding when varied documents need OCR, layout reasoning, and structured field extraction without custom-model training.","reviewNote":null,"docs":[{"title":"What is Azure Content Understanding?","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/overview"},{"title":"Content Understanding analyzer reference","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"}]},{"id":"QA-201","n":201,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":114,"question":"… Business Requirements - Contoso identifies the following business requirements: Users that interact with Agent1 must have a personalized experience in future interactions, including the ability for Agent1 to retain conversation context and recall relevant information from previous interactions. Agent1 must answer questions only about the products sold by Contoso. You need to recommend an invoice review solution that resolves the issue reported by the finance department. What should you include in the recommendation?","options":[{"key":"A","text":"chat completions"},{"key":"B","text":"Azure Document Intelligence in Foundry Tools"},{"key":"C","text":"Azure Content Understanding in Foundry Tools"},{"key":"D","text":"Image Analysis"}],"correct":["C"],"type":"mcq","answer":"C. Azure Content Understanding in Foundry Tools","why":"The invoice scenario contains varied layouts, tables, logos, and text, so the solution must understand more than plain characters. Azure Content Understanding jointly analyzes visual and textual structure and can return normalized structured fields. That makes it suitable for a finance review workflow that must handle heterogeneous invoice documents.","whyNot":"A chat model alone does not provide a managed, layout-grounded document extraction pipeline. OCR or image analysis alone captures only part of the content and does not reliably unify tables, layout, and business fields across invoice formats.","takeaway":"For multimodal invoice review across varied layouts, choose Azure Content Understanding.","reviewNote":null,"docs":[{"title":"What is Azure Content Understanding?","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/overview"}]},{"id":"QA-202","n":202,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":117,"question":"You have a Microsoft Foundry project named Project1. Project1 contains an application that processes PDF vendor invoices. You need to configure Azure Document Intelligence in Foundry Tools to generate a Markdown output that preserves the sections and table structure of the PDFs. The solution must minimize development effort. What should you do?","options":[{"key":"A","text":"Configure output=figures when you analyze the PDF."},{"key":"B","text":"Configure content=markdown when you analyze the document."},{"key":"C","text":"Increase the confidence threshold."},{"key":"D","text":"Set the output_content_format=ContentFormat.MARKDOWN value."}],"correct":["D"],"type":"mcq","answer":"D. Set output_content_format=ContentFormat.MARKDOWN.","why":"The Document Intelligence layout analysis request accepts output_content_format to control the representation of analyzed content. Setting it to ContentFormat.MARKDOWN asks the service to produce Markdown rather than plain text. Markdown retains useful semantic structure such as headings, sections, and tables with minimal custom conversion code.","whyNot":"Requesting plain text would discard much of the document structure the application needs. Manually rebuilding Markdown from raw spans or table cells adds development effort and duplicates functionality provided by the output format setting.","takeaway":"Request structure-preserving Markdown from Document Intelligence by setting output_content_format=ContentFormat.MARKDOWN.","reviewNote":null,"docs":[{"title":"Document layout analysis","url":"https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/prebuilt/layout?view=doc-intel-4.0.0"},{"title":"Document Intelligence supported Markdown elements","url":"https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/concept/markdown-elements?view=doc-intel-4.0.0"}]},{"id":"QA-203","n":203,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":117,"question":"You need to extract text and table structure from a set of documents that have varying formats. You don't need to identify specific labeled fields. Which Document Intelligence model should you use?","options":[{"key":"A","text":"The read model."},{"key":"B","text":"The layout model."},{"key":"C","text":"The invoice model."}],"correct":["B"],"type":"mcq","answer":"B. The layout model.","why":"The layout model performs OCR and extracts structural elements such as paragraphs, headings, selection marks, and tables. It works across documents with different visual formats because it does not depend on a fixed business-field schema. That matches a requirement to recover text and table structure without identifying named fields.","whyNot":"Prebuilt invoice or receipt models target specific labeled business fields that the question says are unnecessary. A custom extraction model would require defining or labeling fields and therefore adds work without serving the stated goal.","takeaway":"Use the layout model for general text and structure extraction when no specific labeled fields are required.","reviewNote":null,"docs":[{"title":"Document layout analysis","url":"https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/prebuilt/layout?view=doc-intel-4.0.0"}]},{"id":"QA-204","n":204,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":117,"question":"You're building a custom model in Azure Document Intelligence. What training artifacts are required when training with the REST API?","options":[{"key":"A","text":"Only the sample form documents in a blob container."},{"key":"B","text":"Sample forms along with ocr.json, labels.json, and fields.json files in a blob container."},{"key":"C","text":"A minimum of 100 labeled forms and a trained classifier."}],"correct":["B"],"type":"mcq","answer":"B. Sample forms along with .ocr.json, .labels.json, and fields.json files in a blob container.","why":"REST-based labeled custom-model training needs representative source forms in Blob Storage. Each labeled document is accompanied by OCR output and label metadata, while fields.json defines the dataset's field schema. Together these artifacts provide both the document content and the labels the training service needs.","whyNot":"Sample documents alone do not tell the service which spans map to the target fields in a labeled build. A single schema file without per-document OCR and label artifacts likewise lacks the training examples needed to learn extraction behavior.","takeaway":"For labeled REST training, supply sample forms plus .ocr.json, .labels.json, and fields.json artifacts.","reviewNote":null,"docs":[{"title":"Build and train a custom Document Intelligence model","url":"https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/how-to-guides/build-a-custom-model?view=doc-intel-4.0.0"}]},{"id":"QA-205","n":205,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":117,"question":"A company processes both invoices and receipts. They want a single endpoint that routes each document to the correct extraction model. What should they use?","options":[{"key":"A","text":"A custom neural model."},{"key":"B","text":"A prebuilt read model."},{"key":"C","text":"A composed model or a custom classifier paired with extraction models."}],"correct":["C"],"type":"mcq","answer":"C. A composed model or a custom classifier paired with extraction models.","why":"A composed model presents multiple extraction models through one model ID and selects the best matching member for an incoming document. This supports a single endpoint for invoices and receipts while preserving specialized extraction behavior for each type. A custom classifier paired with extraction models is the equivalent explicit routing pattern when classification and extraction are managed separately.","whyNot":"Using only the invoice model will not correctly handle receipts, and using only the receipt model will not correctly handle invoices. A layout model extracts generic structure but does not route each document to the appropriate domain-specific field schema.","takeaway":"Use a composed model, or a classifier plus extraction models, to route multiple document types behind one entry point.","reviewNote":null,"docs":[{"title":"Custom classification model","url":"https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/concept-custom-classifier"},{"title":"Document Intelligence model overview","url":"https://learn.microsoft.com/en-us/azure/ai-services/document-intelligence/model-overview?view=doc-intel-4.0.0"}]},{"id":"QA-206","n":206,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":118,"question":"… You plan to ingest the processed content into an index for Retrieval Augmented Generation (RAG) and store extracted fields for downstream automation. Stakeholders must be able to verify where each extracted field value came from in the original PDF and route low-reliability extractions for manual review. You need to ensure that the Content Understanding document analyzer output includes a per-field confidence score and source grounding to locations within the source document. What should you do?","options":[{"key":"A","text":"Set enableSegment to true."},{"key":"B","text":"Provide labeled samples."},{"key":"C","text":"Enable estimateFieldSourceAndConfidence."},{"key":"D","text":"Configure the analyzer to use generative extraction for all fields."}],"correct":["C"],"type":"mcq","answer":"C. Enable estimateFieldSourceAndConfidence.","why":"estimateFieldSourceAndConfidence asks the analyzer to estimate both confidence and the source region for each extracted field. Confidence enables the application to compare results with a review threshold. Source grounding lets reviewers verify the value against its location in the original PDF, satisfying the traceability requirement.","whyNot":"Returning extracted values without this option does not guarantee the per-field confidence and grounding details needed for review. Output formatting options such as Markdown affect representation but do not enable confidence estimation or source attribution.","takeaway":"Enable estimateFieldSourceAndConfidence when extracted fields need review thresholds and source grounding.","reviewNote":null,"docs":[{"title":"Document analysis with confidence and grounding","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/document/analyzer-improvement"},{"title":"Content Understanding analyzer reference","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"}]},{"id":"QA-207","n":207,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":118,"question":"You have a Microsoft Foundry project that contains an agent. The agent uses Azure Content Understanding in Foundry Too to process vendor onboarding packets. The packs include digital PDFs that contain tables and hyperlinks. The extracted content is indexed for search and provided to a downstream agent in the Markdown format. You need to generate a Markdown output that has a layout and a semantic structure optimized for Retrieval Augmented Generation (RAG) workflows. Which built-in analyzer should you use?","options":[{"key":"A","text":"prebuilt-documentFieldSchema"},{"key":"B","text":"prebuilt-documentSearch"},{"key":"C","text":"prebuilt-read"},{"key":"D","text":"prebuilt-layout"}],"correct":["B"],"type":"mcq","answer":"B. prebuilt-documentSearch","why":"prebuilt-documentSearch is designed to prepare documents for retrieval and RAG. It extracts semantic structure such as paragraphs, tables, figures, and links, then produces chunked Markdown that is convenient to embed and index. That RAG-oriented output directly fits the downstream search and agent-grounding workflow.","whyNot":"prebuilt-layout provides detailed document layout but is not the analyzer specifically optimized to produce search-ready RAG chunks. Domain analyzers such as prebuilt-invoice focus on fixed business fields rather than general document-search content.","takeaway":"Choose prebuilt-documentSearch when Content Understanding output should be chunked Markdown optimized for RAG.","reviewNote":null,"docs":[{"title":"Content Understanding prebuilt analyzers","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/prebuilt-analyzers"},{"title":"Content Understanding analyzer reference","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"}]},{"id":"QA-208","n":208,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":119,"question":"You have a Microsoft Foundry project that contains an agent. You need to process mixed-format documents that contain scanned text, tables, and multicolumn layouts. The extracted content must preserve the document structure and be converted into the Markdown format for downstream reasoning. What should you configure first?","options":[{"key":"A","text":"an Azure Language in Foundry Tools text analysis model deployment"},{"key":"B","text":"a generative chat completion request"},{"key":"C","text":"an Azure OpenAI Responses API call that uses a multimodal model"},{"key":"D","text":"an Azure Content Understanding in Foundry Tools analyzer"}],"correct":["D"],"type":"mcq","answer":"D. an Azure Content Understanding in Foundry Tools analyzer","why":"A Content Understanding analyzer defines how the service processes the mixed document content and what structured output it should produce. It can combine OCR with layout analysis for scanned text, tables, and multicolumn pages. Configuring the analyzer first establishes the structure-preserving extraction needed before the content can be emitted as Markdown for reasoning.","whyNot":"Creating an index or embeddings first would operate on incomplete or structure-blind content. Plain OCR can recognize text but does not by itself preserve the table and multicolumn organization required by the scenario.","takeaway":"Start mixed-format, structure-preserving extraction by configuring a Content Understanding analyzer.","reviewNote":null,"docs":[{"title":"Content Understanding analyzer reference","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"},{"title":"What is Azure Content Understanding?","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/overview"}]},{"id":"QA-209","n":209,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":119,"question":"… Each invoice contains printed fine items and has a table-based layout. Extracted results are stored as structured JSON and used as grounding data for an agent in a Retrieval Augmented Generation (RAG) solution. You need to create a single analyzer that meets the following requirements: Extracts the invoice number, invoice date, vendor name, and total amount across varying templates Returns confidence scores so that results with confidence below 0.80 can be routed for supervisor review What should you use?","options":[{"key":"A","text":"a Foundry agent that has groundedness guardrails enabled to extract invoice fields and"},{"key":"B","text":"a custom Azure Content Understanding in Foundry Tools analyzer that defines the"},{"key":"C","text":"the Azure Content Understanding in Foundry Tools prebuilt-layout analyzer"},{"key":"D","text":"the Azure Content Understanding in Foundry Tools prebuilt-documentSearch analyzer and"}],"correct":["B"],"type":"mcq","answer":"B. a custom Azure Content Understanding analyzer that defines the required fields and returns confidence scores for routing","why":"A custom Content Understanding analyzer can define a schema for invoice number, date, vendor name, and total amount. The analyzer applies that field contract across invoices with different templates while returning structured JSON. Confidence output lets the application compare each result with 0.80 and route low-confidence cases to a supervisor.","whyNot":"A generic layout analyzer preserves document structure but does not define the exact business fields required for this workflow. A template-specific or manually trained single-layout approach is a poor fit for varying invoice formats and the requested single analyzer.","takeaway":"Use a custom Content Understanding schema plus confidence scores for cross-template field extraction and review routing.","reviewNote":null,"docs":[{"title":"Create a custom Content Understanding analyzer","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/tutorial/create-custom-analyzer"},{"title":"Document analysis with confidence and grounding","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/document/analyzer-improvement"}]},{"id":"QA-210","n":210,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":119,"question":"What should you define for the information you want to extract from content?","options":[{"key":"A","text":"A schema."},{"key":"B","text":"An index."},{"key":"C","text":"A cluster."}],"correct":["A"],"type":"mcq","answer":"A. A schema.","why":"A schema declares the fields an analyzer should extract and the type or structure of each field. It therefore acts as the extraction contract between the content and the analyzer output. Defining the schema tells Content Understanding exactly what information the application expects.","whyNot":"An index stores and retrieves results after extraction but does not define what the analyzer should find. A prompt or output format may influence processing or presentation, but neither replaces the formal field definition supplied by the schema.","takeaway":"In Content Understanding, define the desired extracted information as a schema.","reviewNote":null,"docs":[{"title":"Content Understanding analyzer reference","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/concepts/analyzer-reference"},{"title":"Create a custom Content Understanding analyzer","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/tutorial/create-custom-analyzer"}]},{"id":"QA-211","n":211,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":120,"question":"What configuration values are needed to use the Azure Content Understanding API?","options":[{"key":"A","text":"The name of the resource group where the Azure service is deployed."},{"key":"B","text":"The Azure subscription ID and tenant ID."},{"key":"C","text":"The endpoint and key for the Foundry resource."}],"correct":["C"],"type":"mcq","answer":"C. The endpoint and key for the Foundry resource.","why":"The endpoint identifies the Foundry resource that hosts the Content Understanding API. The resource key authenticates the request to that endpoint. Together they provide the address and credential needed by the basic key-authenticated API configuration.","whyNot":"A model deployment name or analyzer name selects processing behavior but does not replace the resource endpoint and credential. A storage SAS URL is only relevant when granting access to stored content and is not the core API configuration pair asked for here.","takeaway":"Configure Content Understanding API access with the Foundry resource endpoint and key.","reviewNote":null,"docs":[{"title":"Quickstart: Use Azure Content Understanding","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/quickstart/use-rest-api"}]},{"id":"QA-212","n":212,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":120,"question":"What must be specified when calling the *analyze* method to extract fields from content?","options":[{"key":"A","text":"The name of the Foundry resource."},{"key":"B","text":"The name of the analyzer."},{"key":"C","text":"The Operation-Location returned when the analyzer was created."}],"correct":["B"],"type":"mcq","answer":"B. The name of the analyzer.","why":"The analyze operation must know which analyzer definition should process the submitted content. The analyzer name or ID is therefore included when initiating the request, selecting either a prebuilt or custom analyzer. The service then starts the corresponding asynchronous analysis job.","whyNot":"Operation-Location is returned after the request begins and is used to poll for the result, so it cannot select the analyzer at submission time. The resource endpoint and key establish access but do not identify which extraction schema or analyzer should run.","takeaway":"When calling analyze, specify the analyzer name or ID that defines the extraction behavior.","reviewNote":null,"docs":[{"title":"Quickstart: Use Azure Content Understanding","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/quickstart/use-rest-api"}]},{"id":"QA-213","n":213,"domain":"Domain 5","domainTitle":"Information extraction solutions","sourcePage":120,"question":"How are the extracted fields returned?","options":[{"key":"A","text":"As type-specific values."},{"key":"B","text":"As a list of strings."},{"key":"C","text":"As a single blob."}],"correct":["A"],"type":"mcq","answer":"A. As type-specific values.","why":"Each extracted field carries a declared data type and a value represented in the corresponding typed form. A string, number, date, object, or array can therefore be consumed without flattening every result into text. Typed values preserve the schema's meaning and make downstream validation and automation easier.","whyNot":"A single untyped string list would lose distinctions among dates, numbers, nested objects, and arrays. A binary blob or Markdown document can represent content, but neither is the field-level typed result structure described by the analyzer output.","takeaway":"Content Understanding returns extracted fields as schema-aligned, type-specific values.","reviewNote":null,"docs":[{"title":"Quickstart: Use Azure Content Understanding","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/quickstart/use-rest-api"},{"title":"Create a custom Content Understanding analyzer","url":"https://learn.microsoft.com/en-us/azure/ai-services/content-understanding/tutorial/create-custom-analyzer"}]}];
const KEY='ai103-practice-v2';
const defaults={current:'QA-001',domain:'all',mode:'all',search:'',theme:'light',answers:{},results:{},revealed:{},selfScores:{},flagged:{}};
let state={...defaults,...JSON.parse(localStorage.getItem(KEY)||'{}')};
let selection=[];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function currentPool(){let s=state.search.trim().toLowerCase();return QUESTIONS.filter(q=>{if(state.domain!=='all'&&q.domain!==state.domain)return false;if(s&&!(`${q.id} ${q.question} ${q.domainTitle}`.toLowerCase().includes(s)))return false;if(state.mode==='unanswered'&&(state.results[q.id]||state.selfScores[q.id]))return false;if(state.mode==='incorrect'&&state.results[q.id]!==false)return false;if(state.mode==='flagged'&&!state.flagged[q.id])return false;if(state.mode==='visual'&&q.type!=='review')return false;return true})}
function current(){return QUESTIONS.find(q=>q.id===state.current)||currentPool()[0]}
function setCurrent(id){state.current=id;selection=[...(state.answers[id]||[])];save();render();if(innerWidth<821)$('#sidebar').classList.remove('open')}
function stats(){let vals=Object.values(state.results),attempted=vals.length+Object.keys(state.selfScores).length,correct=vals.filter(Boolean).length+Object.values(state.selfScores).filter(x=>x==='knew').length;$('#attemptedStat').textContent=attempted;$('#correctStat').textContent=correct;$('#accuracyStat').textContent=attempted?Math.round(correct/attempted*100)+'%':'—'}
function renderDomains(){let html=`<button class="domain-btn ${state.domain==='all'?'active':''}" data-domain="all">All domains<small>213 questions</small></button>`;for(let i=1;i<=5;i++){let d='Domain '+i,c=QUESTIONS.filter(q=>q.domain===d).length;html+=`<button class="domain-btn ${state.domain===d?'active':''}" data-domain="${d}">${d}<small>${c} questions</small></button>`}$('#domains').innerHTML=html;$$('.domain-btn').forEach(b=>b.onclick=()=>{state.domain=b.dataset.domain;let p=currentPool();if(p.length)state.current=p[0].id;save();render()})}
function renderMap(pool){$('#map').innerHTML=pool.map(q=>`<button class="qdot ${q.id===state.current?'current':''} ${state.results[q.id]===true?'correct':state.results[q.id]===false?'wrong':''} ${state.flagged[q.id]?'flagged':''}" data-id="${q.id}" title="${q.id}">${q.n}</button>`).join('');$$('.qdot').forEach(b=>b.onclick=()=>setCurrent(b.dataset.id))}
function toggleChoice(key,multi,checked){if(checked)return;if(multi){selection=selection.includes(key)?selection.filter(x=>x!==key):[...selection,key]}else selection=[key];renderQuestionOnly()}
function docsHTML(q){if(!q.docs.length)return'';return`<div class="docs"><h3>Official Microsoft documentation</h3>${q.docs.map(d=>`<a href="${esc(d.url)}" target="_blank" rel="noopener">${esc(d.title)} ↗</a>`).join('')}</div>`}
function feedbackHTML(q){let result=state.results[q.id],checked=result!==undefined;return checked?`<div class="result-line ${result?'good':'bad'}">${result?'✓ Correct':'✕ Not quite'} <span>— ${esc(q.answer)}</span></div><div class="explain-grid"><div class="explain"><h3>Why this is correct</h3><p>${esc(q.why)}</p></div><div class="explain"><h3>Why the alternatives do not fit</h3><p>${esc(q.whyNot)}</p></div></div><div class="takeaway"><h3>Exam takeaway</h3><p>${esc(q.takeaway)}</p></div>${q.reviewNote?`<div class="review-note"><strong>Visual review:</strong> ${esc(q.reviewNote)}</div>`:''}${docsHTML(q)}`:''}
function reviewHTML(q){let rev=!!state.revealed[q.id],score=state.selfScores[q.id];return`<div class="review-panel"><p>This item depends on an omitted exhibit, drag-and-drop area, or corrected service behavior. Reveal the supported answer, then self-score it.</p><button class="primary" id="revealBtn">${rev?'Answer revealed':'Reveal answer'}</button><div class="answer-reveal ${rev?'show':''}"><strong>${esc(q.answer)}</strong><p>${esc(q.why)}</p><div class="takeaway"><h3>Exam takeaway</h3><p>${esc(q.takeaway)}</p></div>${q.reviewNote?`<div class="review-note">${esc(q.reviewNote)}</div>`:''}${docsHTML(q)}</div><div class="self-score ${rev?'show':''}"><button class="self-btn" data-score="knew">${score==='knew'?'✓ ':''}I knew this</button><button class="self-btn" data-score="review">${score==='review'?'✓ ':''}Review again</button></div></div>`}
function renderQuestionOnly(){let q=current(),pool=currentPool();if(!q||!pool.length)return render();let checked=state.results[q.id]!==undefined;$('#question').textContent=q.question;$('#qid').textContent=q.id;$('#sourcePage').textContent=`Original guide page ${q.sourcePage}`;$('#flagBtn').classList.toggle('active',!!state.flagged[q.id]);$('#flagBtn').textContent=state.flagged[q.id]?'★ Flagged':'☆ Flag';$('#flagBtn').setAttribute('aria-pressed',!!state.flagged[q.id]);
 if(q.type==='mcq'){let multi=q.correct.length>1;$('#instruction').textContent=checked?'Answer checked':multi?`Select ${q.correct.length} answers`:'Select one answer';$('#shortcut').innerHTML=checked?'Use <span class="kbd">→</span> for next':`Keys <span class="kbd">1–${q.options.length}</span> choose · <span class="kbd">Enter</span> check`;$('#answerArea').innerHTML=`<div class="choices">${q.options.map(o=>{let sel=selection.includes(o.key),cls=checked?(q.correct.includes(o.key)?'correct':sel?'wrong':''):sel?'selected':'';return`<button class="choice ${cls}" data-key="${o.key}" ${checked?'disabled':''} aria-pressed="${sel}"><span class="letter">${o.key}</span><span>${esc(o.text)}</span></button>`}).join('')}</div>`;$$('.choice').forEach(b=>b.onclick=()=>toggleChoice(b.dataset.key,multi,checked));$('#feedback').innerHTML=feedbackHTML(q);$('#feedback').classList.toggle('show',checked);$('#checkBtn').hidden=false;$('#checkBtn').disabled=!selection.length||checked;$('#checkBtn').textContent=checked?'Checked':'Check answer'}else{$('#instruction').textContent='Exhibit / review item';$('#shortcut').innerHTML='Reveal, then self-score';$('#answerArea').innerHTML=reviewHTML(q);$('#feedback').classList.remove('show');$('#feedback').innerHTML='';$('#checkBtn').hidden=true;$('#revealBtn').onclick=()=>{state.revealed[q.id]=true;save();renderQuestionOnly()};$$('.self-btn').forEach(b=>b.onclick=()=>{state.selfScores[q.id]=b.dataset.score;save();render()})}}
function render(){document.documentElement.dataset.theme=state.theme;$('#mode').value=state.mode;$('#search').value=state.search;let pool=currentPool();let q=current();if(pool.length&&(!q||!pool.some(x=>x.id===q.id))){state.current=pool[0].id;q=pool[0];selection=[...(state.answers[q.id]||[])]}$('#quizCard').hidden=!pool.length;$('#empty').hidden=!!pool.length;renderDomains();renderMap(pool);stats();if(!pool.length){$('#position').textContent='No questions';$('#poolCount').textContent='0 in current set';$('#progressBar').style.width='0';return}let idx=pool.findIndex(x=>x.id===q.id);$('#crumb').innerHTML=`<strong>${esc(q.domain)}</strong><span class="crumb-detail"> · ${esc(q.domainTitle)}</span>`;$('#position').textContent=`Question ${idx+1} of ${pool.length}`;$('#poolCount').textContent=`${pool.length} in current set`;$('#progressBar').style.width=((idx+1)/pool.length*100)+'%';$('#prevBtn').disabled=idx<=0;$('#nextBtn').disabled=idx>=pool.length-1;renderQuestionOnly()}
$('#checkBtn').onclick=()=>{let q=current();if(!q||!selection.length)return;let a=[...selection].sort().join(','),c=[...q.correct].sort().join(',');state.answers[q.id]=[...selection];state.results[q.id]=a===c;save();render()};
$('#prevBtn').onclick=()=>{let p=currentPool(),i=p.findIndex(q=>q.id===state.current);if(i>0)setCurrent(p[i-1].id)};$('#nextBtn').onclick=()=>{let p=currentPool(),i=p.findIndex(q=>q.id===state.current);if(i<p.length-1)setCurrent(p[i+1].id)};
$('#flagBtn').onclick=()=>{let q=current();state.flagged[q.id]=!state.flagged[q.id];save();render()};$('#mode').onchange=e=>{state.mode=e.target.value;let p=currentPool();if(p.length)state.current=p[0].id;save();render()};let timer;$('#search').oninput=e=>{clearTimeout(timer);timer=setTimeout(()=>{state.search=e.target.value;let p=currentPool();if(p.length)state.current=p[0].id;save();render()},120)};
$('#themeBtn').onclick=()=>{state.theme=state.theme==='light'?'dark':'light';save();render()};$('#randomBtn').onclick=()=>{let p=currentPool();if(p.length)setCurrent(p[Math.floor(Math.random()*p.length)].id)};$('#menuBtn').onclick=()=>$('#sidebar').classList.toggle('open');
document.addEventListener('keydown',e=>{if(/INPUT|SELECT/.test(document.activeElement.tagName))return;let q=current();if(!q)return;if(/^[1-6]$/.test(e.key)&&q.type==='mcq'){let o=q.options[+e.key-1];if(o)toggleChoice(o.key,q.correct.length>1,state.results[q.id]!==undefined)}else if(e.key==='Enter'&&!$('#checkBtn').hidden&&!$('#checkBtn').disabled)$('#checkBtn').click();else if(e.key==='ArrowRight')$('#nextBtn').click();else if(e.key==='ArrowLeft')$('#prevBtn').click()});
selection=[...(state.answers[state.current]||[])];render();
</script></body></html>
