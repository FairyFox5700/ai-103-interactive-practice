"}]},{"id":"QA-089","n":89,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":55,"question":"What is the primary role of the Azure Language MCP server?","options":[{"key":"A","text":"To train and fine-tune custom language models for use by AI agents."},{"key":"B","text":"To expose Azure Language text analysis capabilities as MCP tools for agents."},{"key":"C","text":"To deploy and manage large language models in an Azure subscription."}],"correct":["B"],"type":"mcq","answer":"B. To expose Azure Language text-analysis capabilities as MCP tools for agents.","why":"The Azure Language MCP server acts as a protocol adapter between agents and Azure Language capabilities. It publishes operations such as language detection, named entity recognition, and PII processing as discoverable MCP tools. An MCP-capable agent can inspect those descriptions and invoke the appropriate text-analysis operation. The clue is that the requirement concerns agent access to language analysis, not training or hosting a language model.","whyNot":"The server does not replace the agent's generative model or store the agent's conversation history. It also is not a general document database; its role is to expose Azure Language operations through MCP.","takeaway":"Use the Azure Language MCP server to make Azure Language text-analysis features discoverable and callable by agents.","reviewNote":null,"docs":[{"title":"Understand the Azure Language MCP server","url":"https://learn.microsoft.com/en-us/training/modules/develop-text-analysis-agent-language-mcp/02-understand-language-mcp"}]},{"id":"QA-090","n":90,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":56,"question":"How does an agent determine which Azure Language MCP tool to call when processing a user's prompt?","options":[{"key":"A","text":"The developer writes routing logic to direct each prompt to a specific tool."},{"key":"B","text":"The agent matches the prompt to tool descriptions received from the MCP server."},{"key":"C","text":"The MCP server analyzes the prompt and automatically routes it to a tool."}],"correct":["B"],"type":"mcq","answer":"B. The agent matches the prompt to tool descriptions received from the MCP server.","why":"An MCP server advertises each available tool with metadata that includes its name, description, and input schema. The agent compares the user's intent with those descriptions when deciding which tool can satisfy the request. A prompt about identifying entities, for example, aligns with the entity-recognition tool description. This is model-driven tool selection after discovery rather than a separate hard-coded route for every prompt.","whyNot":"Application-side routing rules are not required for each request when the model has usable tool descriptions. The agent does not choose based only on tool names or call every discovered tool, because descriptions and schemas provide the semantic match.","takeaway":"In MCP tool use, clear tool descriptions guide the agent's choice for each user prompt.","reviewNote":null,"docs":[{"title":"Understand the Azure Language MCP server","url":"https://learn.microsoft.com/en-us/training/modules/develop-text-analysis-agent-language-mcp/02-understand-language-mcp"},{"title":"Using MCP tools with agents","url":"https://learn.microsoft.com/en-us/agent-framework/agents/tools/local-mcp-tools"}]},{"id":"QA-091","n":91,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":56,"question":"What Azure resource does the Foundry portal automatically create when you publish an agent to Microsoft Teams?","options":[{"key":"A","text":"Azure Functions"},{"key":"B","text":"Azure Bot Service"},{"key":"C","text":"Azure Cosmos DB"},{"key":"D","text":"Azure Logic Apps"}],"correct":["B"],"type":"mcq","answer":"B. Azure Bot Service","why":"Publishing a Foundry agent to Microsoft Teams requires a channel-facing service that can receive Teams messages and route them to the agent. The Foundry publishing flow provisions Azure Bot Service for that channel integration. Azure Bot Service supplies the messaging bridge while the agent remains the component that reasons and uses tools. The clue is specifically publication to Teams, not merely deployment of a model endpoint.","whyNot":"An Azure OpenAI resource hosts model deployments but does not by itself provide the Teams bot channel. Application Insights supplies telemetry, and Azure AI Search supplies retrieval; neither performs message routing between Teams and the agent.","takeaway":"Publishing a Foundry agent to Teams automatically introduces Azure Bot Service as the channel bridge.","reviewNote":null,"docs":[{"title":"Understand Foundry agent publishing options","url":"https://learn.microsoft.com/en-us/training/modules/integrate-foundry-agent-with-m365/2-understand-publishing-options"},{"title":"Publish an agent from Foundry portal to Teams","url":"https://learn.microsoft.com/en-us/training/modules/integrate-foundry-agent-with-m365/3-publish-agent-foundry-portal"}]},{"id":"QA-092","n":92,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":56,"question":"What happens to tool permissions when you publish an agent from Foundry to Teams?","options":[{"key":"A","text":"Permissions are automatically transferred to the published agent"},{"key":"B","text":"Tools are disabled after publishing"},{"key":"C","text":"The published agent gets a new identity and needs permissions reassigned"},{"key":"D","text":"Permissions only work in organization scope"}],"correct":["C"],"type":"mcq","answer":"C. The published agent gets a new identity and needs permissions reassigned.","why":"Publishing creates an Agent Application with an identity distinct from the identity used during development. Azure permissions are assigned to a security principal, so permissions held by the project or developer identity do not automatically follow the new principal. The published agent must therefore receive the required downstream roles for its tools. This preserves least privilege by granting only the production identity the access it needs.","whyNot":"Tool permissions are not copied automatically merely because the agent definition is published. Reusing developer credentials would undermine identity isolation, and changing tool instructions cannot grant Azure authorization.","takeaway":"After publishing, treat the agent as a new identity and reassign its required tool permissions.","reviewNote":null,"docs":[{"title":"Understand Foundry agent publishing options","url":"https://learn.microsoft.com/en-us/training/modules/integrate-foundry-agent-with-m365/2-understand-publishing-options"}]},{"id":"QA-093","n":93,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":57,"question":"You have a Microsoft Foundry project that contains three agents as shown in the following table.","options":[{"key":"A","text":"a workflow"},{"key":"B","text":"threads and runs without a workflow"},{"key":"C","text":"a multi-agent group chat session"},{"key":"D","text":"separate agent runs coordinated in the application code"}],"correct":["A"],"type":"mcq","answer":"A. A workflow","why":"A Foundry workflow coordinates multiple agents through an explicit execution graph. It can define the order of agent calls, conditional branches, and shared values between steps. Those capabilities fit a scenario with three agents that must cooperate predictably while minimizing custom orchestration code. The workflow becomes the coordination layer rather than forcing each agent to manage the others.","whyNot":"A single agent or tool call does not express deterministic sequencing and branching across three separate agents. Manual application orchestration could work, but it requires more custom coordination code than the managed workflow choice.","takeaway":"Use a workflow when several agents need predictable sequencing, branching, and shared state.","reviewNote":null,"docs":[{"title":"Build a workflow in Microsoft Foundry","url":"https://learn.microsoft.com/en-us/azure/ai-foundry/agents/concepts/workflow"}]},{"id":"QA-094","n":94,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":57,"question":"What's the first step in the Microsoft Agent Framework's unified orchestration workflow?","options":[{"key":"A","text":"Select and create an orchestration pattern"},{"key":"B","text":"Define your agents and describe their capabilities"},{"key":"C","text":"Start a runtime to manage execution"}],"correct":["B"],"type":"mcq","answer":"B. Define your agents and describe their capabilities.","why":"Orchestration can only route work effectively after the participating agents and their responsibilities are known. Defining each agent and describing its capabilities gives the orchestration layer the roles it will sequence, route to, or coordinate. This foundation applies before selecting detailed transitions or running the group. The phrase 'first step' therefore points to agent and capability definition.","whyNot":"Starting a conversation or configuring handoffs before defining the agents leaves no well-specified participants to orchestrate. Monitoring and evaluation occur after an executable orchestration has been assembled, not before its agents are described.","takeaway":"Begin multi-agent orchestration by defining the agents and clearly describing what each can do.","reviewNote":null,"docs":[{"title":"Group Chat orchestration","url":"https://learn.microsoft.com/en-us/agent-framework/workflows/orchestrations/group-chat"},{"title":"Sequential orchestration","url":"https://learn.microsoft.com/en-us/agent-framework/workflows/orchestrations/sequential"}]},{"id":"QA-095","n":95,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":57,"question":"For brainstorming and collaborative problem solving among multiple agents, which orchestration pattern is most suitable?","options":[{"key":"A","text":"Group Chat"},{"key":"B","text":"Magentic"},{"key":"C","text":"Sequential"}],"correct":["A"],"type":"mcq","answer":"A. Group Chat","why":"Group Chat orchestration lets multiple agents contribute to the same evolving discussion. Agents can propose ideas, critique prior contributions, and refine a shared result over several turns. That collaborative exchange matches brainstorming and open-ended problem solving. The pattern is selected because the participants build on one another rather than simply passing a task down a fixed chain.","whyNot":"Sequential orchestration is better for a predetermined pipeline where each agent performs a fixed stage. Handoff transfers control to a selected specialist, while concurrent orchestration emphasizes parallel independent work rather than an iterative shared discussion.","takeaway":"Recognize brainstorming and iterative peer collaboration as Group Chat orchestration.","reviewNote":null,"docs":[{"title":"Group Chat orchestration","url":"https://learn.microsoft.com/en-us/agent-framework/workflows/orchestrations/group-chat"}]},{"id":"QA-096","n":96,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":58,"question":"Which pattern dynamically transfers control between agents based on context or rules?","options":[{"key":"A","text":"Handoff"},{"key":"B","text":"Concurrent"},{"key":"C","text":"Sequential"}],"correct":["A"],"type":"mcq","answer":"A. Handoff","why":"Handoff orchestration allows the active agent to transfer control to another agent during execution. The destination can be chosen from the conversation context, an agent's specialization, or configured routing rules. This makes the route dynamic rather than fixed in advance. The clue is the explicit transfer of control based on context or rules.","whyNot":"Sequential orchestration follows a predetermined order and does not dynamically choose the next owner. Group Chat keeps several agents in a shared discussion, while concurrent orchestration launches work in parallel rather than transferring ownership.","takeaway":"Choose Handoff when context or routing rules determine which agent takes control next.","reviewNote":null,"docs":[{"title":"Handoff orchestration","url":"https://learn.microsoft.com/en-us/agent-framework/workflows/orchestrations/handoff"}]},{"id":"QA-097","n":97,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":58,"question":"What is the primary role of an A2A server?","options":[{"key":"A","text":"It executes business logic for the agent directly."},{"key":"B","text":"It routes requests between clients and connected agents."},{"key":"C","text":"It stores static agent responses for reuse."}],"correct":["B"],"type":"mcq","answer":"B. It routes requests between clients and connected agents.","why":"An A2A server exposes connected agents through standardized agent-to-agent interfaces. Clients send requests to that server, which directs the interaction to the appropriate hosted agent and returns messages, task updates, or events. This routing role separates protocol handling from the agent's own reasoning. The scenario asks about the server boundary, so request routing is its primary role.","whyNot":"The A2A server is not the component that supplies the model's training data or performs the agent's business reasoning. Tool execution may occur inside the connected agent, but the server's defining responsibility is standardized communication and routing.","takeaway":"Think of an A2A server as the standardized communication and routing front end for agents.","reviewNote":null,"docs":[{"title":"Host agents with A2A","url":"https://learn.microsoft.com/en-us/agent-framework/hosting/self-hosting/a2a/server"}]},{"id":"QA-098","n":98,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":58,"question":"What does the Agent Executor do in an A2A agent?","options":[{"key":"A","text":"Manages network connections between clients and servers."},{"key":"B","text":"Processes incoming requests and generates responses or events."},{"key":"C","text":"Provides a GUI for monitoring agent activity."}],"correct":["B"],"type":"mcq","answer":"B. It processes incoming requests and generates responses or events.","why":"The Agent Executor is the adapter that receives an A2A request and turns it into work for the underlying agent. It manages the execution path and publishes the resulting response, status changes, artifacts, or events back through A2A. That makes it the active request-processing component inside the hosted A2A agent. The clue is the need to process incoming requests rather than merely describe the agent.","whyNot":"An agent card provides discovery metadata but does not execute a request. The A2A server handles the protocol endpoint and routing, while the executor performs the agent-specific processing behind that endpoint.","takeaway":"The Agent Executor runs incoming A2A work and emits the resulting responses and events.","reviewNote":null,"docs":[{"title":"Host agents with A2A","url":"https://learn.microsoft.com/en-us/agent-framework/hosting/self-hosting/a2a/server"}]},{"id":"QA-099","n":99,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":58,"question":"What is an agent card used for in A2A?","options":[{"key":"A","text":"It stores the agent’s API key for authentication."},{"key":"B","text":"It provides metadata about the agent, such as its capabilities and available"},{"key":"C","text":"It visualizes the agent’s workflow in a GUI dashboard."}],"correct":["B"],"type":"mcq","answer":"B. It provides metadata about the agent, such as its capabilities and available functions.","why":"An agent card is the discovery document for an A2A agent. It tells clients what the agent is, where it can be reached, and which capabilities or skills it offers. A client can inspect that metadata before deciding whether and how to interact with the agent. The card describes the service; it does not perform the service.","whyNot":"The Agent Executor processes requests, whereas the agent card only advertises metadata. Conversation state and tool outputs belong to runtime interactions and are not the card's primary purpose.","takeaway":"Use an A2A agent card for discovery metadata such as endpoint, capabilities, and skills.","reviewNote":null,"docs":[{"title":"Host agents with A2A","url":"https://learn.microsoft.com/en-us/agent-framework/hosting/self-hosting/a2a/server"}]},{"id":"QA-100","n":100,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":59,"question":"HOTSPOT HOTSPOT - You have a Microsoft Foundry project that contains an agent named PaymentAgent. PaymentAgent includes a function tool that issues customer refunds by using an external API. You are creating a workflow in YAML. You need to ensure that the workflow pauses for human approval and continues with the refund step only after approval is granted. How should you complete the workflow definition? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Add a human-in-the-loop approval step before the refund action, then branch so the refund tool runs only when approval is granted.","why":"A refund changes external state and can have financial consequences, so the workflow must stop before invoking the refund tool. A human-in-the-loop approval step creates that pause and records an explicit decision. Conditional flow then sends approved requests to the refund action and prevents unapproved requests from reaching it. This directly satisfies both the approval and continuation requirements.","whyNot":"A simple sequential step would execute the refund without a decision gate. Asking the agent to mention approval in its instructions is not an enforceable workflow control, and retry logic addresses failures rather than authorization.","takeaway":"Gate high-impact tool calls with a human approval step and branch execution on the approval result.","reviewNote":"The source PDF omits part or all of the exhibit/answer area. Use the original visual source to confirm the exact hotspot selection.","docs":[{"title":"Build a workflow in Microsoft Foundry","url":"https://learn.microsoft.com/en-us/azure/ai-foundry/agents/concepts/workflow"},{"title":"Sequential orchestration","url":"https://learn.microsoft.com/en-us/agent-framework/workflows/orchestrations/sequential"}]},{"id":"QA-101","n":101,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":59,"question":"… PolicyWriter generates daft updates for customer polices, and RiskReviewer reviews the drafts. In the visual builder, you need to create a workflow that meets the following requirements: • Finalizes low-risk updates without manual intervention • Ensures predictable execution across the agents • Requires user approval for highs updates What should you configure? To answer, select the appropriate options in the answer area. NOTE: Each comet selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Use a sequential/deterministic workflow: PolicyWriter -> RiskReviewer -> condition on risk; finalize low-risk items automatically and use an approval question for high-risk items.","why":"A sequential workflow gives PolicyWriter and RiskReviewer a predictable order of execution. The review result can feed a condition that separates low-risk from high-risk updates. Low-risk items can continue to finalization automatically, while high-risk items enter a human approval step. This combines deterministic agent coordination with selective human oversight.","whyNot":"Group Chat would make collaboration more open-ended and less predictable than the stated requirement. Requiring approval for every item would add unnecessary intervention for low-risk updates, while omitting the conditional gate would allow high-risk changes to proceed automatically.","takeaway":"Use deterministic sequencing plus a risk-based condition so only high-risk work requires approval.","reviewNote":"The source PDF omits part or all of the exhibit/answer area. Use the original visual source to confirm the exact hotspot selection.","docs":[{"title":"Build a workflow in Microsoft Foundry","url":"https://learn.microsoft.com/en-us/azure/ai-foundry/agents/concepts/workflow"},{"title":"Sequential orchestration","url":"https://learn.microsoft.com/en-us/agent-framework/workflows/orchestrations/sequential"}]},{"id":"QA-102","n":102,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":60,"question":"… After a recent update, users report the following issues: Some answers are unsupported by retrieved documents. A small number of responses are flagged for policy violations. You need to evaluate each issue. Which observability signals should you use for each issue? To answer, drag the appropriate observability signals to the correct issues. Each observability signal may be used once, more than once, or not at all. You may need to drag the spit bar between panes or scroll to view content. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Unsupported answers -> Groundedness; policy violations -> Risk and safety metrics.","why":"Groundedness checks whether claims in an answer are supported by the retrieved context. It therefore maps directly to reports of answers that are unsupported by the retrieved documents. Risk and safety metrics evaluate harmful, prohibited, or policy-violating content, so they map to the second issue. Each signal measures the failure type named in the scenario rather than general service health.","whyNot":"Relevance asks whether an answer addresses the query, not whether every claim is supported by evidence. Latency, token usage, and availability metrics describe performance or consumption and do not diagnose either unsupported claims or content-policy violations.","takeaway":"Map unsupported claims to Groundedness and policy violations to Risk and safety metrics.","reviewNote":null,"docs":[{"title":"RAG evaluators","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"},{"title":"Risk and safety evaluators","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/risk-safety-evaluators"}]},{"id":"QA-103","n":103,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":60,"question":"You have a Microsoft Foundry project that contains a customer support agent. The agent calls an internal knowledge API tool before generating responses. Users report the following issues: Some requests take more than 15 seconds to complete. Some responses are incorrect, even when the knowledge API returns the expected data. You need to inspect individual agent runs to view the ordered sequence of large language model (LLM) calls, tool invocations, and timing information. Which observability capability should you use?","options":[{"key":"A","text":"token usage"},{"key":"B","text":"monitoring"},{"key":"C","text":"safety metrics"},{"key":"D","text":"tracing"}],"correct":["D"],"type":"mcq","answer":"D. Tracing","why":"Tracing records an individual run as an ordered hierarchy of spans. Those spans can show model calls, tool invocations, their inputs and outputs, exceptions, and the time spent in each operation. That view lets an investigator see whether the 15-second delay occurs in the model or the knowledge API and whether correct tool data was transformed incorrectly later. The need to inspect one run's sequence and timing is the key tracing clue.","whyNot":"Aggregate dashboards can reveal overall latency or error rates but not the ordered details of one problematic run. Evaluation metrics score output quality, while token usage measures consumption rather than the call sequence and tool timing.","takeaway":"Use tracing when diagnosis requires the ordered model and tool steps of a specific agent run.","reviewNote":null,"docs":[{"title":"Agent tracing overview","url":"https://learn.microsoft.com/en-us/azure/foundry/observability/concepts/trace-agent-concept"}]},{"id":"QA-104","n":104,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":61,"question":"You have a Microsoft Foundry project that contains an agent named Agent1. Agent runs successful, but Foundry Control Plane does NOT display values for error rates, runs, and token usage, and the Traces tab is empty. You need to ensure that Found Control Plane displays the appropriate values for Agent1. What should you do?","options":[{"key":"A","text":"Update Agent1 to a new version."},{"key":"B","text":"Restart Agent from Foundry Control Plan"},{"key":"C","text":"Assign to a Log Analytics workspace to Agent1."},{"key":"D","text":"Enable Application Insights for Agent1."}],"correct":["D"],"type":"mcq","answer":"D. Enable Application Insights for Agent1.","why":"Foundry monitoring depends on telemetry exported to an Application Insights resource. Enabling Application Insights supplies the backend for run counts, error rates, token metrics, and trace data displayed by the control plane. Successful agent execution alone does not populate those views if telemetry is not connected. The simultaneous absence of dashboard values and traces therefore indicates missing observability configuration.","whyNot":"Changing the model deployment or agent instructions would not create the missing telemetry pipeline. Azure AI Search and Content Safety serve retrieval and moderation purposes, not storage of Foundry monitoring signals.","takeaway":"When Foundry monitoring and traces are empty, connect or enable Application Insights for the agent project.","reviewNote":null,"docs":[{"title":"Set up tracing in Microsoft Foundry","url":"https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-setup"},{"title":"Monitor agents with the Agent Monitoring Dashboard","url":"https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard"}]},{"id":"QA-105","n":105,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":62,"question":"… Business Requirements - Contoso identifies the following business requirements: Users that interact with Agent1 must have a personalized experience in future interactions, including the ability for Agent1 to retain conversation context and recall relevant information from previous interactions. Agent1 must answer questions only about the products sold by Contoso. You need to configure Agent1 to answer customer questions about only the Contoso products. The solution must meet the business requirements. What should you do?","options":[{"key":"A","text":"Modify the system message instructions."},{"key":"B","text":"Add few-shot examples."},{"key":"C","text":"Apply top-p sampling."},{"key":"D","text":"Increase the value of the temperature parameter."}],"correct":["A"],"type":"mcq","answer":"A. Modify the system message instructions.","why":"The system message defines the agent’s allowed scope and can instruct it to answer only questions about Contoso products. This is the highest-priority behavioral control among the listed choices and directly implements the business boundary.","whyNot":"Few-shot examples demonstrate patterns but do not reliably establish a hard topic boundary. Top-p and temperature change sampling behavior and variability; they do not restrict the subject matter the agent may answer.","takeaway":"Use the system message to define an agent’s role, permitted scope, and response boundaries.","reviewNote":null,"docs":[{"title":"Build a workflow in Microsoft Foundry","url":"https://learn.microsoft.com/en-us/azure/ai-foundry/agents/concepts/workflow"}]},{"id":"QA-106","n":106,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":65,"question":"… You have a Python service that sends API requests to the model. The service is integrated with an automated validation system that compares generated outputs against approved response patterns. Stakeholders report that small wording differences are causing validation mismatches. You need to update the request parameters to improve output stability. The solution must maximize reasoning quality. How should you complete the Python code? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Set `temperature=0` and reasoning effort/`output_config.effort` to `high`.","why":"Temperature controls sampling variability, so setting it to zero makes repeated outputs more stable for automated comparison. High reasoning effort allocates the strongest available reasoning behavior among the stated choices. Together, those settings address both clues: reduce small wording variations and maximize reasoning quality. One setting targets reproducibility, while the other targets depth of reasoning.","whyNot":"Increasing temperature would introduce more variation and worsen exact-pattern validation. Lower reasoning effort could reduce cost or latency, but it conflicts with the explicit requirement to maximize reasoning quality; increasing an output length limit also does not make wording deterministic.","takeaway":"For stable outputs with maximum reasoning quality, use temperature 0 and high reasoning effort.","reviewNote":null,"docs":[{"title":"Create a thread and run","url":"https://learn.microsoft.com/en-us/azure/foundry/reference/rest/threads-create-thread-and-run"},{"title":"Azure OpenAI reasoning models","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/reasoning"}]},{"id":"QA-107","n":107,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":65,"question":"… After you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen. You have a Microsoft Foundry project that contains an agent. The agent generates summaries from retrieved policy documents. Users report that some responses omit required regulatory clauses, even when the clauses are present in the retrieved content. You need to improve response completeness. Solution: You increase the value of the temperature parameter. Does this meet the goal?","options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"correct":["B"],"type":"mcq","answer":"B. No","why":"Temperature changes how randomly the model samples possible next tokens. Raising it can make wording and content selection more variable, but it does not test whether mandatory clauses are present. The problem is completeness against explicit requirements, so a corrective validation or reflection step is needed. Increasing temperature therefore does not meet the goal.","whyNot":"A lower temperature could improve consistency but still would not guarantee clause coverage. A completeness evaluator followed by retry or reflection is a better category of solution because it checks the actual missing-content condition.","takeaway":"Do not use higher temperature to fix missing required content; validate completeness and regenerate instead.","reviewNote":null,"docs":[{"title":"Create a thread and run","url":"https://learn.microsoft.com/en-us/azure/foundry/reference/rest/threads-create-thread-and-run"},{"title":"RAG evaluators","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"}]},{"id":"QA-108","n":108,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":66,"question":"You have a Microsoft Foundry project that contains a customer support agent built on a deployed chat model. The agent responses are validated by using an automated testing system that compares generated answers to stored expected outputs. Identical prompts must return consistent response to prevent automated test failures. You need to reduce response variability, without modifying the prompt or reducing factual accuracy. What should you do for the model?","options":[{"key":"A","text":"Increase the max_tokens parameter."},{"key":"B","text":"Remove stop sequences from the requests."},{"key":"C","text":"Decrease the temperature parameter."},{"key":"D","text":"Increase the temperature parameter."}],"correct":["C"],"type":"mcq","answer":"C. Decrease the temperature parameter.","why":"Temperature governs the diversity of token sampling during generation. Decreasing it concentrates probability on the most likely continuations, making repeated responses to the same prompt more consistent. That directly reduces false mismatches in tests that compare outputs with stored expectations. It does so without changing the prompt or intentionally discarding factual source data.","whyNot":"Increasing temperature creates more varied wording and would worsen the test instability. Raising token limits addresses truncation, and adding retrieval changes the available knowledge; neither directly controls response variability for identical prompts.","takeaway":"Lower temperature when identical prompts need more deterministic, repeatable responses.","reviewNote":null,"docs":[{"title":"Create a thread and run","url":"https://learn.microsoft.com/en-us/azure/foundry/reference/rest/threads-create-thread-and-run"}]},{"id":"QA-109","n":109,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":66,"question":"You are developing prompts for a Micosoft Foundry project that classifies incoming support tickets by category. You need to improve accuracy by showing the model how correct classifications look, without retaining the model or storing knowledge permanently. Which prompt engineering approach should you use?","options":[{"key":"A","text":"Retrieval Augmented Generation (RAG)"},{"key":"B","text":"zero-shot learning"},{"key":"C","text":"chain of thought"},{"key":"D","text":"few-shot learning"}],"correct":["D"],"type":"mcq","answer":"D. Few-shot learning","why":"Few-shot learning places several representative input-and-correct-output examples inside the prompt. The model uses those examples as an in-context pattern for classifying new support tickets. No model weights are updated, and the examples do not become permanent model knowledge. Those characteristics exactly match the requirement to demonstrate correct classifications without retraining.","whyNot":"Fine-tuning changes model behavior through a training process and is more persistent than requested. Zero-shot prompting provides instructions without examples, while RAG retrieves factual context rather than primarily demonstrating a classification format.","takeaway":"Use few-shot prompting when examples should teach the desired pattern only within the current prompt context.","reviewNote":null,"docs":[{"title":"Prompt engineering techniques","url":"https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/prompt-engineering"}]},{"id":"QA-110","n":110,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":66,"question":"What is the primary purpose of a system message in a prompt?","options":[{"key":"A","text":"To define the model’s role, behavior, and output constraints."},{"key":"B","text":"To provide training data that permanently changes the model."},{"key":"C","text":"To retrieve data from an external data source."}],"correct":["A"],"type":"mcq","answer":"A. Define the model's role, behavior, and output constraints.","why":"A system message establishes the highest-level operating instructions supplied to the model. It can define the assistant's role, permitted behavior, tone, safety boundaries, and expected output structure. Those instructions frame how later user messages should be handled across the conversation. The question asks for this broad behavioral control rather than task data or examples.","whyNot":"A user message normally supplies the immediate request, not the durable role and policy frame. Few-shot examples demonstrate patterns, and retrieved context supplies facts; neither replaces the system message's instruction-setting purpose.","takeaway":"Use the system message to set the model's role, behavioral boundaries, and output constraints.","reviewNote":null,"docs":[{"title":"System message design for Azure OpenAI","url":"https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/advanced-prompt-engineering"}]},{"id":"QA-111","n":111,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":67,"question":"What does the temperature parameter control in a language model?","options":[{"key":"A","text":"The maximum number of tokens the model can generate."},{"key":"B","text":"The randomness and creativity of the model’s responses."},{"key":"C","text":"The speed at which the model processes requests."}],"correct":["B"],"type":"mcq","answer":"B. The randomness and creativity of the model's responses.","why":"Temperature adjusts how sharply or broadly the model samples from likely next tokens. Lower values favor the highest-probability choices and usually produce more focused, repeatable text. Higher values allow less likely choices more often, increasing variation and perceived creativity. It controls randomness, not the amount of knowledge stored in the model.","whyNot":"Maximum token settings control output length, and reasoning effort controls how much reasoning work a supported model performs. Neither is the sampling-randomness control described by temperature.","takeaway":"Temperature is the sampling knob: lower for consistency, higher for variety.","reviewNote":null,"docs":[{"title":"Create a thread and run","url":"https://learn.microsoft.com/en-us/azure/foundry/reference/rest/threads-create-thread-and-run"}]},{"id":"QA-112","n":112,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":67,"question":"What does fine-tuning optimize in a language model?","options":[{"key":"A","text":"The factual accuracy of responses by connecting to external data."},{"key":"B","text":"The consistency of the model’s behavior, style, and output format."},{"key":"C","text":"The number of tokens the model can process in a single request."}],"correct":["B"],"type":"mcq","answer":"B. The consistency of the model's behavior, style, and output format.","why":"Fine-tuning trains a base model on curated examples of the desired behavior. Repeated examples can make tone, structure, formatting, and task responses more consistent without restating every pattern in each prompt. This makes it suitable when the main requirement is stable behavior or style. It is not the preferred mechanism for injecting frequently changing facts.","whyNot":"RAG is better for current or private knowledge because documents can be updated without retraining. Prompt engineering supplies per-request guidance, while temperature only changes sampling variability and does not teach a persistent style.","takeaway":"Use fine-tuning to stabilize learned behavior, style, format, or task patterns—not to maintain live knowledge.","reviewNote":null,"docs":[{"title":"Customize a large language model","url":"https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/customizing-llms"}]},{"id":"QA-113","n":113,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":67,"question":"You're building a chat application that needs to answer questions using your company's product catalog while maintaining a specific brand voice. Which combination of strategies is most appropriate?","options":[{"key":"A","text":"Prompt engineering only, with detailed system messages."},{"key":"B","text":"RAG for the product catalog data, fine-tuning for the brand voice, and prompt"},{"key":"C","text":"Fine-tuning only, with the product catalog included in the training data."}],"correct":["B"],"type":"mcq","answer":"B. RAG for catalog data, fine-tuning for brand voice, and prompt engineering for conversation-specific instructions.","why":"The product catalog is private and can change, so RAG retrieves current catalog facts at request time. Fine-tuning can teach a stable brand voice from representative examples without using it as a product database. Prompt engineering supplies instructions specific to the current conversation, such as audience or response constraints. The three techniques address different layers of the requirement and work together.","whyNot":"Fine-tuning alone would make changing catalog facts difficult to maintain, and RAG alone would not reliably establish a distinctive brand style. Prompt engineering alone can guide tone and behavior but cannot give the model dependable access to a current private catalog.","takeaway":"Combine RAG for changing facts, fine-tuning for stable style, and prompts for request-specific guidance.","reviewNote":null,"docs":[{"title":"Customize a large language model","url":"https://learn.microsoft.com/en-us/azure/ai-foundry/openai/concepts/customizing-llms"}]},{"id":"QA-114","n":114,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":68,"question":"You have a Microsoft Foundry project that contains an agent. The agent generates summaries from retrieved policy documents. You need to improve response completeness. The solution must be implemented in the logic of the application code before responses are returned. What should you do?","options":[{"key":"A","text":"Add a retry evaluation before the responses are returned."},{"key":"B","text":"Decrease the value of the max_tokens parameter."},{"key":"C","text":"Switch to Retrieval Augmented Generation (RAG)."},{"key":"D","text":"Replace the model with a smaller deployment."}],"correct":["A"],"type":"mcq","answer":"A. Add a retry evaluation before responses are returned.","why":"A retry evaluation runs in application logic before the draft is returned to the user. It can test the response against completeness criteria, reject a draft that omits required clauses, and trigger regeneration. That feedback loop changes the delivered outcome rather than merely reporting a score. It directly matches the requirement for a pre-return application-code solution.","whyNot":"Logging or offline evaluation can reveal incomplete answers but cannot correct the current response. Changing temperature or token limits does not verify that each required clause appears, so those settings do not provide the required completeness gate.","takeaway":"To improve completeness before delivery, evaluate the draft and retry or regenerate when it fails.","reviewNote":null,"docs":[{"title":"RAG evaluators","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"},{"title":"Implement agent reflection and planning cycles","url":"https://learn.microsoft.com/en-us/training/modules/aaai-design-agentic-loops-azure-ai-agent-service/4-implement-agent-reflection-planning-cycles"}]},{"id":"QA-115","n":115,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":68,"question":"… After you answer a question in this section, you will NOT be able to return. As a result, these questions do not appear on the Review Screen. You have a Microsoft Foundry project that contains an agent. The agent generates summaries from retrieved policy documents. Users report that some responses omit required regulatory clauses, even when the clauses are present in the retrieved content. You need to improve response completeness. Solution: You increase the value of the max_tokens parameter. Does this meet the goal?","options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"correct":["B"],"type":"mcq","answer":"B. No","why":"`max_tokens` sets an upper bound on the generated response length. Increasing it helps only when required content is missing because the response was cut off at that limit. The scenario says clauses are omitted even though they are available in retrieved content, which points to content selection or validation rather than simple truncation. A larger limit therefore does not ensure inclusion of the clauses.","whyNot":"A completeness check, reflection pass, or retry can explicitly detect and correct missing clauses. Temperature and token limits affect generation behavior or capacity but do not validate coverage of required regulatory content.","takeaway":"Increase `max_tokens` for truncation, not for logical omissions that require completeness validation.","reviewNote":null,"docs":[{"title":"RAG evaluators","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"}]},{"id":"QA-116","n":116,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":69,"question":"… As a result, these questions do not appear on the Review Screen. You have a Microsoft Foundry project that contains an agent. The agent generates summaries from retrieved policy documents. Users report that some responses omit required regulatory clauses, even when the clauses are present in the retrieved content. You need to improve response completeness. Solution: You add a reflection pass that regenerates the response if the required clauses are missing. Does this meet the goal?","options":[{"key":"A","text":"Yes"},{"key":"B","text":"No"}],"correct":["A"],"type":"mcq","answer":"A. Yes","why":"A reflection pass examines the initial draft against the stated requirements before release. It can identify that a required regulatory clause is absent and ask the model to regenerate or revise the answer. This creates a corrective loop tied to the exact completeness defect. Because the revised response is produced before return, the solution meets the goal.","whyNot":"A one-time evaluator that only records a score detects the problem without fixing it. Higher temperature or a larger token budget does not explicitly compare the draft with the required-clause checklist.","takeaway":"Use reflection plus regeneration when the agent must self-check and repair missing required content.","reviewNote":null,"docs":[{"title":"Implement agent reflection and planning cycles","url":"https://learn.microsoft.com/en-us/training/modules/aaai-design-agentic-loops-azure-ai-agent-service/4-implement-agent-reflection-planning-cycles"},{"title":"RAG evaluators","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"}]},{"id":"QA-117","n":117,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":69,"question":"You have a Microsoft Foundry project that contains an agent. The agent generates summaries from retrieved policy documents. You need to improve response completeness. The solution must be implemented in the logic of the application code before responses are returned. What should you do?","options":[{"key":"A","text":"Add a retry evaluation before the responses are returned."},{"key":"B","text":"Decrease the value of the temperature parameter."},{"key":"C","text":"Increase the value of the presence_penalty parameter"},{"key":"D","text":"Replace the model with a smaller deployment."}],"correct":["A"],"type":"mcq","answer":"A. Add a retry evaluation before the responses are returned.","why":"A retry evaluation is placed in the application's pre-return path. It evaluates the generated summary for required content and rejects an incomplete draft. The application can then regenerate and evaluate again before exposing a response to the user. This directly implements a completeness control in code, as the question requires.","whyNot":"Changing temperature, reasoning effort, or token limits may alter generation but does not verify clause coverage. Post-production monitoring can identify a quality trend, yet it cannot repair the response that is about to be returned.","takeaway":"When application logic must enforce completeness, add a pre-return evaluator that retries failed drafts.","reviewNote":null,"docs":[{"title":"RAG evaluators","url":"https://learn.microsoft.com/en-us/azure/foundry/concepts/evaluation-evaluators/rag-evaluators"},{"title":"Implement agent reflection and planning cycles","url":"https://learn.microsoft.com/en-us/training/modules/aaai-design-agentic-loops-azure-ai-agent-service/4-implement-agent-reflection-planning-cycles"}]},{"id":"QA-118","n":118,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":70,"question":"… Uses AzureAIOpenTelemetryTracer(connection_string=..., enable_content_recording=False) Passes the tracer by using config={“callbacks”:[azure_tracer]} Company policy has the following requirements: Telemetry from LangChain and OpenTelemetry must be distinguishable within the same Application Insights resource. Secrets and credentials must NOT be stored in prompts, tool arguments, or span attributes. For each of the following statements, select Yes if the statement is true. Otherwise, select No. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"Cannot determine the Yes/No selections because the statements in the answer area are omitted.","why":"The source describes relevant tracing facts but omits the actual Yes/No statements that must be judged. LangChain and OpenTelemetry telemetry can share Application Insights while remaining distinguishable through appropriate telemetry resource identity. Disabling content recording reduces captured prompt and response content, but it does not make it safe to place secrets in prompts, tool arguments, or span attributes. Because the propositions are missing, those facts cannot be mapped to an exact answer sequence.","whyNot":"Any proposed Yes/No sequence would guess what the omitted statements say. It would also be wrong to assume that `enable_content_recording=False` permits secrets in instrumented application data, because secrets should not be inserted into those fields at all.","takeaway":"Separate telemetry sources with resource identity, disable content capture when required, and never infer missing hotspot statements.","reviewNote":"The source PDF omits part or all of the exhibit/answer area. Use the original visual source to confirm the exact hotspot selection.","docs":[{"title":"Configure tracing for AI agent frameworks","url":"https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-framework"},{"title":"Set up tracing in Microsoft Foundry","url":"https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-setup"}]},{"id":"QA-119","n":119,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":70,"question":"You have a Microsoft Foundry project that contains a high-traffic agent. After a recent update, operational costs increase significantly. Monitoring confirms that the volume of user traffic to the agent remains unchanged. You suspect that changes to the request or response characteristics are causing the increase. You need to identify whether the additional costs are driven by the model input size, the model output size, or expanded tool usage. Which observability capability should you use?","options":[{"key":"A","text":"latency"},{"key":"B","text":"evaluation metrics"},{"key":"C","text":"run success rate"},{"key":"D","text":"token usage"}],"correct":["D"],"type":"mcq","answer":"D. Token usage","why":"Model charges are closely related to the number of input and output tokens processed. Token-usage telemetry separates prompt consumption from generated completion consumption, letting the team see which side grew after the update. Combined with run details, it can also reveal additional model interactions associated with expanded tool use. Since traffic volume is unchanged, per-request token growth is the relevant cost signal.","whyNot":"Run count would mainly confirm the already-known traffic volume, and latency does not directly explain whether input or output size increased. Error rate measures reliability, while groundedness measures answer support rather than billable consumption.","takeaway":"When cost rises without more traffic, compare input and output token usage per run.","reviewNote":null,"docs":[{"title":"Monitor agents with the Agent Monitoring Dashboard","url":"https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/how-to-monitor-agents-dashboard"},{"title":"Azure OpenAI monitoring data reference","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/monitor-openai-reference"}]},{"id":"QA-120","n":120,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":71,"question":"You have a Microsoft Foundry project that contains a prompt agent used by a customer support web app. The agent is invoked from a Python service that does NOT run in the Foundry portal. You need to implement end-to-end tracing to capture latency breakdowns and exceptions across agent runs. Which two components can you use? Each correct answer presents a complete solution. NOTE: Each correct selection is worth one point.","options":[{"key":"A","text":"a Log Analytics workspace"},{"key":"B","text":"Application Insights"},{"key":"C","text":"OpenTelemetry"},{"key":"D","text":"the Azure Monitor Agent"},{"key":"E","text":"Microsoft Sentinel"}],"correct":["B","C"],"type":"mcq","answer":"B and C. Application Insights and OpenTelemetry","why":"OpenTelemetry provides the instrumentation and context propagation needed to create spans across the external Python service and agent operations. Application Insights receives, stores, queries, and visualizes those traces. Used together, they expose latency breakdowns and exceptions across the end-to-end request path. The fact that the caller runs outside the Foundry portal makes client-side instrumentation especially important.","whyNot":"Model evaluations score response quality but do not provide distributed request traces. Azure AI Search and Content Safety are workload services, not general tracing backends, and portal-only views cannot capture uninstrumented external application code.","takeaway":"For end-to-end tracing from external code, instrument with OpenTelemetry and send the telemetry to Application Insights.","reviewNote":null,"docs":[{"title":"Add client-side tracing to Foundry agents","url":"https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-client-side"},{"title":"Set up tracing in Microsoft Foundry","url":"https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-setup"}]},{"id":"QA-121","n":121,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":71,"question":"You have a web app named App1 that processes user prompts by integrating with a Microsoft Foundry project named Project1. App1 performs the following actions: • Sends prompts directly to a model by using the Azure OpenAI Responses API • Invokes the Azure AI Content Safety tool by using a Foundry connection within the same request You need to configure end-to-end visibility into each step of the request workflow. What should you do?","options":[{"key":"A","text":"Enable logging by using the client SDK for Content Safety."},{"key":"B","text":"Enable logging by using Foundry Local."},{"key":"C","text":"Enable application tracing in Project1."},{"key":"D","text":"Route requests through the Azure OpenAI endpoint."}],"correct":["C"],"type":"mcq","answer":"C. Enable application tracing in Project1.","why":"Application tracing records the operations that make up a request through the Foundry project. In this scenario, that request includes a direct Responses API model call and a Content Safety tool invocation through a project connection. Enabling tracing provides correlated visibility into the model and tool portions instead of treating them as unrelated events. The requirement is observability across workflow steps, which is exactly what tracing supplies.","whyNot":"Evaluation measures output quality after or during testing but does not show the operational sequence of model and tool calls. Token monitoring covers consumption, and Content Safety logs cover moderation activity; neither alone gives end-to-end correlated workflow visibility.","takeaway":"Enable application tracing to correlate model and connected-tool steps within a Foundry request.","reviewNote":null,"docs":[{"title":"Build agents using the Responses API","url":"https://learn.microsoft.com/en-us/azure/foundry/agents/quickstarts/responses-api"},{"title":"Add client-side tracing to Foundry agents","url":"https://learn.microsoft.com/en-us/azure/foundry/observability/how-to/trace-agent-client-side"}]},{"id":"QA-122","n":122,"domain":"Domain 2","domainTitle":"Generative AI and agentic solutions","sourcePage":72,"question":"You have a Microsoft Foundry project that serves a high-volume chat app. Most requests are simple FAQs, but some require advanced reasoning. You need to reduce costs and latency for common queries, without degrading the quality of the responses to complex questions. What should you do?","options":[{"key":"A","text":"Route all the requests to a smaller model."},{"key":"B","text":"Use a model cascade that routes the requests to different models."},{"key":"C","text":"Increase the value of the max_tokens parameter for all the requests."},{"key":"D","text":"Route all the requests to the most capable model."}],"correct":["B"],"type":"mcq","answer":"B. Use a model cascade/model router that routes requests to different models.","why":"A model router or cascade classifies request complexity and selects an appropriate model. Simple FAQ requests can go to a faster, lower-cost model, reducing the average latency and spend. Complex requests can still be sent to a stronger reasoning model, preserving answer quality where capability matters. The mixed workload in the scenario is the classic signal for complexity-aware routing.","whyNot":"Sending every request to the strongest model preserves quality but misses the cost and latency goal. Sending every request to a small model risks degrading complex answers, while random or round-robin routing ignores query difficulty.","takeaway":"Use model routing when a workload mixes cheap simple queries with complex queries that still need a stronger model.","reviewNote":null,"docs":[{"title":"Model router for Microsoft Foundry","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/model-router"}]},{"id":"QA-123","n":123,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":73,"question":"You have a Microsoft Foundry project that contains an agent and an image generation model deployment. The agent generates original images from user-supplied product photos. You need to ensure that the generated images maintain the product identity and visual characteristics of the provided photo. What should you do?","options":[{"key":"A","text":"Set the input_fidelity parameter to high."},{"key":"B","text":"Apply a groundedness detection filter."},{"key":"C","text":"Include a prompt and input image in the request."},{"key":"D","text":"Decrease the value of the temperature parameter."}],"correct":["A"],"type":"mcq","answer":"A. Set input_fidelity to high.","why":"Input fidelity controls how strongly a supported image model preserves characteristics from supplied input images during generation or editing. Setting it to high makes preservation of product identity, appearance, and visual details a priority. That directly matches the requirement to create a new image while retaining the supplied product's defining characteristics. The setting is appropriate only where the selected image model supports it.","whyNot":"Changing output size affects resolution, not faithfulness to the source product. Prompt detail can help describe the desired scene, but it is less direct than the dedicated input-fidelity control for preserving source-image features.","takeaway":"For supported image models, choose high input fidelity when source-image identity must be preserved.","reviewNote":null,"docs":[{"title":"Azure OpenAI image generation models","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"}]},{"id":"QA-124","n":124,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":73,"question":"You have an Azure subscription. You plan to build an app that will use the Azure AI DALL-E model. You need to deploy the model. What should you use?","options":[{"key":"A","text":"the Azure SDK for Python and PowerShell cmdlets."},{"key":"B","text":"the Azure SDK for JavaScript and Azure Machine Learning Studio."},{"key":"C","text":"Microsoft Foundry and the Azure Command Line Interface (CLI)"},{"key":"D","text":"the Azure portal and Microsoft Graph API"}],"correct":[],"type":"review","answer":"No listed option in the current service. DALL-E 3 is retired; deploy a GPT Image model instead, using Microsoft Foundry or Azure CLI.","why":"The preserved answer reflects the current service state: DALL-E 3 is retired and cannot be newly deployed. A deployment method cannot make a retired model available, even if that method works for supported image models. The practical replacement is a GPT Image model deployed through a supported Foundry deployment path. The question's older premise therefore has no valid listed deployment choice now.","whyNot":"Portal, CLI, or infrastructure-as-code options are only deployment mechanisms; none overrides model retirement. Option C may describe a valid route for a supported model, but it cannot satisfy the explicit requirement to deploy DALL-E after retirement.","takeaway":"Validate model availability first: a retired model has no valid deployment option, so select a supported successor.","reviewNote":null,"docs":[{"title":"Azure OpenAI image generation models","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"},{"title":"Deploy models using Azure CLI and Bicep","url":"https://learn.microsoft.com/en-us/azure/foundry/foundry-models/how-to/create-model-deployments"}]},{"id":"QA-125","n":125,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":74,"question":"You want to find a model in Microsoft Foundry to generate images. Which inference task should you filter by?","options":[{"key":"A","text":"Text to image"},{"key":"B","text":"Image to text"},{"key":"C","text":"Embeddings"}],"correct":["A"],"type":"mcq","answer":"A. Text to image.","why":"An image-generation model accepts a natural-language description and produces visual output. In the model catalog, that input-output relationship is categorized as text to image. Filtering by that inference task narrows the catalog to models designed for image creation. The clue is the goal to generate images rather than analyze existing ones.","whyNot":"Image to text describes captioning or visual analysis, which produces text from an image. Embeddings produce vectors for similarity tasks, and text generation produces language rather than image pixels.","takeaway":"Filter by Text to image when the desired model turns a prompt into a generated image.","reviewNote":null,"docs":[{"title":"Azure OpenAI image generation models","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"}]},{"id":"QA-126","n":126,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":74,"question":"Which OpenAI API can you use with image-generation models?","options":[{"key":"A","text":"Video"},{"key":"B","text":"Image"},{"key":"C","text":"Graphics"}],"correct":["B"],"type":"mcq","answer":"B. Image API.","why":"OpenAI image-generation models are accessed through the Images API family. That API supports image creation and, for compatible models, image-editing operations. The endpoint and request shape are designed for image inputs and outputs rather than conversational text alone. The question asks for the API category, so Image API is the direct match.","whyNot":"Chat Completions and Responses APIs primarily orchestrate conversational or multimodal model interactions and are not the named image-generation API in this question. Video and Graphics are not applicable OpenAI API categories for these image models.","takeaway":"Use the Images API for supported OpenAI image generation and image editing operations.","reviewNote":null,"docs":[{"title":"Azure OpenAI image generation models","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"}]},{"id":"QA-127","n":127,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":75,"question":"… • Users that interact with Agent1 must have a personalized experience in future interactions, including the ability for Agent1 to retain conversation context and recall relevant information from previous interactions. • Agent1 must answer questions only about the products sold by Contoso. You need to ensure that the marketing department can generate videos by using the model deployed to Project2. How should you complete the Python code? To answer, select the appropriate options in the answer area. NOTE: Each correct selection is worth one point.","options":[],"correct":[],"type":"review","answer":"None","why":"The text-only source omits the Python code and the selectable values needed to complete it. The available Sora information establishes only the general pattern of creating an asynchronous video job, checking its status, and downloading the result. That general mechanism does not reveal which missing expressions belong in each hotspot. Preserving `None` avoids inventing code selections that cannot be verified.","whyNot":"No named code distractors can be compared because neither the blanks nor the choices are present. Supplying a plausible SDK method sequence would still be unsupported, since exact API names and field positions are what the hotspot is testing.","takeaway":"For missing code hotspots, preserve the unresolved answer even when the general service workflow is known.","reviewNote":"The source PDF omits part or all of the exhibit/answer area. Use the original visual source to confirm the exact hotspot selection.","docs":[{"title":"Sora 2 video generation overview","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/video-generation"}]},{"id":"QA-128","n":128,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":78,"question":"What video durations does Sora 2 support?","options":[{"key":"A","text":"1 to 20 seconds in 1-second increments"},{"key":"B","text":"4, 8, or 12 seconds"},{"key":"C","text":"Any duration up to 60 seconds"}],"correct":["B"],"type":"mcq","answer":"B. 4, 8, or 12 seconds.","why":"Sora 2 supports a fixed set of clip durations rather than an arbitrary number of seconds. The documented choices are 4, 8, and 12 seconds, with 4 seconds as the default. Therefore the option listing all three supported values is correct. The recognition clue is a question about allowed API duration values, not editing or playback length.","whyNot":"A single value such as 4 seconds describes the default but not the full supported set. Other durations outside 4, 8, and 12 seconds do not match the accepted duration choices for the service described.","takeaway":"Remember Sora 2's supported clip durations as 4, 8, or 12 seconds.","reviewNote":null,"docs":[{"title":"Create a video","url":"https://learn.microsoft.com/en-us/azure/foundry/reference/rest/video-generation-create-video"}]},{"id":"QA-129","n":129,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":78,"question":"What is required when using a reference image with Sora 2?","options":[{"key":"A","text":"The image must be smaller than 1 MB"},{"key":"B","text":"The image resolution must match the target video size"},{"key":"C","text":"The image must contain at least one human face"}],"correct":["B"],"type":"mcq","answer":"B. The image resolution must match the target video size.","why":"A Sora 2 reference image establishes the initial visual frame or guidance for the generated clip. The service requires that image's resolution to match the requested target video size so the visual input aligns with the output frame. This makes resolution matching a request-validity requirement, not merely a quality preference. Supported image file formats do not remove that size requirement.","whyNot":"Matching only the aspect ratio is insufficient when the service requires the actual resolution to match. Converting the image to a particular supported format may address file compatibility, but it does not correct a mismatch between source-image dimensions and target video size.","takeaway":"When Sora 2 uses a reference image, match its resolution to the requested video resolution.","reviewNote":null,"docs":[{"title":"Sora 2 video generation overview","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/video-generation"}]},{"id":"QA-130","n":130,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":79,"question":"You are creating an image-editing workflow in a Microsoft Foundry project. The workflow must meet the following requirements: Ensure that background objects can be removed by applying a mask-based inpainting edit. Preserve the original lighting and style of the edited images. Use the built-in image editing controls, NOT a custom model. You need to ensure that image edits apply exclusively inside the masked area. How should you configure the workflow?","options":[{"key":"A","text":"Set generation mode to image_variation and provide the original image as a reference."},{"key":"B","text":"Enable text_to_image mode and a prompt describing the desired background removal."},{"key":"C","text":"Enable image_to_image mode and a high-strength value to regenerate the full image based on"},{"key":"D","text":"Enable mask_inpainting and supply both the input image and a mask indicating"}],"correct":["D"],"type":"mcq","answer":"D. Supply the input image and a mask that identifies the area to modify.","why":"Mask-based editing gives the image service both the original pixels and an explicit spatial boundary for the requested change. The prompt describes what should replace the background object, while the mask identifies where that change is allowed. Pixels outside the masked region remain anchored to the input image, which helps preserve the original lighting, composition, and style. This directly matches the requirement to use built-in inpainting controls and edit only the selected area.","whyNot":"Regenerating the whole image could alter unmasked objects, lighting, or style, so it is not a targeted edit. Prompt text alone describes the desired result but does not provide a precise spatial boundary; a custom model is unnecessary because the built-in image edit supports an image and mask.","takeaway":"For a localized image change, provide the original image plus a mask that marks the only region the service may modify.","reviewNote":null,"docs":[{"title":"Azure OpenAI image generation models","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"},{"title":"Create an image edit","url":"https://learn.microsoft.com/en-us/azure/foundry/reference/rest/images-create-image-edit-multipart-images-create-image-edit-json"}]},{"id":"QA-131","n":131,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":79,"question":"You have a Microsoft Foundry project that generates product marketing images from text prompts. After publishing several images, the legal team at your company identifies a competitor’s logo on a sign in the background of an image. You need to remove only the logo, while preserving the rest of the image. What should you do?","options":[{"key":"A","text":"Apply a mask-based inpainting edit to the part of the image that contains the logo."},{"key":"B","text":"Increase the prompt guidance strength."},{"key":"C","text":"Modify the original prompt to exclude brand names."},{"key":"D","text":"Rerun the prompt by using a different random seed."}],"correct":["A"],"type":"mcq","answer":"A. Apply a mask-based inpainting edit to the region containing the logo.","why":"Inpainting is designed to replace content inside a selected image region while retaining the surrounding composition. A mask drawn over the competitor logo gives the edit operation the exact area that must change. The prompt can request removal or replacement of that logo, while the rest of the approved marketing image remains the visual reference. This is the narrowest operation that satisfies the requirement to remove only the logo.","whyNot":"Generating a new image from the original prompt risks changing the product, background, or visual style. Cropping would remove part of the composition rather than repair it, and changing the prompt without a mask would not reliably isolate the logo region.","takeaway":"Use mask-based inpainting whenever one small region must change and the rest of an image must be preserved.","reviewNote":null,"docs":[{"title":"Azure OpenAI image generation models","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/dall-e"}]},{"id":"QA-132","n":132,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":80,"question":"You have a Microsoft Foundry project that generates short promotional product videos. After several clips are approved, reviewers notice a small watermark in the top-right corner of some videos. You need to remove the watermark without regenerating the videos. What should you do?","options":[{"key":"A","text":"Modify the original prompt to exclude watermarks."},{"key":"B","text":"Crop the video by using the size parameter."},{"key":"C","text":"Increase the guidance scale."},{"key":"D","text":"Apply a mask-based inpainting edit to the affected part of the video."}],"correct":[],"type":"review","answer":"No listed option. The documented Sora 2 editing mechanism is remix, which creates a new video generation; Microsoft does not document in-place, mask-based video inpainting for removing a watermark from an already approved clip.","why":"The requested operation requires modifying an already approved video in place and explicitly forbids regeneration. The documented Sora 2 editing path is remix, which uses an existing video as the basis for a new generated result rather than patching pixels in the original file. No documented built-in mask-based video inpainting operation meets both constraints. Therefore the technically accurate answer is that none of the listed choices satisfies the requirement.","whyNot":"A remix can make targeted creative changes, but it still produces a newly generated video and therefore violates the no-regeneration condition. Image inpainting applies to still images, while unrelated options such as prompt changes or audio editing cannot remove a visual watermark from an existing clip.","takeaway":"If a video must be altered without any regeneration, do not treat Sora remix as in-place masked editing.","reviewNote":null,"docs":[{"title":"Sora 2 video generation overview","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/video-generation"},{"title":"Create a video remix","url":"https://learn.microsoft.com/en-us/azure/foundry/reference/rest/video-generation-create-video-remix"}]},{"id":"QA-133","n":133,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":80,"question":"What is the remix feature used for in Sora 2?","options":[{"key":"A","text":"Combining multiple videos into one"},{"key":"B","text":"Making targeted adjustments to an existing video without regenerating from"},{"key":"C","text":"Adding background music to generated videos"}],"correct":["B"],"type":"mcq","answer":"B. Make targeted adjustments to an existing video without starting from scratch.","why":"Remix starts from a completed Sora video rather than requiring the creator to reproduce the scene from an empty prompt. The updated prompt tells the model which aspect to change while the source video supplies continuity in structure, motion, and framing. This makes remix suitable for focused revisions to an existing result. It is still a new generation based on that video, not an in-place edit of the original file.","whyNot":"Combining separate clips is video composition, not the purpose of remix. Adding music is an audio-production task, and generating an unrelated scene from scratch would not reuse the completed video's visual structure.","takeaway":"Choose remix when a Sora result should be revised using the existing video as the starting point.","reviewNote":null,"docs":[{"title":"Sora 2 video generation overview","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/concepts/video-generation"},{"title":"Create a video remix","url":"https://learn.microsoft.com/en-us/azure/foundry/reference/rest/video-generation-create-video-remix"}]},{"id":"QA-134","n":134,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":81,"question":"… User messages can contain both text and images. Currently, App1 includes image URL: as plain text inside the message content so the model cannot recognize them as images. Traces show that the requests contain a single text message instead of a multimodal content array. You need to send the message as a structured array that includes both the text portion and the image reference to ensure that the model can process the image correctly. What should you do?","options":[{"key":"A","text":"Set the user message content array to include items that have type: text and type:"},{"key":"B","text":"Encode the image to base64 and include the encoded data inside the content string of the user"},{"key":"C","text":"Add the image URL to the request metadata section, so the model can resolve the processing"},{"key":"D","text":"Place the image URL inside the System Message and set type to image_url so the model loads"}],"correct":["A"],"type":"mcq","answer":"A. Use a user-message content array containing text and image_url parts.","why":"A vision-capable chat model distinguishes text from images through typed content parts in a user message. A text part carries the user's question, and an image_url part carries the image reference that the model should inspect. Placing both parts in one content array associates the visual input with the question in the same turn. This corrects the trace symptom in which the image URL appeared only as ordinary text.","whyNot":"Embedding the URL in a plain text string does not declare it as visual input, so the model may only read the characters of the URL. Metadata is not the multimodal message channel, and separate unassociated messages can lose the intended relationship between the question and image.","takeaway":"For multimodal chat, send typed text and image parts together in the user message content array.","reviewNote":null,"docs":[{"title":"How to use vision-enabled chat models","url":"https://learn.microsoft.com/en-us/azure/foundry/openai/how-to/gpt-with-vision"},{"title":"Microsoft Foundry REST reference - Azure OpenAI Chat","url":"https://learn.microsoft.com/en-us/rest/api/aifoundry/azureopenai/chat"}]},{"id":"QA-135","n":135,"domain":"Domain 3","domainTitle":"Computer vision solutions","sourcePage":81,"question":"Which kind of model can you use to respond to visual input?","options":[{"key":"A","text":"Only OpenAI GPT models"},{"key":"B","text":"Embedding models"},{"key":"C","text":"Multimodal models"}],"correct":["C"],"type":"mcq","answer":"C. Multimodal models.","why":"A multimodal model is trained to accept and reason over more than one type of input. In this case, the decisive modality is an image, potentially combined with a text question. The model can interpret the visual content and then produce a natural-language response. That capability directly matches the requirement to respond
